<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>陰陽の狭間で | レバー操作</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      touch-action: none; /* タッチパンやズームを無効化 */
    }

    body {
      background: #0a0a1a;
      color: #f4f1ea;
      font-family: "Noto Sans JP", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .game-container {
      text-align: center;
      background: #111122;
      border-radius: 24px;
      padding: 16px 16px 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border: 1px solid #2a2a4a;
      position: relative;
    }

    h1 {
      font-size: 1.5rem;
      letter-spacing: 0.2em;
      margin-bottom: 4px;
      color: #c8a96e;
    }

    .subtitle {
      font-size: 0.6rem;
      color: #6a6a8a;
      margin-bottom: 12px;
      letter-spacing: 0.2em;
    }

    canvas {
      display: block;
      margin: 0 auto;
      border-radius: 12px;
      box-shadow: 0 0 0 2px #2a2a4a, 0 8px 20px rgba(0,0,0,0.3);
      cursor: default;
      touch-action: none;
    }

    .info-panel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin: 12px 16px 8px;
      padding: 6px 12px;
      background: #0d0d1a;
      border-radius: 60px;
      border: 1px solid #2a2a4a;
    }

    .score-box {
      background: #1a1a2e;
      padding: 4px 12px;
      border-radius: 40px;
      font-size: 1rem;
      font-weight: bold;
      color: #c8a96e;
    }

    .score-box span {
      color: #fff;
      font-size: 1.2rem;
      margin-right: 4px;
    }

    .attribute {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .attr-badge {
      display: flex;
      align-items: center;
      gap: 4px;
      background: #1a1a2e;
      padding: 3px 10px;
      border-radius: 40px;
      font-size: 0.7rem;
    }

    .light-dot, .dark-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
    .light-dot { background: #e0e0ff; box-shadow: 0 0 4px #aaaaff; }
    .dark-dot { background: #2a2a4a; border: 1px solid #6a6a9a; }

    .restart-btn {
      background: #1a1a2e;
      border: 1px solid #c8a96e;
      color: #c8a96e;
      padding: 6px 20px;
      border-radius: 999px;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 6px;
    }

    .back-link {
      color: #c8a96e;
      font-size: 0.7rem;
      text-decoration: none;
      margin-top: 10px;
      display: inline-block;
      opacity: 0.7;
    }

    .controls {
      font-size: 0.6rem;
      color: #6a6a8a;
      margin-top: 8px;
    }

    /* ジョイスティック (レバー) のスタイル */
    .joystick-container {
      position: fixed;
      bottom: 30px;
      left: 30px;
      width: 110px;
      height: 110px;
      background: rgba(20, 25, 40, 0.85);
      backdrop-filter: blur(8px);
      border-radius: 999px;
      border: 2px solid #c8a96e;
      box-shadow: 0 5px 15px rgba(0,0,0,0.5);
      touch-action: none;
      z-index: 50;
    }
    .joystick-base {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .joystick-handle {
      position: absolute;
      width: 50px;
      height: 50px;
      background: radial-gradient(circle at 30% 30%, #e6d5a8, #c8a96e);
      border-radius: 999px;
      box-shadow: 0 0 8px rgba(200,169,110,0.6);
      cursor: grab;
      transition: transform 0.02s linear;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }
    .joystick-handle:active {
      cursor: grabbing;
    }
    @media (max-width: 600px) {
      .joystick-container { width: 90px; height: 90px; bottom: 20px; left: 20px; }
      .joystick-handle { width: 42px; height: 42px; }
    }
    .warning-tip {
      background: #440000aa;
      color: #ffaa88;
      border-radius: 40px;
      padding: 2px 12px;
      font-size: 0.65rem;
      margin-top: 4px;
      display: inline-block;
    }
  </style>
</head>
<body>
<div class="game-container">
  <h1>陰陽の狭間で</h1>
  <div class="subtitle">— ジョイスティック操作 —</div>

  <canvas id="gameCanvas" width="900" height="550"></canvas>

  <div class="info-panel">
    <div class="score-box"><span>⏱️</span> <span id="timerDisplay">00</span></div>
    <div class="attribute">
      <div class="attr-badge"><div class="light-dot"></div><span id="attrStatus">白属性</span></div>
      <span style="color:#4a4a6a">⇄</span>
      <div class="attr-badge"><div class="dark-dot"></div><span>黒属性</span></div>
    </div>
    <div class="score-box"><span>✨</span> <span id="scoreDisplay">0</span></div>
  </div>

  <div id="warningMsg" class="warning-tip" style="display: none;">⚠️ 境界の歪み</div>
  <button class="restart-btn" onclick="restartGame()">再起動</button>
  <div class="controls">
    🕹️ 左下のレバーをドラッグ → 左右に連続移動<br>
    ⚫⚪ 同じ色の弾/歯車/ミサイルは無害 | 異なる色は即死
  </div>
  <a href="index.html" class="back-link">← ポートフォリオに戻る</a>
</div>

<!-- レバー要素 -->
<div class="joystick-container" id="joystickContainer">
  <div class="joystick-base"></div>
  <div class="joystick-handle" id="joystickHandle"></div>
</div>

<script>
  (function(){
    // ----- キャンバス & コンテキスト -----
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let width = 900, height = 550;
    canvas.width = width;
    canvas.height = height;

    // ----- ゲーム状態 -----
    let gameRunning = true;
    let score = 0;
    let startTime = null;
    let timerInterval = null;
    
    // プレイヤー
    let player = {
      x: width/2,
      y: height - 60,
      radius: 14,
      attribute: 'white',
      invincible: 0,
      forcedAttributeTimer: 0
    };

    let enemies = [];      // 弾, 歯車, ミサイル
    let particle = [];

    let borderX = width/2;
    let frame = 0;
    let spawnCounter = 0;
    let baseSpawnDelay = 22;
    let intensity = 1;
    
    // 端ペナルティ
    let edgeResistTimer = 0;
    const EDGE_THRESHOLD = 70;
    const MAX_EDGE_TIME = 85;
    let edgeAlertLevel = 0;
    let homingIntensity = 0;

    // ----- レバー制御変数 -----
    let stickActive = false;
    let stickX = 0;          // -1 .. 1
    let stickY = 0;
    const MOVE_SPEED = 6.2;  // 1フレームあたりの移動ピクセル（最大）
    
    // DOM 要素
    const joystickContainer = document.getElementById('joystickContainer');
    const joystickHandle = document.getElementById('joystickHandle');
    let baseRect = joystickContainer.getBoundingClientRect();
    const maxDist = 38;      // ハンドルの移動半径(px) コンテナサイズに応じて調整
    
    // 更新用
    function updateJoystickRect() {
      baseRect = joystickContainer.getBoundingClientRect();
    }
    
    // ドラッグ処理 (タッチ＆マウス共用)
    function handleStart(e) {
      e.preventDefault();
      stickActive = true;
      updateJoystickRect();
      const point = getEventPoint(e);
      updateStickPosition(point);
    }
    
    function handleMove(e) {
      if (!stickActive) return;
      e.preventDefault();
      const point = getEventPoint(e);
      updateStickPosition(point);
    }
    
    function handleEnd(e) {
      e.preventDefault();
      stickActive = false;
      // スティックを中央に戻す (アニメーション)
      stickX = 0;
      stickY = 0;
      joystickHandle.style.transform = `translate(-50%, -50%)`;
    }
    
    function getEventPoint(e) {
      let clientX, clientY;
      if (e.touches) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
      } else {
        clientX = e.clientX;
        clientY = e.clientY;
      }
      return { x: clientX, y: clientY };
    }
    
    function updateStickPosition(point) {
      const centerX = baseRect.left + baseRect.width / 2;
      const centerY = baseRect.top + baseRect.height / 2;
      let dx = point.x - centerX;
      let dy = point.y - centerY;
      const distance = Math.hypot(dx, dy);
      let limited = Math.min(distance, maxDist);
      let angle = Math.atan2(dy, dx);
      let offsetX = Math.cos(angle) * limited;
      let offsetY = Math.sin(angle) * limited;
      // ハンドル位置更新
      joystickHandle.style.transform = `translate(calc(-50% + ${offsetX}px), calc(-50% + ${offsetY}px))`;
      // スティック値計算 (X方向のみ使用、Y方向は今回は速度に影響しない)
      let rawX = (distance === 0) ? 0 : (dx / maxDist);
      stickX = Math.min(1, Math.max(-1, rawX));
      // 遊び: 小さな値は0に
      if (Math.abs(stickX) < 0.08) stickX = 0;
    }
    
    // イベント登録 (タッチ & マウス)
    joystickContainer.addEventListener('touchstart', handleStart, { passive: false });
    window.addEventListener('touchmove', handleMove, { passive: false });
    window.addEventListener('touchend', handleEnd);
    joystickContainer.addEventListener('mousedown', handleStart);
    window.addEventListener('mousemove', handleMove);
    window.addEventListener('mouseup', handleEnd);
    
    // キャンバス上の従来のマウス移動を無効化（タップでの瞬間移動を完全に排除）
    canvas.addEventListener('mousemove', (e) => { e.preventDefault(); });
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); });
    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); });
    
    // ----- ゲームロジック (元のコードを継承・微調整) -----
    function formatTime(sec) { return String(Math.floor(sec)).padStart(2,'0'); }
    
    function updateUI() {
      document.getElementById('scoreDisplay').innerText = score;
      if(startTime !== null){
        let elapsed = Math.floor((Date.now() - startTime) / 1000);
        document.getElementById('timerDisplay').innerText = formatTime(elapsed);
      }
      let attrSpan = document.getElementById('attrStatus');
      let currentAttr = player.forcedAttributeTimer > 0 ? (player.attribute === 'white' ? '黒(反転)' : '白(反転)') : player.attribute === 'white' ? '白属性' : '黒属性';
      attrSpan.innerText = currentAttr;
      if(player.forcedAttributeTimer > 0) attrSpan.style.color = "#ffaa88";
      else attrSpan.style.color = "#d4d4ff";
    }
    
    function updatePlayerAttribute() {
      if(player.forcedAttributeTimer > 0) return;
      let newAttr = (player.x < borderX) ? 'white' : 'black';
      if(player.attribute !== newAttr){
        for(let i=0;i<12;i++) particle.push({ x: player.x + (Math.random()-0.5)*16, y: player.y + (Math.random()-0.5)*16, vx: (Math.random()-0.5)*2, vy: (Math.random()-0.5)*2-1, life: 0.6, color: newAttr === 'white' ? '#ccddff' : '#5566aa' });
      }
      player.attribute = newAttr;
    }
    
    // プレイヤー移動（レバー値に基づく）
    function updatePlayerMove() {
      if(!gameRunning) return;
      let delta = stickX * MOVE_SPEED;
      player.x += delta;
      player.x = Math.min(width - player.radius, Math.max(player.radius, player.x));
      if(player.forcedAttributeTimer <= 0) updatePlayerAttribute();
    }
    
    function updateEdgePenalty() {
      const isAtEdge = (player.x < EDGE_THRESHOLD || player.x > width - EDGE_THRESHOLD);
      if(isAtEdge && gameRunning){
        edgeResistTimer = Math.min(MAX_EDGE_TIME, edgeResistTimer + 1.6);
      } else {
        edgeResistTimer = Math.max(0, edgeResistTimer - 1.2);
      }
      let newLevel = 0;
      if(edgeResistTimer > MAX_EDGE_TIME * 0.35) newLevel = 1;
      if(edgeResistTimer > MAX_EDGE_TIME * 0.65) newLevel = 2;
      
      if(newLevel >= 2 && edgeAlertLevel < 2 && gameRunning){
        if(player.forcedAttributeTimer <= 0){
          player.forcedAttributeTimer = 140;
          player.attribute = (player.attribute === 'white') ? 'black' : 'white';
          for(let i=0;i<30;i++) particle.push({ x: player.x+(Math.random()-0.5)*30, y: player.y+(Math.random()-0.5)*20, vx: (Math.random()-0.5)*3, vy: (Math.random()-0.5)*3-1, life:0.7, color:'#ff8866' });
          const warnDiv = document.getElementById('warningMsg');
          warnDiv.style.display = 'inline-block';
          warnDiv.innerText = '⚠️ 陰陽逆転！強制反転！';
          setTimeout(() => { if(document.getElementById('warningMsg')) warnDiv.style.display = 'none'; }, 1800);
        }
      } else if(newLevel === 1 && edgeAlertLevel < 1 && gameRunning){
        const warnDiv = document.getElementById('warningMsg');
        warnDiv.style.display = 'inline-block';
        warnDiv.innerText = '⚠️ 端に留まりすぎ！追尾強化';
        setTimeout(() => { if(document.getElementById('warningMsg') && edgeAlertLevel !==2) warnDiv.style.display = 'none'; }, 1300);
      }
      edgeAlertLevel = newLevel;
      homingIntensity = (edgeAlertLevel === 1 ? 0.2 : (edgeAlertLevel === 2 ? 0.45 : 0));
      
      if(player.forcedAttributeTimer > 0){
        player.forcedAttributeTimer--;
        if(player.forcedAttributeTimer === 0){
          let naturalAttr = (player.x < borderX) ? 'white' : 'black';
          if(player.attribute !== naturalAttr){
            player.attribute = naturalAttr;
            for(let i=0;i<15;i++) particle.push({ x: player.x, y: player.y, vx: (Math.random()-0.5)*2, vy: -2, life:0.5, color: '#aaccff'});
          }
        }
      }
    }
    
    // --- 敵生成 (同様) ---
    function addNormalBullet(){
      const attr = Math.random() < 0.5 ? 'white' : 'black';
      let x = 20 + Math.random() * (width - 40);
      let y = -16;
      let vx = (Math.random() - 0.5) * 1.2;
      let vy = 2.8 + Math.random() * 1.8 + intensity * 0.5;
      if(homingIntensity > 0 && gameRunning){
        let dx = player.x - x;
        let dy = player.y - y;
        let len = Math.hypot(dx, dy);
        if(len > 0.01){
          let normX = dx / len;
          let normY = dy / len;
          vx += normX * homingIntensity * 1.2;
          vy += normY * homingIntensity * 1.0;
          vx = Math.min(3.5, Math.max(-3.5, vx));
          vy = Math.min(7, Math.max(1.8, vy));
        }
      }
      enemies.push({ type: 'bullet', x, y, vx, vy, radius: 8, attribute: attr, rotation: 0 });
    }
    function addGear(){
      const attr = Math.random() < 0.5 ? 'white' : 'black';
      let x = 30 + Math.random() * (width - 60);
      let y = -20;
      let vx = (Math.random() - 0.5) * 0.8;
      let vy = 2.2 + Math.random() * 1.5 + intensity * 0.4;
      if(homingIntensity > 0 && gameRunning){
        let dx = player.x - x;
        let dy = player.y - y;
        let len = Math.hypot(dx, dy);
        if(len > 0.01){
          let normX = dx / len;
          let normY = dy / len;
          vx += normX * homingIntensity * 0.8;
          vy += normY * homingIntensity * 0.6;
          vx = Math.min(2.8, Math.max(-2.8, vx));
          vy = Math.min(6, Math.max(1.5, vy));
        }
      }
      enemies.push({ type: 'gear', x, y, vx, vy, radius: 10, attribute: attr, angle: Math.random() * Math.PI * 2, spin: 0.12 });
    }
    function addMissile(){
      const attr = Math.random() < 0.5 ? 'white' : 'black';
      let x = 40 + Math.random() * (width - 80);
      let y = -25;
      let vx = (Math.random() - 0.5) * 1.0;
      let vy = 2.5 + Math.random() * 1.2 + intensity * 0.3;
      enemies.push({ type: 'missile', x, y, vx, vy, radius: 7, attribute: attr, targetLock: 0, trail: [] });
    }
    function spawnEnemy(){
      let r = Math.random();
      if(r < 0.5) addNormalBullet();
      else if(r < 0.75) addGear();
      else addMissile();
      if(Math.random() < 0.25 + intensity * 0.05) {
        if(Math.random() < 0.6) addNormalBullet();
        else if(Math.random() < 0.7) addGear();
        else addMissile();
      }
    }
    
    function updateEnemies(){
      for(let i=0; i<enemies.length; i++){
        const e = enemies[i];
        if(e.type === 'missile' && gameRunning){
          let dx = player.x - e.x;
          let dy = player.y - e.y;
          let len = Math.hypot(dx, dy);
          if(len > 0.2){
            let normX = dx / len;
            let normY = dy / len;
            let homingPower = 0.025 + (homingIntensity * 0.06);
            e.vx += normX * homingPower;
            e.vy += normY * homingPower * 0.6;
            let maxSpeed = 5.5;
            let spd = Math.hypot(e.vx, e.vy);
            if(spd > maxSpeed){ e.vx = e.vx / spd * maxSpeed; e.vy = e.vy / spd * maxSpeed; }
          }
        }
        e.x += e.vx;
        e.y += e.vy;
        if(e.type === 'gear') e.angle += e.spin;
        if(e.type === 'missile' && frame % 3 === 0){
          e.trail = e.trail || [];
          e.trail.push({x: e.x, y: e.y, life: 0.5});
          for(let t of e.trail) t.life -= 0.05;
          e.trail = e.trail.filter(t => t.life > 0);
        }
        if(e.y > height + 60 || e.x < -60 || e.x > width + 60){
          if(e.y > height + 30 && e.attribute !== player.attribute && gameRunning){
            score++;
            updateUI();
          }
          enemies.splice(i,1);
          i--;
        }
      }
    }
    
    function checkCollisions(){
      if(player.invincible > 0){ player.invincible--; return; }
      for(let i=0; i<enemies.length; i++){
        const e = enemies[i];
        let r = (e.type === 'gear') ? 9 : (e.type === 'missile' ? 7 : 8);
        const dx = player.x - e.x;
        const dy = player.y - e.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if(dist < player.radius + r){
          if(e.attribute !== player.attribute){
            gameRunning = false;
            if(timerInterval) clearInterval(timerInterval);
            showGameOver();
            return;
          } else {
            for(let p=0;p<5;p++) particle.push({ x: e.x, y: e.y, vx: (Math.random()-0.5)*3, vy: (Math.random()-0.5)*3, life:0.4, color: e.attribute === 'white' ? '#aaccff' : '#8866aa' });
            enemies.splice(i,1);
            i--;
          }
        }
      }
    }
    
    function updateDifficulty(){
      let elapsed = startTime ? (Date.now() - startTime) / 1000 : 0;
      intensity = 1 + Math.floor(elapsed / 9) + Math.floor(score / 70);
      intensity = Math.min(6, intensity);
      let newDelay = Math.max(10, 26 - intensity * 2 - Math.floor(score/35));
      if(edgeAlertLevel >= 1) newDelay = Math.max(7, newDelay - 5);
      if(edgeAlertLevel >= 2) newDelay = Math.max(5, newDelay - 3);
      baseSpawnDelay = newDelay;
    }
    
    function updateParticles(){
      for(let i=0;i<particle.length;i++){
        particle[i].x += particle[i].vx;
        particle[i].y += particle[i].vy;
        particle[i].life -= 0.03;
        if(particle[i].life <= 0 || particle[i].y > height+50){
          particle.splice(i,1);
          i--;
        }
      }
    }
    
    function updateBorder(){
      let shift = Math.sin(Date.now() * 0.0008) * 8;
      let target = width/2 + shift;
      let pressure = Math.min(90, Math.floor(score / 18)) * (Math.sin(frame*0.01)*0.5 + 0.5);
      target += (player.attribute === 'white' ? -pressure*0.3 : pressure*0.3);
      target = Math.min(width - 70, Math.max(70, target));
      borderX = borderX * 0.96 + target * 0.04;
    }
    
    // 描画（前回とほぼ同じ、歯車/ミサイル等は維持、レバーは外部DOMで描画）
    function draw(){
      if(!ctx) return;
      const grad = ctx.createLinearGradient(0,0,width,0);
      grad.addColorStop(0, '#eef4ff');
      grad.addColorStop(borderX/width - 0.03, '#eef4ff');
      grad.addColorStop(borderX/width, '#1a1f33');
      grad.addColorStop(1, '#0a0a1a');
      ctx.fillStyle = grad;
      ctx.fillRect(0,0,width,height);
      
      ctx.beginPath();
      ctx.moveTo(borderX, 0);
      ctx.lineTo(borderX, height);
      ctx.lineWidth = 3;
      ctx.setLineDash([8, 10]);
      ctx.strokeStyle = '#c8a96e';
      ctx.stroke();
      ctx.setLineDash([]);
      
      if(edgeResistTimer > 0 && gameRunning){
        let percent = edgeResistTimer / MAX_EDGE_TIME;
        ctx.fillStyle = `rgba(255, 100, 80, ${0.4+percent*0.5})`;
        ctx.fillRect(width-100, height-18, 90 * percent, 8);
        ctx.strokeStyle = "#ffaa66";
        ctx.strokeRect(width-100, height-18, 90, 8);
      }
      
      ctx.globalAlpha = 0.15;
      for(let i=0;i<width;i+=40){
        ctx.beginPath();
        ctx.moveTo(i+(frame%40)*0.4, 0);
        ctx.lineTo(i+10+(frame%40)*0.4, height);
        ctx.strokeStyle = '#ddddee';
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
      
      for(let e of enemies){
        ctx.save();
        if(e.type === 'bullet'){
          ctx.beginPath(); ctx.arc(e.x, e.y, e.radius-1, 0, Math.PI*2);
          ctx.fillStyle = e.attribute === 'white' ? '#ffffff' : '#221133'; ctx.fill();
          ctx.beginPath(); ctx.arc(e.x, e.y, e.radius-2, 0, Math.PI*2);
          ctx.fillStyle = e.attribute === 'white' ? '#88aaff' : '#442266'; ctx.fill();
        } else if(e.type === 'gear'){
          ctx.translate(e.x, e.y); ctx.rotate(e.angle);
          for(let i=0;i<8;i++){
            let rad = i * Math.PI*2/8;
            let x1 = Math.cos(rad) * (e.radius);
            let y1 = Math.sin(rad) * (e.radius);
            let x2 = Math.cos(rad+0.5) * (e.radius-3);
            let y2 = Math.sin(rad+0.5) * (e.radius-3);
            ctx.beginPath();
            ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
            ctx.lineTo(Math.cos(rad+0.9)*(e.radius-6), Math.sin(rad+0.9)*(e.radius-6));
            ctx.fillStyle = e.attribute === 'white' ? '#bbddff' : '#663388';
            ctx.fill();
          }
          ctx.beginPath(); ctx.arc(0, 0, e.radius-4, 0, Math.PI*2);
          ctx.fillStyle = e.attribute === 'white' ? '#ffffff' : '#331155'; ctx.fill();
          ctx.setTransform(1,0,0,1,0,0);
        } else if(e.type === 'missile'){
          ctx.beginPath();
          ctx.moveTo(e.x + 8, e.y); ctx.lineTo(e.x - 5, e.y-4); ctx.lineTo(e.x - 2, e.y); ctx.lineTo(e.x - 5, e.y+4);
          ctx.fillStyle = e.attribute === 'white' ? '#eecc99' : '#994466'; ctx.fill();
          ctx.beginPath(); ctx.arc(e.x+2, e.y, 4, 0, Math.PI*2);
          ctx.fillStyle = e.attribute === 'white' ? '#ffaa66' : '#882244'; ctx.fill();
          if(e.trail){ for(let t of e.trail){ ctx.beginPath(); ctx.arc(t.x, t.y, 2, 0, Math.PI*2);
          ctx.fillStyle = `rgba(200,120,80,${t.life*0.6})`; ctx.fill(); } }
        }
        ctx.restore();
      }
      
      ctx.beginPath(); ctx.arc(player.x, player.y, player.radius, 0, Math.PI*2);
      let mainColor = player.attribute === 'white' ? '#ccddff' : '#332255';
      if(player.forcedAttributeTimer > 0) mainColor = '#cc8866';
      ctx.fillStyle = mainColor; ctx.fill();
      ctx.beginPath(); ctx.arc(player.x, player.y, player.radius-3, 0, Math.PI*2);
      ctx.fillStyle = player.attribute === 'white' ? '#fff' : '#8866aa'; ctx.fill();
      ctx.fillStyle = '#111';
      ctx.beginPath(); ctx.arc(player.x-5, player.y-2, 2, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(player.x+5, player.y-2, 2, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(player.x, player.y, player.radius+4, 0, Math.PI*2);
      ctx.fillStyle = player.attribute === 'white' ? 'rgba(200,200,255,0.2)' : 'rgba(80,60,120,0.3)'; ctx.fill();
      
      for(let p of particle){ ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, Math.PI*2); ctx.fillStyle = p.color || '#aaccff'; ctx.fill(); }
      ctx.font = "bold 12px 'Noto Sans JP'"; ctx.fillStyle = '#fff3dd'; ctx.fillText("光 領 域", 24, 44);
      ctx.fillStyle = '#bdafff'; ctx.fillText("闇 領 域", width-78, 44);
    }
    
    function showGameOver(){
      gameRunning = false;
      if(timerInterval) clearInterval(timerInterval);
      const resultDiv = document.createElement('div');
      resultDiv.style.position = 'fixed'; resultDiv.style.top = '0'; resultDiv.style.left = '0';
      resultDiv.style.width = '100%'; resultDiv.style.height = '100%';
      resultDiv.style.backgroundColor = 'rgba(0,0,0,0.85)';
      resultDiv.style.display = 'flex'; resultDiv.style.alignItems = 'center'; resultDiv.style.justifyContent = 'center';
      resultDiv.style.zIndex = '200';
      resultDiv.innerHTML = `<div style="background:#0d0d1a; border:1px solid #c8a96e; border-radius:24px; padding: 28px 32px; text-align:center;">
        <h2 style="color:#c8a96e;">散華</h2><p>混沌に飲まれた…</p>
        <p style="font-size:1.4rem; margin:12px 0;">🏆 スコア: ${score}</p>
        <p>生存: ${document.getElementById('timerDisplay').innerText} 秒</p>
        <button onclick="location.reload()" style="background:#c8a96e; border:none; padding:8px 24px; border-radius:999px; margin-top:16px;">再挑戦</button>
        <div style="margin-top:12px"><a href="index.html" style="color:#88aaff;">ポートフォリオに戻る</a></div>
      </div>`;
      document.body.appendChild(resultDiv);
    }
    
    window.restartGame = () => location.reload();
    
    function initGame(){
      gameRunning = true;
      score = 0;
      enemies = [];
      particle = [];
      player.x = width/2;
      player.y = height - 60;
      player.attribute = 'white';
      player.forcedAttributeTimer = 0;
      borderX = width/2;
      frame = 0; intensity = 1;
      edgeResistTimer = 0; edgeAlertLevel = 0; homingIntensity = 0;
      spawnCounter = 3;
      startTime = Date.now();
      updateUI();
      if(timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(()=>{ if(gameRunning) updateUI(); }, 200);
      for(let i=0;i<8;i++) setTimeout(()=> spawnEnemy(), i*180);
    }
    
    function gameLoop(){
      if(!gameRunning){ draw(); requestAnimationFrame(gameLoop); return; }
      frame++;
      updateDifficulty();
      updatePlayerMove();     // レバーに基づく移動
      updateEdgePenalty();
      if(spawnCounter <= 0){ spawnEnemy(); spawnCounter = baseSpawnDelay; if(Math.random() < 0.35 + intensity*0.07) spawnEnemy(); }
      else spawnCounter--;
      updateEnemies();
      updateBorder();
      updateParticles();
      checkCollisions();
      draw();
      requestAnimationFrame(gameLoop);
    }
    
    initGame();
    gameLoop();
  })();
</script>
</body>
</html>
