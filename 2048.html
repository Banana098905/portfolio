<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>2048 極致進化版 | 完全動作保証</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Segoe UI', 'Arial', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      flex-direction: column;
      background: var(--bg);
      transition: background 0.2s, color 0.2s;
      overflow: hidden;
      position: relative;
      padding: 16px;
    }

    /* 雨エフェクト（視覚的に優しく改良） */
    .rain-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .raindrop {
      position: absolute;
      width: 2px;
      background: rgba(200, 220, 255, 0.6);
      top: -20px;
      animation: fall linear infinite;
      border-radius: 2px;
    }

    @keyframes fall {
      to {
        transform: translateY(100vh);
        opacity: 0.2;
      }
    }

    /* ========== テーマ ========== */
    :root {
      --bg: #faf8ef;
      --board-bg: #bbada0;
      --cell-bg: #cdc1b4;
      --text: #776e65;
      --tile-2-bg: #eee4da;
      --tile-4-bg: #ede0c8;
      --tile-8-bg: #f2b179;
      --tile-16-bg: #f59563;
      --tile-32-bg: #f67c5f;
      --tile-64-bg: #f65e3b;
      --tile-128-bg: #edcf72;
      --tile-256-bg: #edcc61;
      --tile-512-bg: #edc850;
      --tile-1024-bg: #edc53f;
      --tile-2048-bg: #edc22e;
      --tile-color-light: #f9f6f2;
      --tile-color-dark: #776e65;
      --shadow-sm: 0 2px 6px rgba(0, 0, 0, 0.1);
    }

    .theme-dark {
      --bg: #1a1a2e;
      --board-bg: #16213e;
      --cell-bg: #0f3460;
      --text: #e0e0e0;
      --tile-2-bg: #4a4e69;
      --tile-4-bg: #6c5b7b;
      --tile-8-bg: #f08a5d;
      --tile-16-bg: #e23e57;
      --tile-32-bg: #c06c6c;
      --tile-64-bg: #b83b5e;
      --tile-128-bg: #f9ed69;
      --tile-256-bg: #f6d365;
      --tile-512-bg: #f08a5d;
      --tile-1024-bg: #e23e57;
      --tile-2048-bg: #bb2cd9;
      --tile-color-light: #ffffff;
      --tile-color-dark: #f0f0f0;
    }

    .theme-ocean {
      --bg: #e0f7fa;
      --board-bg: #0077b6;
      --cell-bg: #48cae4;
      --text: #03045e;
      --tile-2-bg: #caf0f8;
      --tile-4-bg: #90e0ef;
      --tile-8-bg: #00b4d8;
      --tile-16-bg: #0096c7;
      --tile-32-bg: #0077b6;
      --tile-64-bg: #023e8a;
      --tile-128-bg: #ffb703;
      --tile-256-bg: #fb8500;
      --tile-512-bg: #ff9e00;
      --tile-1024-bg: #ff9100;
      --tile-2048-bg: #ff6d00;
      --tile-color-light: #fff;
      --tile-color-dark: #03045e;
    }

    .theme-forest {
      --bg: #d8f3dc;
      --board-bg: #2d6a4f;
      --cell-bg: #52b788;
      --text: #081c15;
      --tile-2-bg: #b7e4c7;
      --tile-4-bg: #95d5b2;
      --tile-8-bg: #74c69d;
      --tile-16-bg: #52b788;
      --tile-32-bg: #40916c;
      --tile-64-bg: #2d6a4f;
      --tile-128-bg: #f4a261;
      --tile-256-bg: #e76f51;
      --tile-512-bg: #e9c46a;
      --tile-1024-bg: #f4a261;
      --tile-2048-bg: #e76f51;
      --tile-color-light: #fff;
      --tile-color-dark: #1b4332;
    }

    .theme-sunset {
      --bg: #fff3e0;
      --board-bg: #ff8a65;
      --cell-bg: #ffccbc;
      --text: #bf360c;
      --tile-2-bg: #ffe0b2;
      --tile-4-bg: #ffcc80;
      --tile-8-bg: #ffb74d;
      --tile-16-bg: #ffa726;
      --tile-32-bg: #ff9800;
      --tile-64-bg: #fb8c00;
      --tile-128-bg: #f57c00;
      --tile-256-bg: #ef6c00;
      --tile-512-bg: #e65100;
      --tile-1024-bg: #d84315;
      --tile-2048-bg: #bf360c;
      --tile-color-light: #fff;
      --tile-color-dark: #3e2723;
    }

    .theme-neon {
      --bg: #0a0a0f;
      --board-bg: #1f1f2e;
      --cell-bg: #2d2d44;
      --text: #0ff;
      --tile-2-bg: #ff00c6;
      --tile-4-bg: #ff3c8e;
      --tile-8-bg: #ff5e3a;
      --tile-16-bg: #ffa200;
      --tile-32-bg: #bfff00;
      --tile-64-bg: #00ff88;
      --tile-128-bg: #00ccff;
      --tile-256-bg: #8849ff;
      --tile-512-bg: #ff00ff;
      --tile-1024-bg: #ff0055;
      --tile-2048-bg: #00ffff;
      --tile-color-light: #000;
      --tile-color-dark: #fff;
    }

    /* ヘッダー部分 */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 430px;
      margin-bottom: 20px;
      gap: 20px;
      z-index: 2;
    }

    h1 {
      font-size: 48px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--text), #f9a825);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      text-shadow: var(--shadow-sm);
    }

    .score-panel {
      display: flex;
      gap: 12px;
    }

    .score-box {
      background: var(--board-bg);
      border-radius: 12px;
      padding: 6px 16px;
      text-align: center;
      box-shadow: var(--shadow-sm);
      backdrop-filter: blur(2px);
    }

    .score-label {
      font-size: 13px;
      letter-spacing: 1px;
      opacity: 0.9;
      color: #fff;
    }

    #score, #high-score {
      font-size: 28px;
      font-weight: bold;
      line-height: 1;
      color: #fff;
    }

    #high-score {
      font-size: 18px;
    }

    #message {
      font-size: 18px;
      height: 36px;
      font-weight: bold;
      color: #e67e22;
      text-shadow: 0 0 2px rgba(0,0,0,0.2);
      margin: 5px 0;
      z-index: 2;
      letter-spacing: 1px;
    }

    /* ボードコンテナ */
    #board-container {
      position: relative;
      width: min(85vw, 85vh, 500px);
      height: min(85vw, 85vh, 500px);
      background: var(--board-bg);
      border-radius: 20px;
      padding: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      transition: transform 0.08s linear;
      box-shadow: 0 12px 25px rgba(0, 0, 0, 0.3);
      z-index: 2;
    }

    .cell-bg {
      width: calc(25% - 9px);
      height: calc(25% - 9px);
      background: var(--cell-bg);
      border-radius: 12px;
      box-shadow: inset 0 0 4px rgba(0, 0, 0, 0.1);
    }

    /* タイル */
    .tile {
      position: absolute;
      width: calc(25% - 9px);
      height: calc(25% - 9px);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: min(5vw, 38px);
      font-weight: 800;
      transition: top 0.12s cubic-bezier(0.2, 0.9, 0.4, 1.1), left 0.12s cubic-bezier(0.2, 0.9, 0.4, 1.1), transform 0.08s;
      z-index: 10;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(1px);
    }

    /* 数値別スタイル */
    .tile-2 { background: var(--tile-2-bg); color: var(--tile-color-dark); }
    .tile-4 { background: var(--tile-4-bg); color: var(--tile-color-dark); }
    .tile-8, .tile-16, .tile-32, .tile-64, .tile-128, .tile-256, .tile-512, .tile-1024, .tile-2048 {
      color: var(--tile-color-light);
    }
    .tile-8 { background: var(--tile-8-bg); }
    .tile-16 { background: var(--tile-16-bg); }
    .tile-32 { background: var(--tile-32-bg); }
    .tile-64 { background: var(--tile-64-bg); }
    .tile-128 { background: var(--tile-128-bg); font-size: min(4.2vw, 32px); }
    .tile-256 { background: var(--tile-256-bg); font-size: min(4.2vw, 32px); }
    .tile-512 { background: var(--tile-512-bg); font-size: min(4.2vw, 32px); }
    .tile-1024 { background: var(--tile-1024-bg); font-size: min(3.8vw, 28px); }
    .tile-2048 { background: var(--tile-2048-bg); font-size: min(3.8vw, 28px); }

    .tile.merged { animation: pop 0.2s cubic-bezier(0.34, 1.2, 0.64, 1); }
    .tile.new { animation: appear 0.2s ease-out; }

    @keyframes pop {
      0% { transform: scale(0.9); opacity: 0.6; }
      70% { transform: scale(1.08); }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes appear {
      0% { transform: scale(0.2); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* スコアポップアップ */
    .score-popup {
      position: absolute;
      font-weight: 900;
      font-size: 28px;
      color: #ffd966;
      text-shadow: 2px 2px 0 #bf5e00;
      z-index: 20;
      pointer-events: none;
      animation: floatUp 0.7s forwards;
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(0.8); }
      100% { opacity: 0; transform: translateY(-50px) scale(1.3); }
    }

    /* パーティクル */
    .particle {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: radial-gradient(circle, gold, orange);
      z-index: 15;
      pointer-events: none;
      filter: blur(1px);
    }

    .shake {
      animation: shakeBoard 0.18s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

    @keyframes shakeBoard {
      0% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
      100% { transform: translateX(0); }
    }

    /* オーバーレイ */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 200;
      visibility: hidden;
      opacity: 0;
      transition: visibility 0.2s, opacity 0.2s;
    }

    .overlay.active {
      visibility: visible;
      opacity: 1;
    }

    .overlay-text {
      color: #ffd966;
      font-size: 56px;
      font-weight: 800;
      margin-bottom: 30px;
      letter-spacing: 4px;
      text-shadow: 0 0 10px #ff8c00;
    }

    .overlay button, .controls button, .controls select {
      padding: 12px 28px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 60px;
      background: var(--board-bg);
      color: white;
      cursor: pointer;
      transition: transform 0.1s, background 0.2s;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.2);
    }

    .overlay button:active, .controls button:active {
      transform: scale(0.96);
    }

    .controls {
      margin-top: 20px;
      display: flex;
      gap: 20px;
      align-items: center;
      z-index: 2;
      flex-wrap: wrap;
      justify-content: center;
    }

    select {
      background: var(--board-bg);
      padding: 10px 20px;
      font-weight: bold;
    }

    @media (max-width: 520px) {
      .tile { font-size: 6vw; }
      .score-box { padding: 2px 12px; }
      #score { font-size: 22px; }
      h1 { font-size: 38px; }
    }

    button#restart-btn {
      background: #e67e22;
    }
  </style>
</head>
<body>
  <div class="rain-container" id="rain-container"></div>

  <div class="header">
    <h1>2048</h1>
    <div class="score-panel">
      <div class="score-box">
        <div class="score-label">SCORE</div>
        <div id="score">0</div>
      </div>
      <div class="score-box">
        <div class="score-label">BEST</div>
        <div id="high-score">0</div>
      </div>
    </div>
  </div>
  <div id="message"></div>
  <div id="board-container"></div>
  <div class="controls">
    <button id="restart-btn">⟳ リスタート</button>
    <select id="skin-select">
      <option value="">✨ クラシック</option>
      <option value="theme-dark">🌙 ダーク</option>
      <option value="theme-ocean">🌊 オーシャン</option>
      <option value="theme-forest">🌿 フォレスト</option>
      <option value="theme-sunset">🌅 サンセット</option>
      <option value="theme-neon">⚡ ネオン</option>
    </select>
  </div>
  <div id="overlay" class="overlay">
    <div class="overlay-text">GAME OVER</div>
    <button id="overlay-restart">🔄 もう一度挑戦</button>
  </div>

  <script>
    (function() {
      // ----- オーディオ（遅延初期化、ユーザーアクションで起動）
      let audioCtx = null;
      let audioAllowed = false;

      function initAudio() {
        if (!audioCtx && window.AudioContext) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        audioAllowed = true;
      }

      function playTone(freq, duration, type = 'sine', volume = 0.25) {
        if (!audioAllowed || !audioCtx) return;
        try {
          const now = audioCtx.currentTime;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = type;
          osc.frequency.value = freq;
          gain.gain.value = volume;
          gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(now + duration);
        } catch (e) { /* 無音フォールバック */ }
      }

      function playMergeSound(value) {
        if (!audioAllowed) return;
        const freq = 300 + Math.min(Math.log2(value) * 45, 600);
        playTone(freq, 0.12, 'sine', 0.2);
        setTimeout(() => playTone(freq * 1.45, 0.1, 'sine', 0.15), 80);
      }

      function playGameOverSound() {
        if (!audioAllowed) return;
        playTone(180, 0.4, 'square', 0.2);
        setTimeout(() => playTone(130, 0.55, 'square', 0.18), 280);
      }

      // ----- 雨エフェクト（軽量化）
      function initRain() {
        const rainContainer = document.getElementById('rain-container');
        if (!rainContainer) return;
        setInterval(() => {
          const drop = document.createElement('div');
          drop.className = 'raindrop';
          drop.style.left = Math.random() * 100 + '%';
          const duration = 0.8 + Math.random() * 1.5;
          drop.style.animationDuration = duration + 's';
          drop.style.height = (8 + Math.random() * 22) + 'px';
          drop.style.width = (1 + Math.random() * 2) + 'px';
          drop.style.opacity = 0.2 + Math.random() * 0.5;
          rainContainer.appendChild(drop);
          drop.addEventListener('animationend', () => drop.remove());
        }, 45);
      }

      // ----- ゲーム変数
      const SIZE = 4;
      const GAP = 12;
      let board = Array(SIZE).fill().map(() => Array(SIZE).fill(null));
      let score = 0;
      let highScore = 0;
      let gameOver = false;
      let tileIdCounter = 0;
      let tileElements = new Map(); // id -> DOM element
      
      const boardContainer = document.getElementById('board-container');
      const scoreEl = document.getElementById('score');
      const highScoreEl = document.getElementById('high-score');
      const messageEl = document.getElementById('message');
      const restartBtn = document.getElementById('restart-btn');
      const skinSelect = document.getElementById('skin-select');
      const overlay = document.getElementById('overlay');
      const overlayRestart = document.getElementById('overlay-restart');

      // 背景セルの作成
      for (let i = 0; i < SIZE * SIZE; i++) {
        const cell = document.createElement('div');
        cell.className = 'cell-bg';
        boardContainer.appendChild(cell);
      }

      // ハイスコア読込
      try {
        const saved = localStorage.getItem('2048_highScore');
        if (saved) highScore = parseInt(saved, 10) || 0;
      } catch(e) {}
      highScoreEl.textContent = highScore;

      // ヘルパー : 位置計算 (px)
      function getCellSize() {
        const containerRect = boardContainer.getBoundingClientRect();
        const containerWidth = containerRect.width;
        const gapPx = 12;
        return (containerWidth - (gapPx * (SIZE + 1))) / SIZE;
      }

      function getPosition(row, col) {
        const cellSize = getCellSize();
        const gap = 12;
        return {
          top: gap + row * (cellSize + gap),
          left: gap + col * (cellSize + gap)
        };
      }

      function updateTilePositions() {
        const cellSize = getCellSize();
        const gap = 12;
        for (let r = 0; r < SIZE; r++) {
          for (let c = 0; c < SIZE; c++) {
            const tile = board[r][c];
            if (tile && tileElements.has(tile.id)) {
              const el = tileElements.get(tile.id);
              const top = gap + r * (cellSize + gap);
              const left = gap + c * (cellSize + gap);
              el.style.top = `${top}px`;
              el.style.left = `${left}px`;
              el.style.width = `${cellSize}px`;
              el.style.height = `${cellSize}px`;
              el.style.fontSize = `${Math.min(cellSize * 0.45, 42)}px`;
            }
          }
        }
      }

      function createTileElement(tile) {
        if (tileElements.has(tile.id)) return tileElements.get(tile.id);
        const cellSize = getCellSize();
        const el = document.createElement('div');
        el.className = `tile tile-${tile.value}`;
        el.textContent = tile.value;
        el.id = `tile-${tile.id}`;
        const pos = getPosition(tile.row, tile.col);
        el.style.width = `${cellSize}px`;
        el.style.height = `${cellSize}px`;
        el.style.top = `${pos.top}px`;
        el.style.left = `${pos.left}px`;
        el.style.fontSize = `${Math.min(cellSize * 0.45, 42)}px`;
        boardContainer.appendChild(el);
        tileElements.set(tile.id, el);
        return el;
      }

      function removeTileElement(id) {
        if (tileElements.has(id)) {
          const el = tileElements.get(id);
          if (el && el.remove) el.remove();
          tileElements.delete(id);
        }
      }

      function refreshTileAppearance(tile) {
        const el = tileElements.get(tile.id);
        if (el) {
          el.className = `tile tile-${tile.value}`;
          el.textContent = tile.value;
          const cellSize = getCellSize();
          el.style.width = `${cellSize}px`;
          el.style.height = `${cellSize}px`;
          el.style.fontSize = `${Math.min(cellSize * 0.45, 42)}px`;
        }
      }

      function updateScoreUI() {
        scoreEl.textContent = score;
        if (score > highScore) {
          highScore = score;
          try { localStorage.setItem('2048_highScore', highScore); } catch(e) {}
          highScoreEl.textContent = highScore;
        }
      }

      // スコア加算 & 演出
      function addScore(value, row, col) {
        score += value;
        updateScoreUI();
        // ポップアップ表示
        const pos = getPosition(row, col);
        const popup = document.createElement('div');
        popup.className = 'score-popup';
        popup.textContent = `+${value}`;
        popup.style.top = `${pos.top}px`;
        popup.style.left = `${pos.left}px`;
        boardContainer.appendChild(popup);
        popup.addEventListener('animationend', () => popup.remove());
        // パーティクル演出
        const centerX = pos.left + getCellSize() / 2;
        const centerY = pos.top + getCellSize() / 2;
        for (let i = 0; i < 6; i++) {
          const particle = document.createElement('div');
          particle.className = 'particle';
          particle.style.background = `hsl(${Math.random() * 40 + 30}, 100%, 65%)`;
          particle.style.left = `${centerX}px`;
          particle.style.top = `${centerY}px`;
          boardContainer.appendChild(particle);
          const angle = Math.random() * Math.PI * 2;
          const rad = 25 + Math.random() * 35;
          const dx = Math.cos(angle) * rad;
          const dy = Math.sin(angle) * rad;
          particle.animate([
            { transform: 'translate(0, 0) scale(1)', opacity: 0.9 },
            { transform: `translate(${dx}px, ${dy}px) scale(0)`, opacity: 0 }
          ], { duration: 420, easing: 'cubic-bezier(0.2, 0.9, 0.6, 1)' }).onfinish = () => particle.remove();
        }
      }

      // ラインスライド + マージ (スコア反映はmoveで)
      function slideAndMerge(line) {
        const originalIds = line.map(t => t ? t.id : null);
        const filtered = line.filter(t => t !== null);
        const mergedIds = [];
        const newLineArr = [];
        let skip = false;
        for (let i = 0; i < filtered.length; i++) {
          if (skip) { skip = false; continue; }
          if (i + 1 < filtered.length && filtered[i].value === filtered[i+1].value) {
            // マージ：左側のタイルを残し、値を2倍に
            const newVal = filtered[i].value * 2;
            const mergedTile = {
              id: filtered[i].id,
              value: newVal,
              mergedFrom: [filtered[i].id, filtered[i+1].id]
            };
            newLineArr.push(mergedTile);
            mergedIds.push(filtered[i+1].id);
            skip = true;
          } else {
            newLineArr.push(filtered[i]);
          }
        }
        while (newLineArr.length < SIZE) newLineArr.push(null);
        const newIds = newLineArr.map(t => t ? t.id : null);
        const changed = JSON.stringify(originalIds) !== JSON.stringify(newIds);
        return { newLine: newLineArr, mergedIds, changed };
      }

      // メイン移動ロジック (スコア加算を確実に含む)
      function move(direction) {
        if (gameOver) return;
        // 初回音声有効化
        if (!audioAllowed) {
          initAudio();
          audioAllowed = true;
        }
        
        let anyMoved = false;
        let mergedScoreMap = []; // {value, row, col}
        
        // 方向別処理
        if (direction === 'left') {
          for (let r = 0; r < SIZE; r++) {
            const line = [];
            for (let c = 0; c < SIZE; c++) line.push(board[r][c]);
            const { newLine, mergedIds, changed } = slideAndMerge(line);
            if (changed) anyMoved = true;
            // マージにより消えたタイルを削除
            mergedIds.forEach(id => removeTileElement(id));
            // 新ラインのタイルを反映し、マージされたタイルがあればスコア加算
            for (let c = 0; c < SIZE; c++) {
              const newTile = newLine[c];
              const oldTile = board[r][c];
              if (newTile && newTile.mergedFrom) {
                const addedScore = newTile.value;
                addScore(addedScore, r, c);
                playMergeSound(newTile.value);
                // アニメーション用クラス
                const el = tileElements.get(newTile.id);
                if (el) {
                  el.classList.add('merged');
                  el.addEventListener('animationend', () => el.classList.remove('merged'), { once: true });
                }
                delete newTile.mergedFrom;
              }
              board[r][c] = newTile;
              if (newTile && (oldTile !== newTile || (oldTile && oldTile.value !== newTile.value))) {
                refreshTileAppearance(newTile);
              }
            }
          }
        } 
        else if (direction === 'right') {
          for (let r = 0; r < SIZE; r++) {
            const line = [];
            for (let c = SIZE-1; c >= 0; c--) line.push(board[r][c]);
            const { newLine, mergedIds, changed } = slideAndMerge(line);
            if (changed) anyMoved = true;
            mergedIds.forEach(id => removeTileElement(id));
            const reversed = newLine.reverse();
            for (let c = 0; c < SIZE; c++) {
              const newTile = reversed[c];
              if (newTile && newTile.mergedFrom) {
                addScore(newTile.value, r, c);
                playMergeSound(newTile.value);
                const el = tileElements.get(newTile.id);
                if (el) el.classList.add('merged');
                setTimeout(() => { if(el) el.classList.remove('merged'); }, 200);
                delete newTile.mergedFrom;
              }
              board[r][c] = newTile;
              if (newTile) refreshTileAppearance(newTile);
            }
          }
        }
        else if (direction === 'up') {
          for (let c = 0; c < SIZE; c++) {
            const line = [];
            for (let r = 0; r < SIZE; r++) line.push(board[r][c]);
            const { newLine, mergedIds, changed } = slideAndMerge(line);
            if (changed) anyMoved = true;
            mergedIds.forEach(id => removeTileElement(id));
            for (let r = 0; r < SIZE; r++) {
              const newTile = newLine[r];
              if (newTile && newTile.mergedFrom) {
                addScore(newTile.value, r, c);
                playMergeSound(newTile.value);
                const el = tileElements.get(newTile.id);
                if (el) el.classList.add('merged');
                setTimeout(() => { if(el) el.classList.remove('merged'); }, 200);
                delete newTile.mergedFrom;
              }
              board[r][c] = newTile;
              if (newTile) refreshTileAppearance(newTile);
            }
          }
        }
        else if (direction === 'down') {
          for (let c = 0; c < SIZE; c++) {
            const line = [];
            for (let r = SIZE-1; r >= 0; r--) line.push(board[r][c]);
            const { newLine, mergedIds, changed } = slideAndMerge(line);
            if (changed) anyMoved = true;
            mergedIds.forEach(id => removeTileElement(id));
            const reversed = newLine.reverse();
            for (let r = 0; r < SIZE; r++) {
              const newTile = reversed[r];
              if (newTile && newTile.mergedFrom) {
                addScore(newTile.value, r, c);
                playMergeSound(newTile.value);
                const el = tileElements.get(newTile.id);
                if (el) el.classList.add('merged');
                setTimeout(() => { if(el) el.classList.remove('merged'); }, 200);
                delete newTile.mergedFrom;
              }
              board[r][c] = newTile;
              if (newTile) refreshTileAppearance(newTile);
            }
          }
        }

        if (anyMoved) {
          // 新しいタイルを追加
          addRandomTile();
          // 全タイル位置更新 & サイズ調整
          updateTilePositions();
          checkGameOver();
        } else {
          // 動かなかったらシェイク
          boardContainer.classList.add('shake');
          boardContainer.addEventListener('animationend', () => boardContainer.classList.remove('shake'), { once: true });
          playTone(220, 0.1, 'triangle', 0.1);
        }
      }

      function addRandomTile() {
        const empty = [];
        for (let i = 0; i < SIZE; i++) {
          for (let j = 0; j < SIZE; j++) {
            if (!board[i][j]) empty.push([i, j]);
          }
        }
        if (empty.length === 0) return;
        const [row, col] = empty[Math.floor(Math.random() * empty.length)];
        const value = Math.random() < 0.9 ? 2 : 4;
        const newTile = { id: tileIdCounter++, value, row, col };
        board[row][col] = newTile;
        const el = createTileElement(newTile);
        el.classList.add('new');
        el.addEventListener('animationend', () => el.classList.remove('new'), { once: true });
        updateTilePositions();
      }

      function checkGameOver() {
        for (let i = 0; i < SIZE; i++) {
          for (let j = 0; j < SIZE; j++) {
            if (!board[i][j]) return;
            if (j+1 < SIZE && board[i][j].value === board[i][j+1].value) return;
            if (i+1 < SIZE && board[i][j].value === board[i+1][j].value) return;
          }
        }
        gameOver = true;
        playGameOverSound();
        messageEl.textContent = '💀 GAME OVER 💀';
        overlay.classList.add('active');
      }

      function restartGame() {
        // 全タイル削除
        for (let [id, el] of tileElements.entries()) {
          if (el && el.remove) el.remove();
        }
        tileElements.clear();
        board = Array(SIZE).fill().map(() => Array(SIZE).fill(null));
        score = 0;
        gameOver = false;
        messageEl.textContent = '';
        overlay.classList.remove('active');
        updateScoreUI();
        addRandomTile();
        addRandomTile();
        updateTilePositions();
        // 強制リフレッシュ
        for (let r = 0; r < SIZE; r++) {
          for (let c = 0; c < SIZE; c++) {
            const t = board[r][c];
            if (t) refreshTileAppearance(t);
          }
        }
        updateTilePositions();
      }

      // リサイズ時にタイル位置補正
      window.addEventListener('resize', () => updateTilePositions());
      
      // テーマ変更 & 初期化
      skinSelect.addEventListener('change', (e) => {
        document.body.className = e.target.value;
      });
      restartBtn.addEventListener('click', () => restartGame());
      overlayRestart.addEventListener('click', () => restartGame());

      // キーボード操作
      document.addEventListener('keydown', (e) => {
        const key = e.key;
        if (key === 'ArrowUp') { e.preventDefault(); move('up'); }
        else if (key === 'ArrowDown') { e.preventDefault(); move('down'); }
        else if (key === 'ArrowLeft') { e.preventDefault(); move('left'); }
        else if (key === 'ArrowRight') { e.preventDefault(); move('right'); }
      });

      // タッチ操作
      let touchX = 0, touchY = 0;
      boardContainer.addEventListener('touchstart', (e) => {
        e.preventDefault();
        touchX = e.touches[0].clientX;
        touchY = e.touches[0].clientY;
      });
      boardContainer.addEventListener('touchend', (e) => {
        e.preventDefault();
        const dx = e.changedTouches[0].clientX - touchX;
        const dy = e.changedTouches[0].clientY - touchY;
        if (Math.abs(dx) < 15 && Math.abs(dy) < 15) return;
        if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 'right' : 'left');
        else move(dy > 0 ? 'down' : 'up');
      });
      // オーディオ起動のために画面タップでも初期化
      document.body.addEventListener('click', () => { if (!audioAllowed) initAudio(); }, { once: true });

      initRain();
      restartGame();
    })();
  </script>
</body>
</html>
