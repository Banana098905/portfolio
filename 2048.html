<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>2048 完全修正版</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Arial', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
      background: var(--bg);
      transition: background 0.3s;
      user-select: none;
      overflow: hidden;
      position: relative;
    }
    .rain-container {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
    }
    .raindrop {
      position: absolute;
      width: 2px;
      height: 15px;
      background: rgba(255,255,255,0.5);
      top: -20px;
      animation: fall linear infinite;
    }
    @keyframes fall {
      to { transform: translateY(100vh); opacity: 0; }
    }

    :root {
      --bg: #faf8ef;
      --board-bg: #bbada0;
      --cell-bg: #cdc1b4;
      --text: #776e65;
      --tile-2-bg: #eee4da;
      --tile-4-bg: #ede0c8;
      --tile-8-bg: #f2b179;
      --tile-16-bg: #f59563;
      --tile-32-bg: #f67c5f;
      --tile-64-bg: #f65e3b;
      --tile-128-bg: #edcf72;
      --tile-256-bg: #edcc61;
      --tile-512-bg: #edc850;
      --tile-1024-bg: #edc53f;
      --tile-2048-bg: #edc22e;
      --tile-color-light: #f9f6f2;
      --tile-color-dark: #776e65;
    }
    .theme-dark {
      --bg: #1e1e2f;
      --board-bg: #2e2e4e;
      --cell-bg: #3e3e5e;
      --text: #e0e0e0;
      --tile-2-bg: #4a4a6a;
      --tile-4-bg: #5a5a7a;
      --tile-8-bg: #ff6b6b;
      --tile-16-bg: #ee5a24;
      --tile-32-bg: #e84118;
      --tile-64-bg: #c23616;
      --tile-128-bg: #fbc531;
      --tile-256-bg: #e1b12c;
      --tile-512-bg: #44bd32;
      --tile-1024-bg: #4cd137;
      --tile-2048-bg: #00a8ff;
      --tile-color-light: #fff;
      --tile-color-dark: #fff;
    }
    .theme-ocean {
      --bg: #e0f7fa;
      --board-bg: #0077b6;
      --cell-bg: #00b4d8;
      --text: #03045e;
      --tile-2-bg: #90e0ef;
      --tile-4-bg: #48cae4;
      --tile-8-bg: #00b4d8;
      --tile-16-bg: #0096c7;
      --tile-32-bg: #0077b6;
      --tile-64-bg: #023e8a;
      --tile-128-bg: #ffb703;
      --tile-256-bg: #fb8500;
      --tile-512-bg: #ff9e00;
      --tile-1024-bg: #ff9100;
      --tile-2048-bg: #ff6d00;
      --tile-color-light: #fff;
      --tile-color-dark: #fff;
    }
    .theme-forest {
      --bg: #d4edda;
      --board-bg: #2d6a4f;
      --cell-bg: #52b788;
      --text: #1b4332;
      --tile-2-bg: #95d5b2;
      --tile-4-bg: #74c69d;
      --tile-8-bg: #52b788;
      --tile-16-bg: #40916c;
      --tile-32-bg: #2d6a4f;
      --tile-64-bg: #1b4332;
      --tile-128-bg: #f4a261;
      --tile-256-bg: #e76f51;
      --tile-512-bg: #e9c46a;
      --tile-1024-bg: #f4a261;
      --tile-2048-bg: #e76f51;
      --tile-color-light: #fff;
      --tile-color-dark: #fff;
    }
    .theme-sunset {
      --bg: #fff3e0;
      --board-bg: #ff8a65;
      --cell-bg: #ffccbc;
      --text: #bf360c;
      --tile-2-bg: #ffe0b2;
      --tile-4-bg: #ffcc80;
      --tile-8-bg: #ffb74d;
      --tile-16-bg: #ffa726;
      --tile-32-bg: #ff9800;
      --tile-64-bg: #fb8c00;
      --tile-128-bg: #f57c00;
      --tile-256-bg: #ef6c00;
      --tile-512-bg: #e65100;
      --tile-1024-bg: #d84315;
      --tile-2048-bg: #bf360c;
      --tile-color-light: #fff;
      --tile-color-dark: #fff;
    }
    .theme-neon {
      --bg: #0d0d0d;
      --board-bg: #1a1a1a;
      --cell-bg: #333;
      --text: #0ff;
      --tile-2-bg: #ff00ff;
      --tile-4-bg: #ff0080;
      --tile-8-bg: #ff0040;
      --tile-16-bg: #ff4000;
      --tile-32-bg: #ff8000;
      --tile-64-bg: #ffbf00;
      --tile-128-bg: #ffff00;
      --tile-256-bg: #bfff00;
      --tile-512-bg: #80ff00;
      --tile-1024-bg: #00ff40;
      --tile-2048-bg: #00ffff;
      --tile-color-light: #000;
      --tile-color-dark: #fff;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 10px;
      color: var(--text);
      z-index: 1;
    }
    h1 { font-size: 32px; color: var(--text); }
    .score-box {
      background: var(--board-bg);
      color: #fff;
      padding: 5px 15px;
      border-radius: 5px;
      text-align: center;
      z-index: 1;
    }
    .score-label { font-size: 12px; }
    #score { font-size: 24px; font-weight: bold; }
    #high-score { font-size: 14px; color: #ffeaa7; }
    #message {
      font-size: 20px;
      height: 30px;
      color: #e74c3c;
      margin: 5px 0;
      z-index: 1;
    }
    #board-container {
      position: relative;
      width: 430px;
      height: 430px;
      background: var(--board-bg);
      border-radius: 10px;
      padding: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      transition: transform 0.1s ease;
      z-index: 1;
    }
    .shake {
      animation: shake 0.2s ease;
    }
    @keyframes shake {
      0%   { transform: translateX(0); }
      25%  { transform: translateX(-5px); }
      50%  { transform: translateX(5px); }
      75%  { transform: translateX(-3px); }
      100% { transform: translateX(0); }
    }
    .cell-bg {
      width: 95px;
      height: 95px;
      background: var(--cell-bg);
      border-radius: 5px;
    }
    .tile {
      position: absolute;
      width: 95px;
      height: 95px;
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 35px;
      font-weight: bold;
      color: var(--tile-color-dark);
      background: var(--cell-bg);
      transition: top 0.15s ease-in-out, left 0.15s ease-in-out, transform 0.1s;
      z-index: 2;
    }
    .tile-2    { background: var(--tile-2-bg); }
    .tile-4    { background: var(--tile-4-bg); }
    .tile-8    { background: var(--tile-8-bg); color: var(--tile-color-light); }
    .tile-16   { background: var(--tile-16-bg); color: var(--tile-color-light); }
    .tile-32   { background: var(--tile-32-bg); color: var(--tile-color-light); }
    .tile-64   { background: var(--tile-64-bg); color: var(--tile-color-light); }
    .tile-128  { background: var(--tile-128-bg); color: var(--tile-color-light); font-size: 30px; }
    .tile-256  { background: var(--tile-256-bg); color: var(--tile-color-light); font-size: 30px; }
    .tile-512  { background: var(--tile-512-bg); color: var(--tile-color-light); font-size: 30px; }
    .tile-1024 { background: var(--tile-1024-bg); color: var(--tile-color-light); font-size: 25px; }
    .tile-2048 { background: var(--tile-2048-bg); color: var(--tile-color-light); font-size: 25px; }
    .tile.merged { animation: pop 0.2s ease; }
    .tile.new    { animation: appear 0.2s ease; }
    @keyframes pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }
    @keyframes appear {
      0% { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .score-popup {
      position: absolute;
      font-weight: bold;
      font-size: 24px;
      color: var(--text);
      z-index: 10;
      pointer-events: none;
      animation: floatUp 0.8s ease-out forwards;
    }
    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-40px); }
    }
    .particle {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: gold;
      z-index: 9;
      pointer-events: none;
    }
    .overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 100;
      visibility: hidden;
    }
    .overlay.active { visibility: visible; }
    .overlay-text {
      color: white;
      font-size: 48px;
      margin-bottom: 20px;
    }
    .overlay button {
      padding: 15px 30px;
      font-size: 24px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      background: #fff;
      color: #333;
      font-weight: bold;
    }
    .controls {
      margin-top: 15px;
      display: flex;
      gap: 20px;
      align-items: center;
      z-index: 1;
    }
    button, select {
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 5px;
      border: none;
      cursor: pointer;
      background: var(--board-bg);
      color: #fff;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="rain-container" id="rain-container"></div>

  <div class="header">
    <h1>2048</h1>
    <div class="score-box">
      <div class="score-label">SCORE</div>
      <div id="score">0</div>
      <div id="high-score">BEST 0</div>
    </div>
  </div>
  <div id="message"></div>
  <div id="board-container"></div>
  <div class="controls">
    <button id="restart-btn">リスタート</button>
    <select id="skin-select">
      <option value="">クラシック</option>
      <option value="theme-dark">ダーク</option>
      <option value="theme-ocean">海</option>
      <option value="theme-forest">森</option>
      <option value="theme-sunset">サンセット</option>
      <option value="theme-neon">ネオン</option>
    </select>
  </div>
  <div id="overlay" class="overlay">
    <div class="overlay-text">GAME OVER</div>
    <button id="overlay-restart">もう一度</button>
  </div>

  <script>
    (function() {
      // Audio
      var AudioContext = window.AudioContext || window.webkitAudioContext;
      var audioCtx = null;
      function initAudio() {
        if (!audioCtx) audioCtx = new AudioContext();
      }
      function playTone(freq, duration, type, volume) {
        if (!audioCtx) return;
        type = type || 'sine';
        volume = volume || 0.3;
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.value = volume;
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      }
      function playMergeSound(value) {
        if (!audioCtx) return;
        var baseFreq = 300 + Math.log2(value) * 50;
        playTone(baseFreq, 0.2, 'sine', 0.3);
        setTimeout(function() { playTone(baseFreq * 1.5, 0.15, 'sine', 0.2); }, 100);
      }
      function playGameOverSound() {
        if (!audioCtx) return;
        playTone(200, 0.4, 'square', 0.2);
        setTimeout(function() { playTone(150, 0.5, 'square', 0.2); }, 300);
      }

      // Rain
      function createRain() {
        var container = document.getElementById('rain-container');
        setInterval(function() {
          var drop = document.createElement('div');
          drop.className = 'raindrop';
          drop.style.left = Math.random() * 100 + '%';
          drop.style.animationDuration = (0.5 + Math.random() * 1.5) + 's';
          drop.style.opacity = 0.3 + Math.random() * 0.5;
          drop.style.height = (10 + Math.random() * 20) + 'px';
          container.appendChild(drop);
          drop.addEventListener('animationend', function() { drop.remove(); });
        }, 50);
      }

      // Game
      var SIZE = 4;
      var GAP = 10;
      var CELL_SIZE = 95;
      var board = [];
      var score = 0;
      var highScore = 0;
      var gameOver = false;
      var tileIdCounter = 0;
      var tileElements = {};

      var boardEl = document.getElementById('board-container');
      var scoreEl = document.getElementById('score');
      var highScoreEl = document.getElementById('high-score');
      var messageEl = document.getElementById('message');
      var restartBtn = document.getElementById('restart-btn');
      var skinSelect = document.getElementById('skin-select');
      var overlay = document.getElementById('overlay');
      var overlayRestartBtn = document.getElementById('overlay-restart');

      for (var i = 0; i < SIZE * SIZE; i++) {
        var cell = document.createElement('div');
        cell.className = 'cell-bg';
        boardEl.appendChild(cell);
      }

      try {
        var saved = localStorage.getItem('2048_highScore');
        if (saved) highScore = parseInt(saved) || 0;
      } catch(e) {}
      highScoreEl.textContent = 'BEST ' + highScore;

      function getPosition(row, col) {
        return {
          top: GAP + row * (CELL_SIZE + GAP),
          left: GAP + col * (CELL_SIZE + GAP)
        };
      }

      function createTileElement(tile) {
        if (tileElements[tile.id]) return tileElements[tile.id];
        var el = document.createElement('div');
        el.className = 'tile';
        el.textContent = tile.value;
        el.classList.add('tile-' + tile.value);
        el.id = 'tile-' + tile.id;
        boardEl.appendChild(el);
        tileElements[tile.id] = el;
        return el;
      }

      function removeTileElement(id) {
        if (tileElements[id]) {
          tileElements[id].remove();
          delete tileElements[id];
        }
      }

      function updateTileVisual(tile, el) {
        if (parseInt(el.textContent) !== tile.value) {
          el.textContent = tile.value;
          el.className = 'tile';
          el.classList.add('tile-' + tile.value);
        }
      }

      function renderBoard() {
        for (var r = 0; r < SIZE; r++) {
          for (var c = 0; c < SIZE; c++) {
            var tile = board[r][c];
            if (tile) {
              var el = tileElements[tile.id];
              if (el) {
                var pos = getPosition(r, c);
                el.style.top = pos.top + 'px';
                el.style.left = pos.left + 'px';
                updateTileVisual(tile, el);
              }
            }
          }
        }
        scoreEl.textContent = score;
        if (score > highScore) {
          highScore = score;
          try { localStorage.setItem('2048_highScore', highScore); } catch(e) {}
          highScoreEl.textContent = 'BEST ' + highScore;
        }
      }

      function addRandomTile() {
        var emptyCells = [];
        for (var r = 0; r < SIZE; r++) {
          for (var c = 0; c < SIZE; c++) {
            if (!board[r][c]) emptyCells.push({r: r, c: c});
          }
        }
        if (emptyCells.length === 0) return;
        var cell = emptyCells[Math.floor(Math.random() * emptyCells.length)];
        var value = Math.random() < 0.9 ? 2 : 4;
        var tile = { id: tileIdCounter++, value: value, row: cell.r, col: cell.c };
        board[cell.r][cell.c] = tile;
        var el = createTileElement(tile);
        var pos = getPosition(cell.r, cell.c);
        el.style.top = pos.top + 'px';
        el.style.left = pos.left + 'px';
        el.classList.add('new');
        el.addEventListener('animationend', function() { el.classList.remove('new'); }, { once: true });
      }

      // ラインをスライド＆合体。変更があったかどうかも返す
      function slideLine(line) {
        var originalIds = line.map(function(tile) { return tile ? tile.id : null; });
        var arr = line.filter(function(t) { return t !== null; });
        var mergedIds = [];
        for (var i = 0; i < arr.length - 1; i++) {
          if (arr[i].value === arr[i+1].value) {
            arr[i] = {
              id: arr[i].id,
              value: arr[i].value * 2,
              mergedFrom: [arr[i].id, arr[i+1].id]
            };
            mergedIds.push(arr[i+1].id);
            arr[i+1] = null;
          }
        }
        arr = arr.filter(function(t) { return t !== null; });
        while (arr.length < SIZE) arr.push(null);

        var newIds = arr.map(function(tile) { return tile ? tile.id : null; });
        var changed = (JSON.stringify(originalIds) !== JSON.stringify(newIds));
        return { newLine: arr, mergedIds: mergedIds, changed: changed };
      }

      function shakeBoard() {
        boardEl.classList.add('shake');
        boardEl.addEventListener('animationend', function() { boardEl.classList.remove('shake'); }, { once: true });
      }

      function showScorePopup(value, row, col) {
        var pos = getPosition(row, col);
        var popup = document.createElement('div');
        popup.className = 'score-popup';
        popup.textContent = '+' + value;
        popup.style.top = pos.top + 'px';
        popup.style.left = pos.left + 'px';
        boardEl.appendChild(popup);
        popup.addEventListener('animationend', function() { popup.remove(); });
      }

      function burstParticles(row, col) {
        var pos = getPosition(row, col);
        var centerX = pos.left + CELL_SIZE/2;
        var centerY = pos.top + CELL_SIZE/2;
        for (var i = 0; i < 8; i++) {
          var particle = document.createElement('div');
          particle.className = 'particle';
          particle.style.background = 'hsl(' + (Math.random() * 60 + 30) + ', 100%, 60%)';
          particle.style.left = centerX + 'px';
          particle.style.top = centerY + 'px';
          boardEl.appendChild(particle);
          var angle = (Math.PI * 2 * i) / 8;
          var velocity = 40 + Math.random() * 30;
          var dx = Math.cos(angle) * velocity;
          var dy = Math.sin(angle) * velocity;
          particle.animate([
            { transform: 'translate(0, 0) scale(1)', opacity: 1 },
            { transform: 'translate(' + dx + 'px, ' + dy + 'px) scale(0)', opacity: 0 }
          ], {
            duration: 400,
            easing: 'ease-out',
            fill: 'forwards'
          }).onfinish = function() { particle.remove(); };
        }
      }

      function move(direction) {
        if (gameOver) return;
        initAudio();
        var moved = false;
        var mergedIds = [];

        if (direction === 'left') {
          for (var r = 0; r < SIZE; r++) {
            var line = [];
            for (var c = 0; c < SIZE; c++) line.push(board[r][c]);
            var res = slideLine(line);
            mergedIds = mergedIds.concat(res.mergedIds);
            if (res.changed) moved = true;
            board[r] = res.newLine;
          }
        } else if (direction === 'right') {
          for (var r = 0; r < SIZE; r++) {
            var line = [];
            for (var c = SIZE-1; c >= 0; c--) line.push(board[r][c]);
            var res = slideLine(line);
            mergedIds = mergedIds.concat(res.mergedIds);
            if (res.changed) moved = true;
            board[r] = res.newLine.reverse();
          }
        } else if (direction === 'up') {
          for (var c = 0; c < SIZE; c++) {
            var line = [];
            for (var r = 0; r < SIZE; r++) line.push(board[r][c]);
            var res = slideLine(line);
            mergedIds = mergedIds.concat(res.mergedIds);
            if (res.changed) moved = true;
            for (var r2 = 0; r2 < SIZE; r2++) board[r2][c] = res.newLine[r2];
          }
        } else if (direction === 'down') {
          for (var c = 0; c < SIZE; c++) {
            var line = [];
            for (var r = SIZE-1; r >= 0; r--) line.push(board[r][c]);
            var res = slideLine(line);
            mergedIds = mergedIds.concat(res.mergedIds);
            if (res.changed) moved = true;
            var reversed = res.newLine.reverse();
            for (var r2 = 0; r2 < SIZE; r2++) board[r2][c] = reversed[r2];
          }
        }

        if (moved) {
          mergedIds.forEach(function(id) { removeTileElement(id); });
          for (var r = 0; r < SIZE; r++) {
            for (var c = 0; c < SIZE; c++) {
              var tile = board[r][c];
              if (tile && tile.mergedFrom) {
                var el = tileElements[tile.id];
                if (el) {
                  el.classList.add('merged');
                  el.addEventListener('animationend', function() { el.classList.remove('merged'); }, { once: true });
                }
                showScorePopup(tile.value, r, c);
                burstParticles(r, c);
                playMergeSound(tile.value);
                delete tile.mergedFrom;
              }
            }
          }
          addRandomTile();
          renderBoard();
          checkGameOver();
        } else {
          shakeBoard();
        }
      }

      function checkGameOver() {
        for (var r = 0; r < SIZE; r++) {
          for (var c = 0; c < SIZE; c++) {
            if (!board[r][c]) return;
            if (c < SIZE-1 && board[r][c].value === board[r][c+1].value) return;
            if (r < SIZE-1 && board[r][c].value === board[r+1][c].value) return;
          }
        }
        gameOver = true;
        messageEl.textContent = '';
        playGameOverSound();
        overlay.classList.add('active');
      }

      function restart() {
        Object.keys(tileElements).forEach(function(id) { removeTileElement(parseInt(id)); });
        board = Array.from({length: SIZE}, function() { return Array(SIZE).fill(null); });
        score = 0;
        gameOver = false;
        messageEl.textContent = '';
        overlay.classList.remove('active');
        addRandomTile();
        addRandomTile();
        renderBoard();
      }

      skinSelect.addEventListener('change', function(e) {
        document.body.className = e.target.value;
      });
      restartBtn.addEventListener('click', restart);
      overlayRestartBtn.addEventListener('click', restart);

      document.addEventListener('keydown', function(e) {
        e.preventDefault();
        if (e.key === 'ArrowLeft') move('left');
        else if (e.key === 'ArrowRight') move('right');
        else if (e.key === 'ArrowUp') move('up');
        else if (e.key === 'ArrowDown') move('down');
      });

      var touchStartX = 0, touchStartY = 0;
      boardEl.addEventListener('touchstart', function(e) {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
      });
      boardEl.addEventListener('touchend', function(e) {
        var dx = e.changedTouches[0].clientX - touchStartX;
        var dy = e.changedTouches[0].clientY - touchStartY;
        if (Math.abs(dx) > Math.abs(dy)) {
          move(dx > 0 ? 'right' : 'left');
        } else {
          move(dy > 0 ? 'down' : 'up');
        }
      });

      createRain();
      restart();
    })();
  </script>
</body>
</html>
