<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>地下1000階 | Deepforge</title><style>
*{box-sizing:border-box}:root{--panel:#112235;--line:#31516b;--text:#eef7ff;--aqua:#63e5e0;--gold:#ffd36d}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -20%,#27496a,#07101a 62%);color:var(--text);font:14px system-ui,"Noto Sans JP",sans-serif}button{font:inherit;color:inherit;cursor:pointer}.wrap{width:min(1220px,100%);margin:auto;padding:14px}.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.brand small{color:var(--aqua);letter-spacing:.2em}.brand b{display:block;font-size:22px;letter-spacing:.1em}.back{color:#b5cee0;text-decoration:none}.game{position:relative;border:1px solid #426b87;border-radius:12px;overflow:hidden;box-shadow:0 20px 55px #0009;background:#101d2d}canvas{width:100%;height:auto;display:block;image-rendering:pixelated;touch-action:none}.hud{position:absolute;left:12px;top:10px;display:flex;gap:7px;flex-wrap:wrap;pointer-events:none}.chip{padding:5px 9px;background:#07121fce;border:1px solid #4e7291;border-radius:5px;font-size:12px}.chip b{color:var(--gold)}.hint{position:absolute;bottom:9px;left:50%;translate:-50%;width:max-content;max-width:90%;padding:7px 12px;border-radius:7px;background:#07121fe0;border:1px solid #365b79;color:#d6e9fa;font-size:12px;text-align:center}.below{display:grid;grid-template-columns:1.1fr .9fr;gap:12px;margin-top:12px}.panel{padding:13px;background:linear-gradient(135deg,#142c42,#0b1725);border:1px solid #31516b;border-radius:10px}h2{margin:0 0 9px;color:var(--aqua);font-size:13px;letter-spacing:.12em}.tools{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;padding:5px;background:#050a10;border:2px solid #6b8ba3;border-radius:7px}.slot{position:relative;min-height:61px;border:2px solid #7898ad;background:linear-gradient(#20384b,#0b1520);border-radius:3px;text-align:center;padding:5px;box-shadow:inset 0 0 0 2px #0008}.slot.active{outline:3px solid var(--gold);z-index:1;background:#36546b}.slot span{font-size:22px;display:block}.slot small{color:#d2e4ed;font-size:10px}.build{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}.build button,.upgrade{border:1px solid #456a87;background:#172d43;border-radius:6px;padding:8px 10px}.build button:hover,.upgrade:hover{background:#224762}.upgrade{display:flex;justify-content:space-between;width:100%;margin-top:6px}.upgrade em{color:var(--gold);font-size:11px;font-style:normal}.notice{min-height:36px;color:#bdd1e1;line-height:1.5}@media(max-width:650px){.wrap{padding:7px}.brand b{font-size:18px}.below{grid-template-columns:1fr}.head{margin-bottom:7px}.slot{min-height:47px;padding:2px}.slot span{font-size:17px}.hint{font-size:10px}}
</style></head><body><main class="wrap"><header class="head"><div class="brand"><small>2D SANDBOX ADVENTURE</small><b>地下1000階 <span style="color:#63e5e0">DEEPFORGE</span></b></div><a class="back" href="index.html">← 作品一覧</a></header><section class="game"><canvas id="cv" width="1200" height="600"></canvas><div class="hud"><span class="chip">♥ HP <b id="hp"></b></span><span class="chip">⚔ 攻撃 <b id="atk"></b></span><span class="chip">⌄ 深度 <b id="depth"></b> m</span><span class="chip">☀ <b id="zone"></b></span></div><div class="hint" id="hint"></div></section><section class="below"><div class="panel"><h2>ホットバー　<small>1〜0で切替 / 長押しで採掘</small></h2><div class="tools" id="tools"></div><div class="build"><button onclick="selectTool(2)">🧱 土ブロックを置く</button><button onclick="selectTool(3)">🪨 石ブロックを置く</button><button onclick="selectTool(4)">🕯 松明を置く</button><button onclick="save()">💾 セーブ</button><button onclick="resetGame()">↻ 新しい世界</button></div></div><div class="panel"><h2>作業台 / クラフト</h2><div class="notice">木のツルハシで土と木を集め、石のツルハシ、鉄のツルハシへと進化させよう。</div><button class="upgrade" onclick="craft(1)"><span>🪨 石のツルハシ<br><em>石と鉄鉱石を採掘可能</em></span><b>木 3 / 石 10</b></button><button class="upgrade" onclick="craft(2)"><span>⛏ 鉄のツルハシ<br><em>蒼晶石を採掘可能</em></span><b>石 15 / 鉄 10</b></button><button class="upgrade" onclick="upgrade('base')"><span>🏠 基地を拡張<br><em>最大HP +20</em></span><b id="baseCost"></b></button></div></section></main><script>
const cv=document.querySelector('#cv'),ctx=cv.getContext('2d'),TW=24,W=180,H=60;let world=[],cam={x:0,y:0},keys={},mouse={x:0,y:0,down:false},time=0,selected=0,mining=null,particles=[],jumpPressed=false,facing=1;
let s=JSON.parse(localStorage.getItem('deepforgeWorld')||'null')||{px:288,py:300,vx:0,vy:0,hp:100,maxHp:100,pick:0,sword:1,base:1,wood:0,dirt:10,stone:0,iron:0,crystal:0,torches:2,kills:0};if(!s.craftVersion){s.pick=0;s.craftVersion=1}s.pick=Math.min(2,s.pick||0);
const T={0:{n:'空気'},1:{n:'土',c:'#855438',d:'dirt',h:0,t:34},2:{n:'草地',c:'#548b41',d:'dirt',h:0,t:42},3:{n:'石',c:'#536273',d:'stone',h:1,t:112},4:{n:'鉄鉱石',c:'#a66c50',d:'iron',h:1,t:148},5:{n:'蒼晶石',c:'#3fbdcc',d:'crystal',h:2,t:220},6:{n:'木材',c:'#71452b',d:'wood',h:0,t:54},7:{n:'葉',c:'#3d7442',d:'wood',h:0,t:24},8:{n:'松明'}};let mobs=[];
function say(v){hint.textContent=v}function tile(x,y){return world[y]?.[x]??3}function set(x,y,v){if(world[y]&&x>=0&&x<W)world[y][x]=v}function solid(v){return v>0&&v!==8&&v!==7}function R(n){return Math.floor(Math.random()*n)}
function surface(x){for(let y=0;y<H;y++)if(solid(tile(x,y)))return y;return 20}function newWorld(){world=Array.from({length:H},()=>Array(W).fill(0));let g=20;for(let x=0;x<W;x++){g+=Math.random()<.3?(Math.random()<.5?-1:1):0;g=Math.max(16,Math.min(24,g));for(let y=g;y<H;y++){let v=y<g+5?1:3;if(y>34&&Math.random()<.055)v=4;if(y>45&&Math.random()<.045)v=5;world[y][x]=v}world[g][x]=2}for(let x=8;x<W;x+=10+R(15)){let y=surface(x);for(let q=y-1;q>y-5-R(4);q--)set(x,q,6);for(let dx=-2;dx<=2;dx++)for(let q=y-5;q<y-1;q++)if(Math.abs(dx)+Math.abs(q-(y-3))<4)set(x+dx,q,7)}mobs=[];for(let i=0;i<22;i++){let x=30+R(W-35);mobs.push({x:x*TW,y:(surface(x)-1)*TW,hp:8+R(10),dir:Math.random()<.5?-1:1})}}
let stored=localStorage.getItem('deepforgeMap');if(stored)try{world=JSON.parse(stored)}catch(e){newWorld()}if(!world.length)newWorld();
function collide(nx,ny){let l=Math.floor(nx/TW),r=Math.floor((nx+16)/TW),t=Math.floor(ny/TW),b=Math.floor((ny+22)/TW);return solid(tile(l,t))||solid(tile(r,t))||solid(tile(l,b))||solid(tile(r,b))}
function depth(){return Math.max(0,Math.floor((s.py/TW-18)*4))}function target(){return{x:Math.floor((mouse.x+cam.x)/TW),y:Math.floor((mouse.y+cam.y)/TW)}}function directionTarget(){let px=s.px/TW+.35,py=s.py/TW+.45,dx=(mouse.x+cam.x)/TW-px,dy=(mouse.y+cam.y)/TW-py;if(Math.abs(dx)>Math.abs(dy))return{x:Math.floor(px)+Math.sign(dx||facing),y:Math.floor(py)};return{x:Math.floor(px),y:Math.floor(py)+Math.sign(dy||1)}}function tick(){time++;let speed=keys.shift?3.1:2.1;if(keys.a||keys.arrowleft){s.vx=-speed;facing=-1}else if(keys.d||keys.arrowright){s.vx=speed;facing=1}else s.vx*=.7;if(jumpPressed&&s.ground){s.vy=-7.2;s.ground=false}jumpPressed=false;s.vy=Math.min(9,s.vy+.38);let nx=s.px+s.vx;if(!collide(nx,s.py))s.px=nx;else s.vx=0;let ny=s.py+s.vy;if(!collide(s.px,ny)){s.py=ny;s.ground=false}else{if(s.vy>0)s.ground=true;s.vy=0;s.py=Math.floor(s.py/TW)*TW-1}if(mouse.down)mineTick();if(s.py>H*TW-40)s.hp--;for(const m of mobs)if(m.hp>0){m.x+=m.dir*.35;if(solid(tile(Math.floor((m.x+(m.dir>0?19:-2))/TW),Math.floor((m.y+18)/TW))))m.dir*=-1;if(Math.abs(m.x-s.px)<20&&Math.abs(m.y-s.py)<25&&time%45===0){s.hp-=4+Math.floor(depth()/120);say('スライムの攻撃！ 剣でクリックして倒そう。')}}particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.18;p.life--});particles=particles.filter(p=>p.life>0);if(s.hp<=0){s.hp=s.maxHp;s.px=288;s.py=(surface(12)-2)*TW;s.vx=s.vy=0;say('基地へ救出された。')}cam.x=Math.max(0,Math.min(W*TW-cv.width,s.px-cv.width*.45));cam.y=Math.max(0,Math.min(H*TW-cv.height,s.py-cv.height*.53));draw();ui();requestAnimationFrame(tick)}
function beginAction(){let q=directionTarget(),dx=q.x-(s.px/TW+.35),dy=q.y-(s.py/TW+.45);if(Math.hypot(dx,dy)>2.15){say('手の届く1ブロック先だけを作業できます。');return}let v=tile(q.x,q.y);if(selected>=2){if(v!==0)return;let item=selected===2?'dirt':selected===3?'stone':'torches';if(!s[item]){say('素材が足りない。');return}s[item]--;set(q.x,q.y,selected===2?1:selected===3?3:8);say('ブロックを設置。');return}let m=mobs.find(e=>e.hp>0&&Math.abs(e.x/TW-q.x)<1&&Math.abs(e.y/TW-q.y)<1);if(m&&selected===1){m.hp-=4+s.sword*3;if(m.hp<=0){s.kills++;s.iron+=R(2);say('スライムを倒した！')}return}if(selected===0&&v&&v!==8){let t=T[v];if(t.h>s.pick){say(t.n+'はこのツルハシでは硬すぎる。');return}mining={x:q.x,y:q.y,p:0,max:Math.round(t.t/(1+s.pick*.55)),type:v}}}
function mineTick(){if(!mining)return;let q=directionTarget();if(q.x!==mining.x||q.y!==mining.y){mining=null;return}let v=tile(q.x,q.y);if(v!==mining.type){mining=null;return}mining.p++;if(mining.p%10===0)say(T[v].n+'を採掘中… '+Math.min(100,Math.floor(mining.p/mining.max*100))+'%');if(mining.p<mining.max)return;let t=T[v];set(q.x,q.y,0);s[t.d]=(s[t.d]||0)+1;if(v===5)s.torches++;for(let i=0;i<16;i++)particles.push({x:(q.x+.5)*TW,y:(q.y+.5)*TW,vx:(Math.random()-.5)*4,vy:-Math.random()*4,life:24+R(18),c:t.c});say(t.n+'を掘り出した！');mining=null;renderTools()}
function selectTool(v){selected=v;mining=null;renderTools()}function save(){localStorage.setItem('deepforgeWorld',JSON.stringify(s));localStorage.setItem('deepforgeMap',JSON.stringify(world));say('世界を保存しました。')}function resetGame(){if(confirm('現在の世界を消して新しい世界を作りますか？')){localStorage.removeItem('deepforgeWorld');localStorage.removeItem('deepforgeMap');location.reload()}}function craft(level){if(s.pick>=level){say('すでにこのツルハシ以上を持っています。');return}if(level===1){if(s.wood<3||s.stone<10){say('木3・石10が必要。');return}s.wood-=3;s.stone-=10}else{if(s.stone<15||s.iron<10){say('石15・鉄10が必要。');return}s.stone-=15;s.iron-=10}s.pick=level;say(level===1?'石のツルハシをクラフト！':'鉄のツルハシをクラフト！');renderTools()}function upgrade(k){let cost=2+s.base*2;if(s.crystal<cost){say('蒼晶石が足りない。');return}s.crystal-=cost;s.base++;s.maxHp+=20;s.hp=s.maxHp;say('基地を拡張した！');renderTools()}
function draw(){ctx.fillStyle=depth()>110?'#12172c':depth()>50?'#25354a':'#5ca6c8';ctx.fillRect(0,0,1200,600);let sx=Math.floor(cam.x/TW),sy=Math.floor(cam.y/TW),ex=Math.ceil((cam.x+1200)/TW)+1,ey=Math.ceil((cam.y+600)/TW)+1;for(let y=sy;y<ey;y++)for(let x=sx;x<ex;x++){let v=tile(x,y);if(!v)continue;let px=x*TW-cam.x,py=y*TW-cam.y;if(v===8){ctx.fillStyle='#7b4e28';ctx.fillRect(px+10,py+10,4,15);ctx.fillStyle='#ffe47a';ctx.fillRect(px+7,py+3,10,10);continue}ctx.fillStyle=T[v].c;ctx.fillRect(px,py,TW+1,TW+1);if(v===1||v===3){ctx.fillStyle='#ffffff18';ctx.fillRect(px+3,py+5,3,3);ctx.fillRect(px+15,py+14,2,2)}if(v===4||v===5){ctx.fillStyle=v===4?'#f1b176':'#9effff';ctx.fillRect(px+5,py+5,7,6);ctx.fillRect(px+14,py+15,6,5)}if(mining&&mining.x===x&&mining.y===y){ctx.fillStyle='#03070a99';ctx.fillRect(px,py,TW,TW);ctx.strokeStyle='#e9f4ff';ctx.lineWidth=1;let z=mining.p/mining.max;ctx.beginPath();ctx.moveTo(px+3,py+3);ctx.lineTo(px+TW*z,py+TW*.55);ctx.lineTo(px+TW*.45,py+TW*z);ctx.stroke()}}for(const m of mobs)if(m.hp>0){let px=m.x-cam.x,py=m.y-cam.y;ctx.fillStyle='#78db74';ctx.beginPath();ctx.arc(px+10,py+15,10,0,7);ctx.fill();ctx.fillStyle='#173a36';ctx.fillRect(px+5,py+12,3,3);ctx.fillRect(px+13,py+12,3,3)}for(const p of particles){ctx.fillStyle=p.c;ctx.fillRect(p.x-cam.x,p.y-cam.y,4,4)}let px=s.px-cam.x,py=s.py-cam.y;ctx.fillStyle='#ffe4bb';ctx.fillRect(px+4,py,11,9);ctx.fillStyle='#3c668d';ctx.fillRect(px+2,py+9,15,14);ctx.fillStyle='#c98745';ctx.fillRect(px,py+22,7,3);ctx.fillRect(px+11,py+22,7,3);ctx.strokeStyle=selected===0?'#d1d8d2':'#f2e0b2';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(px+14,py+13);ctx.lineTo(px+21*facing,py+20);ctx.stroke()}
function renderTools(){let names=['木のツルハシ','石のツルハシ','鉄のツルハシ'];let a=[['⛏',names[s.pick],'' ],['⚔','剣','Lv.'+s.sword],['🧱','土',s.dirt],['🪨','石',s.stone],['🕯','松明',s.torches],['','', ''],['','', ''],['','', ''],['','', ''],['','', '']];tools.innerHTML=a.map((e,i)=>'<button class="slot '+(selected===i?'active':'')+'" '+(i>4?'disabled':'')+' onclick="selectTool('+i+')"><span>'+e[0]+'</span><small>'+e[1]+' '+e[2]+'</small></button>').join('')}function ui(){let currentDepth=depth();hp.textContent=Math.ceil(s.hp)+' / '+s.maxHp;atk.textContent=4+s.sword*3;document.querySelector('#depth').textContent=currentDepth;zone.textContent=currentDepth<45?'森の入口':currentDepth<110?'地下洞窟':currentDepth<180?'水晶深層':'灼熱の深部';baseCost.textContent='蒼晶石 '+(2+s.base*2);if(time%60===0)renderTools()}
addEventListener('keydown',e=>{let k=e.key.toLowerCase();keys[k]=true;if((k==='w'||k==='arrowup'||k===' ')&&!e.repeat)jumpPressed=true;if('12345'.includes(e.key))selectTool(+e.key-1);if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);function pointer(e){let r=cv.getBoundingClientRect();mouse.x=(e.clientX-r.left)*1200/r.width;mouse.y=(e.clientY-r.top)*600/r.height}cv.addEventListener('pointermove',pointer);cv.addEventListener('pointerdown',e=>{pointer(e);mouse.down=true;cv.setPointerCapture(e.pointerId);beginAction()});cv.addEventListener('pointerup',()=>{mouse.down=false;mining=null});cv.addEventListener('pointercancel',()=>{mouse.down=false;mining=null});renderTools();say('A / D で移動、W / Spaceでジャンプ。ツルハシを選び、壊したい方向へ長押しで採掘。');requestAnimationFrame(tick);
</script></body></html>
