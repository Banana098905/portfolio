<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Ocean Quest ~ Ultimate Fishing ~</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #070b12;
      --panel-bg: rgba(13, 22, 38, 0.85);
      --panel-border: rgba(0, 240, 255, 0.25);
      --neon-cyan: #00f0ff;
      --neon-green: #39ff14;
      --neon-pink: #ff007f;
      --neon-gold: #ffd700;
      --text-main: #f4f7f6;
      --text-sub: #8b9bb4;
      --glow-cyan: 0 0 10px rgba(0, 240, 255, 0.5);
      --glow-gold: 0 0 15px rgba(255, 215, 0, 0.6);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-dark);
      font-family: 'Outfit', 'Noto Sans JP', sans-serif;
      touch-action: none;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(ellipse at center, #0a1628, #03070e);
    }

    #game-container {
      position: relative;
      display: flex;
      flex-direction: column;
      background: linear-gradient(180deg, #091326 0%, #03070e 100%);
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.9);
      width: 100vw;
      height: 100vh;
      max-width: 1200px;
      max-height: 800px;
      border-radius: 0;
      border: none;
      aspect-ratio: auto;
    }

    @media (min-width: 1200px) and (orientation: landscape) {
      #game-container {
        border-radius: 20px;
        border: 2px solid var(--panel-border);
        box-shadow: 0 20px 60px rgba(0,0,0,0.9);
      }
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 14px;
      background: rgba(4, 8, 15, 0.9);
      border-bottom: 1px solid var(--panel-border);
      backdrop-filter: blur(10px);
      z-index: 10;
      flex-shrink: 0;
      flex-wrap: wrap;
      gap: 4px;
      min-height: 44px;
    }

    .hud-left, .hud-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .back-portfolio-btn {
      color: var(--neon-cyan);
      text-decoration: none;
      font-size: clamp(0.55rem, 1vw, 0.75rem);
      font-weight: bold;
      border: 1px solid rgba(0, 240, 255, 0.3);
      padding: 4px 10px;
      border-radius: 6px;
      background: rgba(0, 240, 255, 0.05);
      transition: background 0.2s, color 0.2s;
      cursor: pointer;
      white-space: nowrap;
    }
    .back-portfolio-btn:hover {
      background: var(--neon-cyan);
      color: #000;
      box-shadow: var(--glow-cyan);
    }

    .hud-item {
      background: rgba(255,255,255,0.05);
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.1);
      font-size: clamp(0.55rem, 1vw, 0.8rem);
      display: flex;
      align-items: center;
      gap: 3px;
      white-space: nowrap;
    }

    .hud-gold { color: var(--neon-gold); text-shadow: var(--glow-gold); font-weight: bold; }
    .hud-gem { color: var(--neon-pink); text-shadow: 0 0 10px rgba(255,0,127,0.5); font-weight: bold; }
    .hud-lvl { color: var(--neon-cyan); text-shadow: var(--glow-cyan); font-weight: bold; }

    .hud-xp-bar {
      width: clamp(50px, 8vw, 100px);
      height: 6px;
      background: #222;
      border-radius: 999px;
      overflow: hidden;
      padding: 0;
    }
    #hud-xp-fill {
      height: 100%;
      width: 0%;
      background: var(--neon-cyan);
      box-shadow: var(--glow-cyan);
    }

    #stage {
      position: relative;
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    #fx-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }

    #water-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .env-indicator {
      position: absolute;
      top: 8px;
      right: 8px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      z-index: 3;
      pointer-events: none;
    }
    .badge {
      padding: 2px 8px;
      border-radius: 999px;
      font-size: clamp(0.4rem, 0.7vw, 0.6rem);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border: 1px solid rgba(255,255,255,0.15);
      backdrop-filter: blur(5px);
      text-align: center;
      white-space: nowrap;
    }
    .badge-weather { background: rgba(0, 240, 255, 0.2); color: var(--neon-cyan); border-color: var(--neon-cyan); }
    .badge-time { background: rgba(255, 215, 0, 0.2); color: var(--neon-gold); border-color: var(--neon-gold); }
    .badge-season { background: rgba(57, 255, 20, 0.2); color: var(--neon-green); border-color: var(--neon-green); }

    .map-title {
      position: absolute;
      top: 8px;
      left: 10px;
      z-index: 3;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
      pointer-events: none;
    }
    .map-title h2 {
      font-size: clamp(0.9rem, 1.8vw, 1.4rem);
      font-weight: 800;
      letter-spacing: 0.05em;
      color: #fff;
    }
    .map-title p {
      font-size: clamp(0.45rem, 0.8vw, 0.65rem);
      color: var(--text-sub);
    }

    #control-panel {
      position: absolute;
      bottom: clamp(10px, 2vh, 20px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 4;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .cast-btn {
      width: clamp(64px, 10vw, 110px);
      height: clamp(64px, 10vw, 110px);
      border-radius: 50%;
      background: radial-gradient(circle, #00f0ff 0%, #005f73 100%);
      border: 4px solid rgba(255,255,255,0.85);
      color: #fff;
      font-size: clamp(0.7rem, 1.5vw, 1.2rem);
      font-weight: 800;
      letter-spacing: 0.05em;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0, 240, 255, 0.5), inset 0 0 12px rgba(255,255,255,0.5);
      transition: transform 0.1s, box-shadow 0.2s;
      outline: none;
      display: flex;
      justify-content: center;
      align-items: center;
      text-shadow: 0 2px 5px rgba(0,0,0,0.5);
      touch-action: none;
    }
    .cast-btn:active { transform: scale(0.92); }
    .cast-btn.casting {
      background: radial-gradient(circle, #ff007f 0%, #800040 100%);
      box-shadow: 0 8px 20px rgba(255, 0, 127, 0.5);
    }

    #power-gauge-wrap {
      width: clamp(140px, 25vw, 260px);
      height: clamp(10px, 1.2vh, 14px);
      background: rgba(0,0,0,0.6);
      border: 2px solid var(--panel-border);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
      display: none;
    }
    #power-gauge-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--neon-green), var(--neon-gold), var(--neon-pink));
      transition: width 0.03s linear;
    }
    .power-marker {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 12px;
      height: 100%;
      border-left: 2px dashed #fff;
      border-right: 2px dashed #fff;
      background: rgba(255,255,255,0.15);
    }

    #action-msg {
      position: absolute;
      top: 35%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      font-size: clamp(1.5rem, 4vw, 3rem);
      font-weight: 900;
      font-style: italic;
      color: #fff;
      z-index: 5;
      pointer-events: none;
      text-shadow: 0 0 20px rgba(0,0,0,0.8);
      opacity: 0;
      transition: opacity 0.15s, transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    #action-msg.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    #action-msg.hit { color: var(--neon-pink); text-shadow: 0 0 20px rgba(255,0,127,0.8); }
    #action-msg.catch { color: var(--neon-gold); text-shadow: var(--glow-gold); }
    #action-msg.miss { color: var(--text-sub); }

    #fight-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(3, 8, 20, 0.5);
      z-index: 3;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 12px;
      touch-action: none;
    }
    .fight-panel {
      width: 100%;
      max-width: 440px;
      background: var(--panel-bg);
      border: 2px solid var(--panel-border);
      border-radius: 14px;
      padding: 14px;
      backdrop-filter: blur(15px);
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .fight-title { font-size: clamp(0.75rem, 1.3vw, 1rem); font-weight: 800; color: #fff; display: flex; align-items: center; gap: 6px; }
    .fight-title span { color: var(--neon-pink); text-shadow: 0 0 8px rgba(255,0,127,0.4); }
    .catch-bar-wrap { width: 100%; height: 10px; background: rgba(0,0,0,0.5); border-radius: 999px; border: 1px solid rgba(255,255,255,0.1); overflow: hidden; }
    .catch-bar-fill { height: 100%; width: 30%; background: linear-gradient(90deg, #ff007f, #ffd700); box-shadow: 0 0 10px rgba(255,0,127,0.5); transition: width 0.05s linear; }
    .reel-track {
      position: relative;
      width: 100%;
      height: 38px;
      background: rgba(0, 10, 25, 0.8);
      border: 2px solid var(--panel-border);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
    }
    .player-bar {
      position: absolute;
      top: 0;
      height: 100%;
      width: 25%;
      background: rgba(0, 240, 255, 0.25);
      border-left: 2px solid var(--neon-cyan);
      border-right: 2px solid var(--neon-cyan);
      box-shadow: inset 0 0 10px rgba(0, 240, 255, 0.4), var(--glow-cyan);
      pointer-events: none;
    }
    .player-bar.matching {
      background: rgba(57, 255, 20, 0.25);
      border-left: 2px solid var(--neon-green);
      border-right: 2px solid var(--neon-green);
      box-shadow: inset 0 0 10px rgba(57, 255, 20, 0.4), 0 0 10px rgba(57, 255, 20, 0.5);
    }
    .fish-icon {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .fish-icon svg { fill: var(--neon-gold); filter: drop-shadow(0 0 5px var(--neon-gold)); animation: wiggle 0.15s infinite alternate; }
    @keyframes wiggle { 0% { transform: rotate(-5deg); } 100% { transform: rotate(5deg); } }
    .fight-hint { font-size: clamp(0.5rem, 0.8vw, 0.65rem); color: var(--text-sub); text-align: center; }

    footer-nav {
      background: rgba(4, 8, 15, 0.95);
      border-top: 1px solid var(--panel-border);
      padding: 4px 6px;
      z-index: 10;
      display: flex;
      justify-content: space-around;
      flex-shrink: 0;
      flex-wrap: wrap;
      min-height: 44px;
    }
    .nav-btn {
      background: transparent;
      border: none;
      color: var(--text-sub);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
      font-size: clamp(0.45rem, 0.7vw, 0.65rem);
      font-family: inherit;
      transition: color 0.2s, transform 0.1s;
      flex: 1;
      max-width: 60px;
      padding: 2px 0;
    }
    .nav-btn svg { width: clamp(14px, 1.8vw, 20px); height: clamp(14px, 1.8vw, 20px); stroke: var(--text-sub); stroke-width: 2; fill: none; transition: stroke 0.2s; }
    .nav-btn:hover { color: #fff; }
    .nav-btn:hover svg { stroke: var(--neon-cyan); }
    .nav-btn:active { transform: scale(0.92); }
    .nav-btn.active { color: var(--neon-cyan); }
    .nav-btn.active svg { stroke: var(--neon-cyan); filter: drop-shadow(var(--glow-cyan)); }

    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(3, 7, 15, 0.94);
      z-index: 8;
      backdrop-filter: blur(12px);
      display: none;
      flex-direction: column;
      padding: 12px;
      overflow-y: auto;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      border-bottom: 1px solid var(--panel-border);
      padding-bottom: 6px;
      flex-shrink: 0;
    }
    .modal-header h3 { font-size: clamp(0.9rem, 1.5vw, 1.2rem); font-weight: 800; color: #fff; display: flex; align-items: center; gap: 6px; }
    .close-btn { background: transparent; border: none; cursor: pointer; padding: 4px; }
    .close-btn svg { width: 22px; height: 22px; stroke: var(--text-sub); }
    .close-btn:hover svg { stroke: #fff; }

    .modal-body {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow: hidden;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 8px;
      overflow-y: auto;
      flex: 1;
      min-height: 0;
      padding-bottom: 4px;
      align-content: start;
    }
    .item-card {
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 8px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 3px;
      position: relative;
    }
    .item-card.equipped { border-color: var(--neon-cyan); background: rgba(0, 240, 255, 0.05); }
    .item-card.equipped::after {
      content: 'EQUIPPED';
      position: absolute;
      top: 2px;
      right: 2px;
      font-size: 0.4rem;
      font-weight: 800;
      color: var(--neon-cyan);
      background: rgba(0, 240, 255, 0.2);
      padding: 1px 4px;
      border-radius: 3px;
      border: 1px solid var(--neon-cyan);
    }
    .item-icon { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; background: rgba(0, 240, 255, 0.05); border-radius: 50%; border: 1px solid rgba(0, 240, 255, 0.1); font-size: 1rem; }
    .item-title { font-size: clamp(0.6rem, 0.8vw, 0.75rem); font-weight: 600; color: #fff; }
    .item-desc { font-size: clamp(0.45rem, 0.6vw, 0.6rem); color: var(--text-sub); line-height: 1.2; flex: 1; }
    .item-cost { font-size: clamp(0.55rem, 0.7vw, 0.7rem); font-weight: bold; color: var(--neon-gold); }
    .buy-btn {
      width: 100%;
      padding: 4px 0;
      background: rgba(0, 240, 255, 0.15);
      border: 1px solid var(--neon-cyan);
      color: #fff;
      font-family: inherit;
      font-size: clamp(0.5rem, 0.6vw, 0.65rem);
      font-weight: 600;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .buy-btn:hover { background: var(--neon-cyan); color: #000; }
    .buy-btn:disabled { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.1); color: var(--text-sub); cursor: not-allowed; }

    .map-grid { display: flex; flex-direction: column; gap: 6px; overflow-y: auto; flex: 1; min-height: 0; }
    .map-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; flex-shrink: 0; }
    .map-row.locked { opacity: 0.5; }
    .map-row.active { border-color: var(--neon-green); background: rgba(57, 255, 20, 0.05); }
    .map-info { display: flex; flex-direction: column; gap: 1px; }
    .map-name { font-size: clamp(0.65rem, 1vw, 0.85rem); font-weight: bold; color: #fff; display: flex; align-items: center; gap: 4px; }
    .map-desc { font-size: clamp(0.5rem, 0.7vw, 0.6rem); color: var(--text-sub); }
    .map-action-btn { padding: 3px 10px; border-radius: 5px; font-size: clamp(0.5rem, 0.7vw, 0.65rem); font-weight: 600; cursor: pointer; font-family: inherit; }
    .map-action-btn.travel { background: rgba(57, 255, 20, 0.15); border: 1px solid var(--neon-green); color: #fff; }
    .map-action-btn.travel:hover { background: var(--neon-green); color: #000; }
    .map-action-btn.current { background: transparent; border: 1px solid rgba(255,255,255,0.2); color: var(--text-sub); cursor: default; }

    .fish-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; overflow-y: auto; flex: 1; min-height: 0; align-content: start; }
    .fish-card { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; padding: 8px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 3px; }
    .fish-card.locked { background: rgba(0,0,0,0.4); }
    .fish-card.locked .fish-card-name { color: var(--text-sub); }
    .fish-card-visual { width: 100%; height: 45px; background: rgba(0,0,0,0.2); border-radius: 5px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .fish-card-visual canvas { max-width: 100%; max-height: 100%; }
    .fish-card-name { font-size: clamp(0.6rem, 0.8vw, 0.75rem); font-weight: 700; color: #fff; }
    .fish-card-rarity { font-size: 0.45rem; padding: 1px 5px; border-radius: 4px; font-weight: 800; }
    .fish-card-stats { font-size: clamp(0.45rem, 0.6vw, 0.55rem); color: var(--text-sub); width: 100%; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 3px; text-align: left; display: flex; flex-direction: column; gap: 1px; }
    .fish-card.locked .fish-card-stats { visibility: hidden; }

    .skills-container { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; flex: 1; min-height: 0; }
    .skill-pts-remain { font-size: clamp(0.65rem, 1vw, 0.8rem); color: var(--neon-cyan); font-weight: bold; text-align: center; padding: 6px; background: rgba(0, 240, 255, 0.05); border: 1px solid rgba(0, 240, 255, 0.15); border-radius: 6px; flex-shrink: 0; }
    .skill-row { display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; padding: 8px 12px; flex-shrink: 0; }
    .skill-info { display: flex; flex-direction: column; gap: 2px; flex: 1; }
    .skill-name-wrap { display: flex; align-items: center; gap: 5px; }
    .skill-name-wrap strong { font-size: clamp(0.6rem, 0.8vw, 0.75rem); color: #fff; }
    .skill-lvl-badge { font-size: 0.5rem; background: rgba(255,255,255,0.1); padding: 1px 5px; border-radius: 4px; color: #fff; }
    .skill-btn { padding: 4px 10px; background: rgba(0, 240, 255, 0.15); border: 1px solid var(--neon-cyan); color: #fff; font-family: inherit; font-weight: bold; font-size: clamp(0.5rem, 0.7vw, 0.65rem); border-radius: 5px; cursor: pointer; }
    .skill-btn:hover { background: var(--neon-cyan); color: #000; }
    .skill-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    .craft-list { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; flex: 1; min-height: 0; }
    .craft-item { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; padding: 8px 12px; flex-shrink: 0; }
    .craft-materials { display: flex; gap: 4px; margin-top: 2px; flex-wrap: wrap; }
    .mat-badge { font-size: 0.45rem; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 1px 5px; border-radius: 4px; display: flex; align-items: center; gap: 2px; }
    .mat-badge.insufficient { color: var(--neon-pink); border-color: rgba(255, 0, 127, 0.3); background: rgba(255, 0, 127, 0.05); }

    .avatar-setup-wrap { display: flex; gap: 10px; align-items: center; padding: 8px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; flex-shrink: 0; }
    .avatar-preview-box { width: 64px; height: 64px; background: radial-gradient(circle, rgba(0,240,255,0.1) 0%, rgba(0,0,0,0.4) 100%); border: 2px solid var(--panel-border); border-radius: 8px; display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; }
    .avatar-preview-box canvas { width: 100%; height: 100%; }
    .cosme-tabs-wrap { flex: 1; display: flex; flex-direction: column; gap: 4px; }

    .result-close-btn {
      width: 100%;

    @media (max-width: 600px) {

    function saveGame() {
      localStorage.setItem('ocean_quest_save', JSON.stringify(game));
    }
    function loadGame() {
      const saved = localStorage.getItem('ocean_quest_save');
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          game = { ...game, ...parsed };
        } catch (e) { console.error("ロード失敗", e); }
      }
    }

    // ============================================================

    // ============================================================
    function updateHUD() {
      document.getElementById('hud-lvl-val').innerText = game.level;
      const nextXp = game.level * 100;
      const xpPercent = Math.min(100, (game.xp / nextXp) * 100);
      document.getElementById('hud-xp-fill').style.width = xpPercent + '%';
      document.getElementById('hud-gold-val').innerText = game.gold.toLocaleString();
      document.getElementById('hud-gem-val').innerText = game.gems;
      document.getElementById('env-weather-val').innerText = translateWeather(game.weather);
      document.getElementById('env-time-val').innerText = translateTime(game.clock);
      document.getElementById('env-season-val').innerText = translateSeason(game.season);
    }

    function updateMapInfo() {
      const currentMap = MAPS[game.mapId];
      document.getElementById('map-name-display').innerText = currentMap.name;
      document.getElementById('map-depth-display').innerText = `水深: ${currentMap.depth}`;
      drawWaterSurface();
    }

    function translateWeather(w) {
      const dict = { Sunny: '晴れ☀️', Rainy: '雨🌧️', Stormy: '雷雨⛈️', Cloudy: '曇り☁️', Typhoon: '台風🌀', Aurora: 'オーロラ🌌', Meteor: '流星群🌠' };
      return dict[w] || w;
    }
    function translateTime(c) {
      if (c >= 6 && c < 12) return '朝 🌅';
      if (c >= 12 && c < 17) return '昼 ☀️';
      if (c >= 17 && c < 19) return '夕方 🌇';
      return '夜 🌙';
    }
    function translateSeason(s) {
      const dict = { Spring: '春🌸', Summer: '夏🌻', Autumn: '秋🍁', Winter: '冬❄️' };
      return dict[s] || s;
    }

    // ============================================================
    // モーダル開閉
    // ============================================================
    let activeModal = null;

    function openModal(id) {
      if (activeModal === id) { closeModal(id); return; }
      if (activeModal) closeModal(activeModal);
      document.getElementById(id).style.display = 'flex';
      activeModal = id;
      updateNavActive(id);
      if (id === 'modal-map') renderMapSelection();
      if (id === 'modal-shop') renderShopItems();
      if (id === 'modal-book') renderFishBook();
      if (id === 'modal-skills') renderSkills();
      if (id === 'modal-craft') renderCraft();
      if (id === 'modal-quests') renderQuests();
      if (id === 'modal-ranking') renderLeaderboard();
    }

    function closeModal(id) {
      document.getElementById(id).style.display = 'none';
      if (activeModal === id) {
        activeModal = null;
        document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
      }
    }

    function closeActiveModal() {
      if (activeModal) {
        closeModal(activeModal);
      }
    }

    function updateNavActive(modalId) {
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('active');
        if (btn.dataset.modal === modalId) btn.classList.add('active');
      });
    }

    // ============================================================
    // 環境・時間
    // ============================================================
    function updateWorldClock() {
      game.clock += 0.5;
      if (game.clock >= 24) {
        game.clock = 0;
        game.daysPassed++;
        const seasons = ['Spring', 'Summer', 'Autumn', 'Winter'];
        const currentIdx = seasons.indexOf(game.season);
        game.season = seasons[(currentIdx + 1) % 4];
      }
      if (Math.random() < 0.15) {
        const weathers = ['Sunny', 'Sunny', 'Cloudy', 'Rainy', 'Stormy', 'Typhoon', 'Aurora', 'Meteor'];
        let selection = weathers;
        if (game.mapId < 4) selection = ['Sunny', 'Sunny', 'Cloudy', 'Rainy'];
        game.weather = selection[Math.floor(Math.random() * selection.length)];
      }
      updateHUD();
    }

    function drawFishOnCanvas(canvas, color) {
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const w = canvas.width, h = canvas.height;
      ctx.fillStyle = color;
      ctx.strokeStyle = 'rgba(255,255,255,0.2)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(w * 0.25, h * 0.5);
      ctx.lineTo(w * 0.1, h * 0.3);
      ctx.lineTo(w * 0.14, h * 0.5);
      ctx.lineTo(w * 0.1, h * 0.7);
      ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.beginPath();
      ctx.ellipse(w * 0.55, h * 0.5, w * 0.3, h * 0.22, 0, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.2)';
      ctx.beginPath();
      ctx.moveTo(w * 0.5, h * 0.6);
      ctx.lineTo(w * 0.45, h * 0.72);
      ctx.lineTo(w * 0.56, h * 0.6);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(w * 0.75, h * 0.46, 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(w * 0.76, h * 0.46, 1.5, 0, Math.PI * 2);
      ctx.fill();
    }

    function executeCraft(name) {
      const recipe = CRAFT_RECIPES.find(r => r.result === name);

      let canCraft = game.gold >= recipe.cost;
      recipe.materials.forEach(m => { if ((game.materials[m.name] || 0) < m.qty) canCraft = false; });
      if (canCraft) {
        game.gold -= recipe.cost;
        recipe.materials.forEach(m => { game.materials[m.name] -= m.qty; });
        if (name === '神エサ') game.baits['神エサ']++;
        if (name === '特殊ルアー') game.baits['特殊エサ'] += 5;
        if (name === '神話の竿') { if(!game.ownedRods.includes(8)) game.ownedRods.push(8); game.rodId = 8; }
        if (name === '海神の竿') { if(!game.ownedRods.includes(9)) game.ownedRods.push(9); game.rodId = 9; }
        saveGame(); renderCraft(); updateHUD();
        addVisualSplashEffect("CRAFT!");

    function progressQuest(type, data) {
      game.quests.forEach(q => {
        if (q.done) return;
        if (q.type === 'catch' && type === 'catch' && q.targetId === data.fishId) q.progress += data.qty;
        else if (q.type === 'weight' && type === 'weight') q.progress += data.weight;
        else if (q.type === 'cast' && type === 'cast' && q.targetMap === data.mapId) q.progress++;
      });
    }

    function gainXP(amt) {
      const studyLevel = game.skills.study || 0;
      const bonusXp = Math.round(amt * (1 + studyLevel * 0.2));
      game.xp += bonusXp;
      let nextXp = game.level * 100;
      while (game.xp >= nextXp) {
        game.xp -= nextXp;
        game.level++;
        game.skillPoints += 2;
        addVisualSplashEffect(`LEVEL UP! LV.${game.level}`);
        nextXp = game.level * 100;
      }
    }

        const bait = game.selectedBait;
        if (!game.baits[bait] || game.baits[bait] <= 0) {
          alert(`エサ【${bait}】がありません！`);
          return;
        }
        startCasting();
      } else if (castState === 'casting') {
        stopCasting();
      } else if (castState === 'waiting') {
        clearTimeout(castTimer);
        castState = 'idle';
        const btn = document.getElementById('cast-btn');
        btn.innerText = 'CAST';
        btn.className = 'cast-btn';
        btn.disabled = false;
        bobberThrown = false;
        drawWaterSurface();
        addVisualSplashEffect("リセット");
      } else if (castState === 'hit') {
        triggerFight();
      }
    }

    function startCasting() {
      console.log('startCasting');
      closeActiveModal();
      castState = 'casting';
      castPower = 0;
      powerDir = 1;
      const btn = document.getElementById('cast-btn');
      btn.innerText = 'STOP';
      btn.classList.add('casting');
      const wrap = document.getElementById('power-gauge-wrap');
      wrap.style.display = 'block';
      timingLoop = setInterval(() => {
        castPower += 2 * powerDir;
        if (castPower >= 100) { powerDir = -1; castPower = 100; }
        if (castPower <= 0) { powerDir = 1; castPower = 0; }
        document.getElementById('power-gauge-fill').style.width = castPower + '%';
      }, 20);
    }

    function stopCasting() {
      console.log('stopCasting');
      clearInterval(timingLoop);
      castState = 'waiting';
      const wrap = document.getElementById('power-gauge-wrap');
      wrap.style.display = 'none';
      const rod = RODS[game.rodId];
      const castAcc = 1 - Math.abs(castPower - 50) / 50;
      lineDistance = Math.round(rod.dist * (0.3 + castAcc * 0.7));
      const btn = document.getElementById('cast-btn');
      btn.innerText = '待機中';
      btn.disabled = true;
      game.baits[game.selectedBait]--;
      saveGame();
      updateHUD();
      progressQuest('cast', { mapId: game.mapId });
      throwBobber(lineDistance);
      const waitTime = 2000 + Math.random() * 2500;
      castTimer = setTimeout(triggerHit, waitTime);
    }

    function triggerHit() {
      console.log('triggerHit');
      castState = 'hit';
      const btn = document.getElementById('cast-btn');
      btn.innerText = 'HIT!';
      btn.disabled = false;
      btn.classList.remove('casting');
      btn.classList.add('hit');
      const msg = document.getElementById('action-msg');
      msg.innerText = 'HIT!';
      msg.className = 'show hit';
      selectRandomFish();
      setTimeout(() => {
        if (castState === 'hit') triggerFight();
      }, 400);
    }

    function triggerMiss() {
      console.log('triggerMiss');
      clearTimeout(castTimer);
      castState = 'idle';
      const btn = document.getElementById('cast-btn');
      btn.innerText = 'CAST';
      btn.className = 'cast-btn';
      btn.disabled = false;
      const msg = document.getElementById('action-msg');
      msg.innerText = '逃げられた...';
      msg.className = 'show miss';
      setTimeout(() => { msg.className = ''; }, 1200);
      bobberThrown = false;
      drawWaterSurface();
    }

    function triggerFight() {
      console.log('triggerFight');
      clearTimeout(castTimer);
      castState = 'fight';
      const msg = document.getElementById('action-msg');
      msg.className = '';
      const btn = document.getElementById('cast-btn');
      btn.innerText = 'バトル';
      btn.disabled = true;
      if (!targetFish) {
        selectRandomFish();
        if (!targetFish) { castState='idle'; btn.innerText='CAST'; btn.className='cast-btn'; btn.disabled=false; return; }
      }
      document.getElementById('fight-fish-name').innerText = targetFish.name;
      document.getElementById('fight-overlay').style.display = 'flex';
      fishPos = 50; fishVel = 0; playerPos = 40; playerVel = 0; catchGauge = 40; isReeling = false;
      startReelBattleLoop();
    }

    function startReelBattleLoop() {
      const playerBar = document.getElementById('fight-player-bar');
      const fishIcon = document.getElementById('fight-fish-icon');
      const fillBar = document.getElementById('fight-catch-fill');
      const rarityMultiplier = { Common:1.0, Uncommon:1.2, Rare:1.5, Epic:2.0, Legendary:2.8, Mythic:3.8, Divine:5.0 };
      const diff = rarityMultiplier[targetFish.rarity] || 1.0;
      const skillPower = game.skills.power || 0;
      const barWidth = 25 + (skillPower * 3);
      playerBar.style.width = barWidth + '%';
      let lastTime = performance.now();

      function updateFight(time) {
        if (castState !== 'fight') return;
        const dt = (time - lastTime) / 1000;
        lastTime = time;
        if (Math.random() < 0.06) fishVel = (Math.random() - 0.5) * 80 * diff;
        fishPos += fishVel * dt;
        if (fishPos < 0) { fishPos = 0; fishVel = -fishVel * 0.5; }
        if (fishPos > 90) { fishPos = 90; fishVel = -fishVel * 0.5; }
        if (isReeling) playerVel += 150 * dt;
        else playerVel -= 120 * dt;
        playerVel *= 0.95;
        playerPos += playerVel * dt;
        if (playerPos < 0) { playerPos = 0; playerVel = 0; }
        if (playerPos > 100 - barWidth) { playerPos = 100 - barWidth; playerVel = 0; }
        const fishCenter = fishPos + 5;
        const isMatched = (fishCenter >= playerPos) && (fishCenter <= playerPos + barWidth);
        if (isMatched) {
          playerBar.classList.add('matching');
          catchGauge += (16 + skillPower * 2) * dt;
        } else {
          playerBar.classList.remove('matching');
          catchGauge -= (18 + diff * 2) * dt;
        }
        playerBar.style.left = playerPos + '%';
        fishIcon.style.left = fishPos + '%';
        fillBar.style.width = Math.max(0, Math.min(100, catchGauge)) + '%';
        if (catchGauge >= 100) { triggerCatch(); }
        else if (catchGauge <= 0) { triggerMiss(); document.getElementById('fight-overlay').style.display = 'none'; }
        else { fightLoop = requestAnimationFrame(updateFight); }
      }
      fightLoop = requestAnimationFrame(updateFight);
    }

    function triggerCatch() {
      console.log('CATCH!');
      castState = 'result';
      cancelAnimationFrame(fightLoop);
      document.getElementById('fight-overlay').style.display = 'none';
      const lenFactor = 0.8 + Math.random() * 0.5;
      const weightFactor = lenFactor * lenFactor * (0.9 + Math.random() * 0.2);
      let finalLen = targetFish.baseLen * lenFactor;
      let finalWeight = targetFish.baseWeight * weightFactor;
      let isCrown = false, isShiny = false;
      if (Math.random() < 0.03) { isCrown = true; finalLen *= 1.6; finalWeight *= 2.5; }
      if (Math.random() < 0.02) { isShiny = true; }
      const tradeLvl = game.skills.trade || 0;
      let finalGold = Math.round(targetFish.cost * (1 + tradeLvl * 0.15));
      if (isCrown) finalGold = Math.round(finalGold * 2.0);
      if (isShiny) finalGold = Math.round(finalGold * 3.0);
      game.gold += finalGold;
      gainXP(targetFish.xp);
      let dropMat = '', dropQty = 0;
      if (targetFish.rarity === 'Common') { if(Math.random()<0.5){dropMat='魚のウロコ'; dropQty=1+Math.floor(Math.random()*2);} }
      else if (targetFish.rarity === 'Uncommon') { if(Math.random()<0.6){dropMat='魚のウロコ'; dropQty=2+Math.floor(Math.random()*3);} }
      else if (targetFish.rarity === 'Rare') { dropMat = Math.random()<0.5 ? '虹色のヒレ' : '魚のウロコ'; dropQty = dropMat==='虹色のヒレ'?1:4; }
      else if (targetFish.rarity === 'Epic') { dropMat = Math.random()<0.4 ? '深海の結晶' : '虹色のヒレ'; dropQty = dropMat==='深海の結晶'?1:2; }
      else if (targetFish.rarity === 'Legendary') { dropMat = Math.random()<0.5 ? '古代の化石' : '深海の結晶'; dropQty = dropMat==='古代の化石'?1:2; }
      else if (targetFish.rarity === 'Mythic') { dropMat='古代の化石'; dropQty=2; }
      else if (targetFish.rarity === 'Divine') { dropMat='海神の輝石'; dropQty=1; }
      if (dropMat) game.materials[dropMat] = (game.materials[dropMat] || 0) + dropQty;

      if (!game.book[targetFish.id]) game.book[targetFish.id] = { caught:1, maxLen:finalLen, maxWeight:finalWeight, firstDate:new Date().toISOString().split('T')[0] };
      else { game.book[targetFish.id].caught++; game.book[targetFish.id].maxLen = Math.max(game.book[targetFish.id].maxLen, finalLen); game.book[targetFish.id].maxWeight = Math.max(game.book[targetFish.id].maxWeight, finalWeight); }
      game.totalCaught++;
      progressQuest('catch', { fishId: targetFish.id, qty: 1 });
      progressQuest('weight', { weight: finalWeight });
      game.achievements.forEach(a => { if(a.type==='total_caught' && game.totalCaught>=a.target) a.progress=a.target; if(a.type==='rarity_legendary' && (targetFish.rarity==='Legendary'||targetFish.rarity==='Mythic'||targetFish.rarity==='Divine')) a.progress=1; if(a.type==='book_count') a.progress=Object.keys(game.book).length; });

      document.getElementById('result-rarity-badge').innerText = targetFish.rarity + (isShiny?' ✨SHINY':'') + (isCrown?' 👑CROWN':'');
      document.getElementById('result-rarity-badge').className = `result-badge rarity-${targetFish.rarity.toLowerCase()}`;
      document.getElementById('result-fish-name').innerText = (isShiny?'シャイニー':'') + targetFish.name;
      document.getElementById('result-fish-length').innerText = finalLen.toFixed(1);
      document.getElementById('result-fish-weight').innerText = finalWeight.toFixed(1);
      document.getElementById('result-gold').innerText = `+${finalGold} G`;
      document.getElementById('result-xp').innerText = `+${targetFish.xp} XP`;
      const bonusRow = document.getElementById('result-bonus-row');
      if (isCrown || isShiny) { bonusRow.style.display='flex'; let t=''; if(isCrown) t+='巨大冠(x2) '; if(isShiny) t+='シャイニー(x3) '; document.getElementById('result-bonus-txt').innerText=t; } else bonusRow.style.display='none';
      const matRow = document.getElementById('result-mat-row');
      if (dropMat) { matRow.style.display='flex'; document.getElementById('result-mat-txt').innerText=`${dropMat} x${dropQty}`; } else matRow.style.display='none';
      const resCanvas = document.getElementById('result-fish-canvas');
      drawFishOnCanvas(resCanvas, isShiny?'gold':targetFish.color);
      document.getElementById('catch-result-overlay').style.display = 'flex';
      saveGame(); updateHUD(); createSplashParticles();
    }

    function closeResult() {
      document.getElementById('catch-result-overlay').style.display = 'none';
      castState = 'idle';
      const btn = document.getElementById('cast-btn');
      btn.innerText = 'CAST';
      btn.className = 'cast-btn';
      btn.disabled = false;
      bobberThrown = false;
      drawWaterSurface();
    }

    function selectRandomFish() {
      const candidates = FISH_DATABASE.filter(f => f.mapId === game.mapId);
      if (candidates.length === 0) { targetFish = FISH_DATABASE[0]; return; }
      const isNight = (game.clock >= 19 || game.clock < 6);
      let filtered = candidates.filter(f => {
        if (f.name === 'リュウグウノツカイ' && !isNight) return Math.random() < 0.2;
        if (f.name === '時空魚' && game.weather !== 'Aurora') return Math.random() < 0.1;
        return true;
      });
      if (filtered.length === 0) filtered = candidates;
      const rarityWeights = { Common:100, Uncommon:50, Rare:20, Epic:8, Legendary:3, Mythic:1, Divine:0.2 };
      const luckLvl = game.skills.luck || 0;
      const rod = RODS[game.rodId];
      const luckMultiplier = 1 + (luckLvl * 0.12) + (rod.rare - 1.0);
      let totalWeight = 0;
      const weights = filtered.map(f => {
        let w = rarityWeights[f.rarity] || 10;
        if (f.rarity !== 'Common' && f.rarity !== 'Uncommon') w *= luckMultiplier;
        if (f.preferBait === game.selectedBait) w *= 2.5;
        totalWeight += w;
        return w;
      });
      let rand = Math.random() * totalWeight;
      for (let i=0; i<filtered.length; i++) {
        rand -= weights[i];
        if (rand <= 0) { targetFish = filtered[i]; return; }
      }
      targetFish = filtered[0];
    }

    // ============================================================
    // キャンバス関連
    // ============================================================
    let waterCtx = null;
    let bobberThrown = false;
    let bobberX = 0, bobberY = 0;
    let ripples = [];

    function initWaterCanvas() {
      const canvas = document.getElementById('water-canvas');
      const stage = document.getElementById('stage');
      canvas.width = stage.clientWidth;
      canvas.height = stage.clientHeight;
      waterCtx = canvas.getContext('2d');
      function animate() { drawWaterSurface(); requestAnimationFrame(animate); }
      animate();
    }

    function drawWaterSurface() {
      if (!waterCtx) return;
      const w = waterCtx.canvas.width, h = waterCtx.canvas.height;
      waterCtx.clearRect(0,0,w,h);
      const map = MAPS[game.mapId];
      const grad = waterCtx.createLinearGradient(0, 0, 0, h);
      grad.addColorStop(0, map.colors[0]);
      grad.addColorStop(1, map.colors[1]);
      waterCtx.fillStyle = grad;
      waterCtx.fillRect(0,0,w,h);
      waterCtx.fillStyle = 'rgba(255,255,255,0.02)';
      for (let i=0;i<3;i++) {
        const offset = Date.now()*0.001*(i+1);
        waterCtx.beginPath();
        waterCtx.moveTo(0, h*0.7);
        for (let x=0;x<=w;x+=25) {
          const y = h*0.65 + Math.sin(x*0.01+offset)*12;
          waterCtx.lineTo(x,y);
        }
        waterCtx.lineTo(w,h); waterCtx.lineTo(0,h); waterCtx.closePath(); waterCtx.fill();
      }
      if (bobberThrown) {
        bobberY = h*0.6 + Math.sin(Date.now()*0.003)*3;
        waterCtx.strokeStyle = 'rgba(255,255,255,0.2)';
        waterCtx.lineWidth = 1;
        waterCtx.beginPath();
        waterCtx.moveTo(w*0.5, h*0.9);
        waterCtx.quadraticCurveTo(w*0.4, h*0.5, bobberX, bobberY);
        waterCtx.stroke();
        waterCtx.fillStyle = '#ff3366';
        waterCtx.beginPath();
        waterCtx.arc(bobberX, bobberY, 6, 0, Math.PI, true);
        waterCtx.closePath(); waterCtx.fill();
        waterCtx.fillStyle = '#ffffff';
        waterCtx.beginPath();
        waterCtx.arc(bobberX, bobberY, 6, 0, Math.PI, false);
        waterCtx.closePath(); waterCtx.fill();
        if (Math.random()<0.05) ripples.push({x:bobberX, y:bobberY, r:2, alpha:0.6});
      }
      waterCtx.lineWidth = 1.2;
      for (let i=ripples.length-1; i>=0; i--) {
        const r = ripples[i];
        r.r += 0.4; r.alpha -= 0.012;
        if (r.alpha <= 0) ripples.splice(i,1);
        else { waterCtx.strokeStyle = `rgba(0,240,255,${r.alpha})`; waterCtx.beginPath(); waterCtx.arc(r.x, r.y, r.r, 0, Math.PI*2); waterCtx.stroke(); }
      }
      drawFishShadows();
    }

    let fishShadows = [];
    function drawFishShadows() {
      const h = waterCtx.canvas.height, w = waterCtx.canvas.width;
      if (fishShadows.length < 3 && Math.random() < 0.02) {
        fishShadows.push({ x: Math.random()<0.5?-30:w+30, y: h*0.55+Math.random()*(h*0.3), speed: (0.3+Math.random()*0.7)*(Math.random()<0.5?1:-1), size: 15+Math.random()*25 });
      }
      waterCtx.fillStyle = 'rgba(0,0,0,0.12)';
      for (let i=fishShadows.length-1; i>=0; i--) {
        const s = fishShadows[i];
        s.x += s.speed;
        if (s.x < -80 || s.x > w+80) fishShadows.splice(i,1);
        else { waterCtx.beginPath(); waterCtx.ellipse(s.x, s.y, s.size, s.size*0.4, 0, 0, Math.PI*2); waterCtx.fill(); }
      }
    }

    function throwBobber(dist) {
      const w = waterCtx.canvas.width, h = waterCtx.canvas.height;
      bobberX = w*0.5 + (Math.random()-0.5)*50;
      bobberY = h*0.6;
      bobberThrown = true;
    }

    let fxCtx = null;
    let particles = [];
    function initFXCanvas() {
      const canvas = document.getElementById('fx-canvas');
      const stage = document.getElementById('stage');
      canvas.width = stage.clientWidth;
      canvas.height = stage.clientHeight;
      fxCtx = canvas.getContext('2d');
      function animate() { drawFX(); requestAnimationFrame(animate); }
      animate();
    }

    function drawFX() {
      if (!fxCtx) return;
      const w = fxCtx.canvas.width, h = fxCtx.canvas.height;
      fxCtx.clearRect(0,0,w,h);
      const type = game.weather;
      if (type==='Rainy'||type==='Stormy'||type==='Typhoon') {
        fxCtx.strokeStyle = 'rgba(174,219,255,0.35)';
        fxCtx.lineWidth = 1;
        const count = type==='Typhoon'?30:15;
        for (let i=0;i<count;i++) {
          const x=Math.random()*w, y=Math.random()*h, len=12+Math.random()*15, angle=type==='Typhoon'?12:4;
          fxCtx.beginPath(); fxCtx.moveTo(x,y); fxCtx.lineTo(x-angle, y+len); fxCtx.stroke();
        }
        if (type==='Stormy' && Math.random()<0.01) { fxCtx.fillStyle='rgba(255,255,255,0.6)'; fxCtx.fillRect(0,0,w,h); }
      }
      if (type==='Aurora') {
        const time=Date.now()*0.001;
        const grad=fxCtx.createLinearGradient(0,0,w,0);
        grad.addColorStop(0, `hsla(${(time*10)%360},100%,50%,0.12)`);
        grad.addColorStop(0.5, `hsla(${(time*10+120)%360},100%,50%,0.2)`);
        grad.addColorStop(1, `hsla(${(time*10+240)%360},100%,50%,0.12)`);
        fxCtx.fillStyle=grad;
        fxCtx.beginPath(); fxCtx.moveTo(0,0);
        for (let x=0;x<=w;x+=50) { const y=h*0.18+Math.sin(x*0.005+time)*20; fxCtx.lineTo(x,y); }
        fxCtx.lineTo(w,0); fxCtx.closePath(); fxCtx.fill();
      }
      if (type==='Meteor') {
        if (Math.random()<0.04) particles.push({ x:Math.random()*w*1.3, y:0, speedX:-6-Math.random()*6, speedY:5+Math.random()*5, len:30+Math.random()*40, alpha:1.0 });
        for (let i=particles.length-1; i>=0; i--) {
          const p=particles[i];
          p.x+=p.speedX; p.y+=p.speedY; p.alpha-=0.025;
          if (p.alpha<=0) particles.splice(i,1);
          else { fxCtx.strokeStyle=`rgba(255,240,150,${p.alpha})`; fxCtx.lineWidth=1.5; fxCtx.beginPath(); fxCtx.moveTo(p.x,p.y); fxCtx.lineTo(p.x+p.len, p.y-p.len*0.7); fxCtx.stroke(); }
        }
      }
    }

    let avatarCtx = null;
    function initAvatarCanvas() {
      const canvas = document.getElementById('avatar-canvas');
      avatarCtx = canvas.getContext('2d');
      drawAvatar();
    }

    function drawAvatar() {
      if (!avatarCtx) return;
      const ctx=avatarCtx, w=ctx.canvas.width, h=ctx.canvas.height;
      ctx.clearRect(0,0,w,h);
      const cx=w/2, cy=h/2+8;
      ctx.fillStyle = '#ffd6a5';
      ctx.beginPath(); ctx.arc(cx, cy-8, 16, 0, Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#333';
      ctx.beginPath(); ctx.arc(cx-5, cy-8, 2, 0, Math.PI*2); ctx.arc(cx+5, cy-8, 2, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle='#333'; ctx.lineWidth=1.2; ctx.beginPath(); ctx.arc(cx, cy-3, 2.5, 0, Math.PI); ctx.stroke();
      if (activeModal === 'modal-craft') requestAnimationFrame(drawAvatar);
    }

    function createSplashParticles() {
      for (let i=0;i<20;i++) ripples.push({ x:bobberX+(Math.random()-0.5)*60, y:bobberY+(Math.random()-0.5)*30, r:2+Math.random()*3, alpha:0.8+Math.random()*0.2 });
    }
    function addVisualSplashEffect(text) {
      const msg = document.getElementById('action-msg');
      msg.innerText = text; msg.className = 'show catch';
      setTimeout(() => { msg.className = ''; }, 2000);
    }
  </script>
</body>
</html>
