<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>マイ・ミニ・カフェ | トップダウン移動×放置経営</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      background: #1a2a1a;
      background-image: radial-gradient(circle at 20% 30%, #2a3a1a, #0a1a0a);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Courier New', 'Pixelify Sans', monospace;
      padding: 20px;
    }

    .game-wrapper {
      background: #2d2418;
      border-radius: 36px;
      padding: 20px;
      box-shadow: 0 20px 35px rgba(0, 0, 0, 0.5);
      border: 3px solid #c8a86e;
    }

    canvas {
      display: block;
      margin: 0 auto;
      border-radius: 16px;
      box-shadow: 0 0 0 4px #6b4c2c, 0 8px 20px black;
      image-rendering: crisp-edges;
      image-rendering: pixelated;
      cursor: pointer;
    }

    .info-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 16px;
      gap: 12px;
      flex-wrap: wrap;
      background: #1f2a1bcc;
      backdrop-filter: blur(6px);
      padding: 8px 16px;
      border-radius: 60px;
      color: #ffe3b0;
    }

    .coin-display {
      background: #00000066;
      padding: 4px 16px;
      border-radius: 40px;
      font-weight: bold;
      font-size: 1.2rem;
    }

    .rate-display {
      font-size: 0.7rem;
    }

    .controls-hint {
      font-size: 0.65rem;
      background: #00000055;
      padding: 4px 12px;
      border-radius: 60px;
    }

    button {
      background: #7c5a3a;
      border: none;
      padding: 5px 14px;
      border-radius: 40px;
      font-family: monospace;
      font-weight: bold;
      color: #f2e0b0;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.96);
    }

    .back-link {
      display: inline-block;
      margin-top: 14px;
      text-align: center;
      width: 100%;
      color: #e9c891;
      font-size: 0.7rem;
      text-decoration: none;
    }

    .interact-panel {
      margin-top: 10px;
      background: #000000aa;
      border-radius: 40px;
      padding: 6px 12px;
      font-size: 0.7rem;
      text-align: center;
      color: #ffecb3;
    }
  </style>
</head>
<body>
<div>
  <div class="game-wrapper">
    <canvas id="cafeCanvas" width="800" height="560"></canvas>
    <div class="info-bar">
      <div class="coin-display">🪙 <span id="coinAmount">0</span></div>
      <div class="rate-display">⚡ 売上/h: <span id="incomeRate">0</span></div>
      <div class="controls-hint">🕹️ WASD / 矢印キーで移動 | 🍽️ 設備に近づいて [E] インタラクト</div>
      <button id="resetGameBtn">🔄 リセット</button>
    </div>
    <div class="interact-panel" id="interactMsg">▶ 近づくと表示されます</div>
    <a href="index.html" class="back-link">← ポートフォリオに戻る</a>
  </div>
</div>

<script>
  (function() {
    // ---------- カフェ経営データ ----------
    let cafeData = {
      coins: 350,
      lastTick: Date.now(),
      // インテリアレベル (0=未購入,1=購入)
      interior: { table: 0, plant: 0, counter: 0 },
      recipes: { coffee: 0, cake: 0, parfait: 0 },
      staff: { barista: 0, waiter: 0 }
    };

    // 基本収入ベース/時
    let baseIncome = 70;

    // 収入計算 (コイン/時)
    function calcHourlyIncome() {
      let income = baseIncome;
      if(cafeData.interior.table) income += 22;
      if(cafeData.interior.plant) income += 18;
      if(cafeData.interior.counter) income += 38;
      if(cafeData.recipes.coffee) income += 28;
      if(cafeData.recipes.cake) income += 55;
      if(cafeData.recipes.parfait) income += 98;
      let mult = 1.0;
      if(cafeData.staff.barista) mult += 0.32;
      if(cafeData.staff.waiter) mult += 0.28;
      return Math.floor(income * mult);
    }

    // ---------- トップダウン マップ (カフェ店内) ----------
    const MAP_W = 25;
    const MAP_H = 17;
    const TILE_SIZE = 32;

    // タイル定義: 0=床, 1=カウンター(通過不可), 2=レジ(通過不可), 3=コーヒーマシン, 4=テーブル(椅子), 5=壁
    let tileMap = Array(MAP_H).fill().map(() => Array(MAP_W).fill(0));
    // 簡易カフェレイアウト
    for(let i=0;i<MAP_H;i++) {
      for(let j=0;j<MAP_W;j++) {
        if(i===0 || i===MAP_H-1 || j===0 || j===MAP_W-1) tileMap[i][j] = 5; // 壁
        else if((i===5 && j>=8 && j<=16) || (i===6 && (j===8 || j===16))) tileMap[i][j] = 1; // カウンター
        else if(i===7 && j===12) tileMap[i][j] = 2; // レジ
        else if(i===8 && (j===10 || j===14)) tileMap[i][j] = 3; // コーヒーマシン
        else if((i===10 && j>=6 && j<=18) || (i===12 && j>=5 && j<=19)) tileMap[i][j] = 4; // テーブル帯
        else tileMap[i][j] = 0;
      }
    }
    // 追加のテーブル席
    for(let t=0;t<4;t++) tileMap[13][7+t*3] = 4;
    
    // 衝突判定: 1(カウンター), 2(レジ), 5(壁) は通れない
    function isSolid(tile) {
      return tile === 1 || tile === 2 || tile === 5;
    }
    
    // プレイヤー (ピクセル座標)
    let player = {
      x: 12 * TILE_SIZE,
      y: 14 * TILE_SIZE,
      dir: 'down',
      animCounter: 0,
      moving: false
    };
    
    // 歩行アニメーション画像 (4枚のJPGを想定)
    let useExternalImages = false;   // trueにするとplayer_0.jpg～player_3.jpgを読み込む
    let playerImgs = [];
    const IMG_NAMES = ['player_0.jpg', 'player_1.jpg', 'player_2.jpg', 'player_3.jpg'];
    
    function loadImages() {
      if(!useExternalImages) return;
      for(let i=0;i<4;i++) {
        let img = new Image();
        img.src = IMG_NAMES[i];
        img.onerror = () => { useExternalImages = false; };
        playerImgs.push(img);
      }
    }
    
    // ドット絵フォールバック (プレイヤー)
    function drawPixelPlayer(x, y, frame) {
      ctx.fillStyle = '#8bc48a';
      ctx.fillRect(x+6, y+6, 20, 22);
      ctx.fillStyle = '#5f8b4a';
      ctx.fillRect(x+12, y+2, 8, 8);
      ctx.fillStyle = '#3a2a1a';
      ctx.fillRect(x+12, y+12, 8, 12);
      ctx.fillStyle = '#fff0c0';
      ctx.fillRect(x+10, y+14, 4, 4);
      ctx.fillRect(x+18, y+14, 4, 4);
      ctx.fillStyle = '#000';
      ctx.fillRect(x+11, y+15, 2, 2);
      ctx.fillRect(x+19, y+15, 2, 2);
      // 帽子
      ctx.fillStyle = '#c0a06a';
      ctx.fillRect(x+10, y, 12, 6);
      // 足のアニメーション
      if(frame % 2 === 0) {
        ctx.fillStyle = '#634a2a';
        ctx.fillRect(x+8, y+26, 6, 4);
        ctx.fillRect(x+18, y+26, 6, 4);
      } else {
        ctx.fillStyle = '#896e48';
        ctx.fillRect(x+6, y+26, 8, 4);
        ctx.fillRect(x+18, y+26, 8, 4);
      }
    }
    
    function drawPlayer() {
      let frameIdx = Math.floor(player.animCounter / 6) % 4;
      if(!player.moving) frameIdx = 0;
      if(useExternalImages && playerImgs[frameIdx] && playerImgs[frameIdx].complete && playerImgs[frameIdx].naturalWidth>0) {
        ctx.drawImage(playerImgs[frameIdx], player.x, player.y, TILE_SIZE, TILE_SIZE);
      } else {
        drawPixelPlayer(player.x, player.y, frameIdx);
      }
    }
    
    // マップ描画 (ドット絵カフェ)
    function drawMap() {
      for(let row=0; row<MAP_H; row++) {
        for(let col=0; col<MAP_W; col++) {
          let tile = tileMap[row][col];
          let x = col*TILE_SIZE;
          let y = row*TILE_SIZE;
          switch(tile) {
            case 0: // 床
              ctx.fillStyle = '#dbbc87';
              ctx.fillRect(x,y,TILE_SIZE,TILE_SIZE);
              ctx.fillStyle = '#c0a16b';
              for(let i=0;i<2;i++) ctx.fillRect(x+8+i*12, y+16, 6, 2);
              break;
            case 1: // カウンター
              ctx.fillStyle = '#9b7a51';
              ctx.fillRect(x,y,TILE_SIZE,TILE_SIZE);
              ctx.fillStyle = '#c8a56a';
              ctx.fillRect(x+4, y+8, 24, 18);
              break;
            case 2: // レジ
              ctx.fillStyle = '#b68b54';
              ctx.fillRect(x,y,TILE_SIZE,TILE_SIZE);
              ctx.fillStyle = '#f5e2b0';
              ctx.fillRect(x+8, y+8, 16, 16);
              break;
            case 3: // コーヒーマシン
              ctx.fillStyle = '#4a5a6e';
              ctx.fillRect(x,y,TILE_SIZE,TILE_SIZE);
              ctx.fillStyle = '#bcc9d0';
              ctx.fillRect(x+6, y+10, 20, 12);
              ctx.fillStyle = '#f0c080';
              ctx.fillRect(x+14, y+4, 4, 8);
              break;
            case 4: // テーブル
              ctx.fillStyle = '#bd9e6b';
              ctx.fillRect(x,y,TILE_SIZE,TILE_SIZE);
              ctx.fillStyle = '#e2bc84';
              ctx.fillRect(x+6, y+20, 20, 6);
              ctx.fillStyle = '#aa7a4a';
              ctx.fillRect(x+8, y+10, 6, 12);
              ctx.fillRect(x+18, y+10, 6, 12);
              break;
            case 5: // 壁
              ctx.fillStyle = '#5e4a32';
              ctx.fillRect(x,y,TILE_SIZE,TILE_SIZE);
              ctx.fillStyle = '#8b6946';
              for(let i=0;i<3;i++) ctx.fillRect(x+4+i*8, y+8, 4, 20);
              break;
            default: break;
          }
          ctx.strokeStyle = '#00000022';
          ctx.strokeRect(x,y,TILE_SIZE,TILE_SIZE);
        }
      }
    }
    
    // インタラクト可能オブジェクト (プレイヤーの近くにある設備)
    let nearbyObject = null;
    function checkNearby() {
      let px = player.x + TILE_SIZE/2;
      let py = player.y + TILE_SIZE/2;
      let tx = Math.floor(px/TILE_SIZE);
      let ty = Math.floor(py/TILE_SIZE);
      let dirs = [[0,0],[1,0],[-1,0],[0,1],[0,-1]];
      for(let [dx,dy] of dirs) {
        let nx = tx+dx, ny = ty+dy;
        if(nx>=0 && ny>=0 && nx<MAP_W && ny<MAP_H) {
          let tile = tileMap[ny][nx];
          if(tile === 2) return { type: 'register', name: 'レジ', action: 'コイン回収 + 収入ブースト' };
          if(tile === 3) return { type: 'coffee', name: 'コーヒーマシン', action: 'レシピ開発 (コーヒー)' };
          if(tile === 4) return { type: 'table', name: 'テーブル', action: 'インテリア購入' };
          if(tile === 1) return { type: 'counter', name: 'カウンター', action: 'スタッフ雇用' };
        }
      }
      return null;
    }
    
    // インタラクト処理
    function interact() {
      let obj = nearbyObject;
      if(!obj) return;
      switch(obj.type) {
        case 'register':
          let gain = Math.floor(calcHourlyIncome() / 12) + 25;
          cafeData.coins += gain;
          addLog(`💰 レジで売上回収！ +${gain}コイン`, '#ffdfa5');
          saveGame(); updateUI();
          break;
        case 'coffee':
          if(!cafeData.recipes.coffee && cafeData.coins >= 150) {
            cafeData.coins -= 150;
            cafeData.recipes.coffee = 1;
            addLog(`☕ コーヒーマシンで「スペシャルコーヒー」を開発！収入UP`, '#aaffaa');
            saveGame(); updateUI();
          } else if(cafeData.recipes.coffee) addLog(`✅ コーヒーはすでに開発済みです`, '#ffaa88');
          else addLog(`💰 コインが足りません (150必要)`, '#ffaa88');
          break;
        case 'table':
          if(!cafeData.interior.table && cafeData.coins >= 180) {
            cafeData.coins -= 180;
            cafeData.interior.table = 1;
            addLog(`🪑 おしゃれなテーブルセットを導入！来店客増加`, '#aaffaa');
            saveGame(); updateUI();
          } else if(cafeData.interior.table) addLog(`✨ すでにテーブルはグレードアップ済み`, '#ffaa88');
          else addLog(`💰 コイン不足 (180必要)`, '#ffaa88');
          break;
        case 'counter':
          if(!cafeData.staff.barista && cafeData.coins >= 420) {
            cafeData.coins -= 420;
            cafeData.staff.barista = 1;
            addLog(`👨‍🍳 ベテランバリスタを雇用！収入+32%`, '#aaffaa');
            saveGame(); updateUI();
          } else if(cafeData.staff.barista) addLog(`🏆 バリスタはすでに働いています`, '#ffaa88');
          else addLog(`💰 コイン不足 (420必要)`, '#ffaa88');
          break;
      }
      saveGame();
      updateUI();
    }
    
    function addLog(msg, color) {
      let div = document.getElementById('interactMsg');
      div.innerHTML = `✨ ${msg}`;
      div.style.color = color || '#ffecb3';
      setTimeout(() => {
        if(nearbyObject) div.innerHTML = `▶ ${nearbyObject.name}に近いです！ [E]で${nearbyObject.action}`;
        else div.innerHTML = `▶ 設備に近づいて [E] を押そう！`;
      }, 2000);
    }
    
    // 移動処理 + アニメーション
    let keys = { ArrowUp:false, ArrowDown:false, ArrowLeft:false, ArrowRight:false, w:false,s:false,a:false,d:false };
    function updateMovement() {
      let dx=0, dy=0;
      if(keys.ArrowUp||keys.w) dy = -1;
      if(keys.ArrowDown||keys.s) dy = 1;
      if(keys.ArrowLeft||keys.a) dx = -1;
      if(keys.ArrowRight||keys.d) dx = 1;
      
      if(dx!==0 || dy!==0) {
        player.moving = true;
        if(dx>0) player.dir='right';
        else if(dx<0) player.dir='left';
        if(dy>0) player.dir='down';
        else if(dy<0) player.dir='up';
        
        let speed = 2.5;
        let newX = player.x + dx*speed;
        let newY = player.y + dy*speed;
        let leftTile = Math.floor(newX/TILE_SIZE);
        let rightTile = Math.floor((newX+TILE_SIZE-4)/TILE_SIZE);
        let topTile = Math.floor(newY/TILE_SIZE);
        let bottomTile = Math.floor((newY+TILE_SIZE-6)/TILE_SIZE);
        let collide = false;
        if(leftTile>=0 && rightTile<MAP_W && topTile>=0 && bottomTile<MAP_H) {
          if(isSolid(tileMap[topTile][leftTile]) || isSolid(tileMap[topTile][rightTile]) ||
             isSolid(tileMap[bottomTile][leftTile]) || isSolid(tileMap[bottomTile][rightTile]))
            collide = true;
        } else collide = true;
        if(!collide) { player.x = newX; player.y = newY; }
        player.animCounter = (player.animCounter+1)%32;
      } else {
        player.moving = false;
        player.animCounter = 0;
      }
      player.x = Math.min(Math.max(player.x, 0), (MAP_W-1)*TILE_SIZE);
      player.y = Math.min(Math.max(player.y, 0), (MAP_H-1)*TILE_SIZE);
      
      // インタラクト可能オブジェクト更新
      nearbyObject = checkNearby();
      let msgDiv = document.getElementById('interactMsg');
      if(nearbyObject) msgDiv.innerHTML = `▶ ${nearbyObject.name}に近い！ [E]で${nearbyObject.action}`;
      else msgDiv.innerHTML = `▶ カフェ内を移動して設備に近づこう [E]`;
    }
    
    // 放置収入 (リアルタイム)
    let lastIncomeTime = Date.now();
    function updateIncomeByRealTime() {
      let now = Date.now();
      let diffSec = (now - lastIncomeTime) / 1000;
      if(diffSec >= 1.0) {
        let hourly = calcHourlyIncome();
        let gain = Math.floor(hourly / 3600 * diffSec);
        if(gain > 0 && cafeData.coins < 999999) {
          cafeData.coins += gain;
          saveGame(); updateUI();
        }
        lastIncomeTime = now;
      }
    }
    
    // オフライン収入
    function applyOffline() {
      let now = Date.now();
      let last = cafeData.lastTick;
      if(last && now > last) {
        let diffHours = (now - last) / 3600000;
        if(diffHours > 0.1) {
          let hourly = calcHourlyIncome();
          let gained = Math.floor(hourly * Math.min(diffHours, 24));
          if(gained > 0) {
            cafeData.coins += gained;
            addLog(`🕒 オフライン収入: ${gained} コイン！`, '#ffdfa5');
          }
        }
      }
      cafeData.lastTick = now;
      saveGame();
    }
    
    // UI更新
    function updateUI() {
      document.getElementById('coinAmount').innerText = Math.floor(cafeData.coins);
      document.getElementById('incomeRate').innerText = calcHourlyIncome();
    }
    
    // セーブ・ロード
    function saveGame() {
      let save = {
        coins: cafeData.coins,
        lastTick: cafeData.lastTick,
        interior: cafeData.interior,
        recipes: cafeData.recipes,
        staff: cafeData.staff,
        playerX: player.x,
        playerY: player.y
      };
      localStorage.setItem('miniCafeTopDown', JSON.stringify(save));
    }
    
    function loadGame() {
      let raw = localStorage.getItem('miniCafeTopDown');
      if(raw) {
        try {
          let data = JSON.parse(raw);
          cafeData.coins = data.coins ?? 350;
          cafeData.lastTick = data.lastTick ?? Date.now();
          cafeData.interior = data.interior || { table:0, plant:0, counter:0 };
          cafeData.recipes = data.recipes || { coffee:0, cake:0, parfait:0 };
          cafeData.staff = data.staff || { barista:0, waiter:0 };
          if(data.playerX && data.playerY) { player.x = data.playerX; player.y = data.playerY; }
        } catch(e) {}
      }
      applyOffline();
      updateUI();
    }
    
    function resetGame() {
      if(confirm("冒険をリセットしますか？ (コイン・アップグレード全初期化)")) {
        cafeData = {
          coins: 350,
          lastTick: Date.now(),
          interior: { table:0, plant:0, counter:0 },
          recipes: { coffee:0, cake:0, parfait:0 },
          staff: { barista:0, waiter:0 }
        };
        player.x = 12 * TILE_SIZE;
        player.y = 14 * TILE_SIZE;
        saveGame();
        updateUI();
        addLog("🏁 カフェをリセットしました！", "#ffffff");
      }
    }
    
    // 描画ループ
    let ctx = document.getElementById('cafeCanvas').getContext('2d');
    function draw() {
      drawMap();
      drawPlayer();
      // 周辺にインタラクトアイコン
      if(nearbyObject) {
        let px = player.x + TILE_SIZE/2;
        let py = player.y - 12;
        ctx.font = "bold 16px monospace";
        ctx.fillStyle = "#ffeca0";
        ctx.shadowBlur = 0;
        ctx.fillText("💬", px-8, py);
      }
      // 簡易UIオーバーレイ
      ctx.font = "bold 10px monospace";
      ctx.fillStyle = "#faf0c0";
      ctx.fillText("⚡ 店内を歩いて設備に近づこう", 16, 28);
    }
    
    function gameLoop() {
      updateMovement();
      updateIncomeByRealTime();
      draw();
      requestAnimationFrame(gameLoop);
    }
    
    // キー・イベント
    function handleKeyDown(e) {
      let k = e.key;
      if(k === 'ArrowUp'||k === 'w') { keys.ArrowUp=true; keys.w=true; e.preventDefault(); }
      if(k === 'ArrowDown'||k === 's') { keys.ArrowDown=true; keys.s=true; e.preventDefault(); }
      if(k === 'ArrowLeft'||k === 'a') { keys.ArrowLeft=true; keys.a=true; e.preventDefault(); }
      if(k === 'ArrowRight'||k === 'd') { keys.ArrowRight=true; keys.d=true; e.preventDefault(); }
      if(k === 'e' || k === 'E') { interact(); e.preventDefault(); }
    }
    function handleKeyUp(e) {
      let k = e.key;
      if(k === 'ArrowUp'||k === 'w') { keys.ArrowUp=false; keys.w=false; }
      if(k === 'ArrowDown'||k === 's') { keys.ArrowDown=false; keys.s=false; }
      if(k === 'ArrowLeft'||k === 'a') { keys.ArrowLeft=false; keys.a=false; }
      if(k === 'ArrowRight'||k === 'd') { keys.ArrowRight=false; keys.d=false; }
    }
    
    // 初期化
    function init() {
      loadImages();
      loadGame();
      setInterval(() => { saveGame(); }, 30000);
      window.addEventListener('keydown', handleKeyDown);
      window.addEventListener('keyup', handleKeyUp);
      document.getElementById('resetGameBtn').addEventListener('click', resetGame);
      gameLoop();
    }
    init();
  })();
</script>
</body>
</html>
