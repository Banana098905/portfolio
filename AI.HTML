<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マイAI</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f11;
      --surface: #1a1a1f;
      --surface2: #222228;
      --border: rgba(255,255,255,0.08);
      --accent: #4f8ef7;
      --accent-dim: rgba(79,142,247,0.15);
      --text: #e8e8ee;
      --text-muted: #888896;
      --user-bg: #1a2540;
      --user-border: rgba(79,142,247,0.3);
    }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--surface);
      flex-shrink: 0;
    }

    .avatar {
      width: 34px; height: 34px; border-radius: 50%;
      background: var(--accent-dim);
      border: 1px solid rgba(79,142,247,0.4);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
    }

    header h1 { font-size: 15px; font-weight: 500; }
    header p  { font-size: 11px; color: var(--text-muted); }

    .status {
      margin-left: auto;
      display: flex; align-items: center; gap: 5px;
      font-size: 11px; color: var(--text-muted);
    }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #4ade80; }

    #chat {
      flex: 1; overflow-y: auto;
      padding: 20px;
      display: flex; flex-direction: column; gap: 16px;
      scroll-behavior: smooth;
    }
    #chat::-webkit-scrollbar { width: 4px; }
    #chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .message {
      display: flex; gap: 10px; align-items: flex-start;
      animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .message.user { flex-direction: row-reverse; }

    .msg-avatar {
      width: 28px; height: 28px; border-radius: 50%;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; margin-top: 2px;
    }
    .ai   .msg-avatar { background: var(--accent-dim); border: 1px solid rgba(79,142,247,0.3); }
    .user .msg-avatar { background: var(--surface2);   border: 1px solid var(--border); }

    .bubble {
      max-width: 78%;
      padding: 10px 14px;
      font-size: 14px; line-height: 1.7;
      white-space: pre-wrap; word-break: break-word;
    }
    .ai   .bubble { background: var(--surface); border: 1px solid var(--border); border-radius: 4px 14px 14px 14px; }
    .user .bubble { background: var(--user-bg); border: 1px solid var(--user-border); color: #a8c4f5; border-radius: 14px 4px 14px 14px; }

    .typing { display: flex; gap: 5px; align-items: center; padding: 12px 14px; }
    .typing span {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent);
      animation: bounce 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%,60%,100% { transform: translateY(0); opacity: 0.4; }
      30%          { transform: translateY(-5px); opacity: 1; }
    }

    #input-area {
      padding: 14px 16px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex; gap: 8px; align-items: flex-end;
      flex-shrink: 0;
    }

    textarea {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 14px; color: var(--text);
      resize: none; outline: none;
      line-height: 1.5; max-height: 120px;
      transition: border-color 0.2s;
    }
    textarea:focus { border-color: rgba(79,142,247,0.5); }
    textarea::placeholder { color: var(--text-muted); }

    button {
      width: 42px; height: 42px;
      border-radius: 10px;
      background: var(--accent);
      border: none; color: white;
      font-size: 18px; cursor: pointer; flex-shrink: 0;
      transition: opacity 0.15s, transform 0.1s;
      display: flex; align-items: center; justify-content: center;
    }
    button:hover  { opacity: 0.85; }
    button:active { transform: scale(0.95); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    #setup-banner {
      background: rgba(250,180,60,0.1);
      border: 1px solid rgba(250,180,60,0.3);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 13px; color: #f5c842;
      margin: 12px 20px 0; line-height: 1.6;
    }
    #setup-banner.hidden { display: none; }
  </style>
</head>
<body>

<header>
  <div class="avatar">🤖</div>
  <div>
    <h1>マイAI</h1>
    <p>Gemini 2.0 Flash 搭載（無料）</p>
  </div>
  <div class="status">
    <span class="status-dot"></span>
    オンライン
  </div>
</header>

<div id="setup-banner">
  ⚙️ <strong>初回設定が必要です。</strong>
  <code>config.js</code> の <code>WORKER_URL</code> を Cloudflare Worker の URL に書き換えてください。詳しくは README.md を参照。
</div>

<div id="chat">
  <div class="message ai">
    <div class="msg-avatar">🤖</div>
    <div class="bubble">こんにちは！なんでも気軽に話しかけてください。Roblox開発のことでも、なんでも大丈夫ですよ😊</div>
  </div>
</div>

<div id="input-area">
  <textarea id="input" rows="1" placeholder="メッセージを入力... (Enterで送信)"></textarea>
  <button id="send-btn" onclick="sendMessage()">➤</button>
</div>

<script src="config.js"></script>
<script>
  const chat   = document.getElementById('chat');
  const input  = document.getElementById('input');
  const btn    = document.getElementById('send-btn');
  const banner = document.getElementById('setup-banner');

  if (typeof WORKER_URL !== 'undefined' && WORKER_URL !== 'YOUR_WORKER_URL_HERE') {
    banner.classList.add('hidden');
  }

  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function addMessage(role, text) {
    const div = document.createElement('div');
    div.className = 'message ' + role;
    div.innerHTML = `
      <div class="msg-avatar">${role === 'ai' ? '🤖' : '🧑'}</div>
      <div class="bubble">${escHtml(text)}</div>
    `;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function showTyping() {
    const div = document.createElement('div');
    div.className = 'message ai'; div.id = 'typing';
    div.innerHTML = `<div class="msg-avatar">🤖</div><div class="bubble typing"><span></span><span></span><span></span></div>`;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function removeTyping() { document.getElementById('typing')?.remove(); }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    input.value = ''; input.style.height = 'auto';
    input.disabled = true; btn.disabled = true;

    addMessage('user', text);
    showTyping();

    try {
      const res  = await fetch(WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text })
      });
      const data = await res.json();
      removeTyping();
      addMessage('ai', data.reply || 'エラーが発生しました。');
    } catch (e) {
      removeTyping();
      addMessage('ai', '❌ 接続エラー。WorkerのURLを確認してください。');
    }

    input.disabled = false; btn.disabled = false; input.focus();
  }
</script>

</body>
</html>
