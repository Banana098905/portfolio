<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マイAI</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f11;
      --surface: #1a1a1f;
      --surface2: #222228;
      --border: rgba(255,255,255,0.08);
      --accent: #f97316;
      --accent-dim: rgba(249,115,22,0.15);
      --text: #e8e8ee;
      --text-muted: #888896;
      --user-bg: #271a0f;
      --user-border: rgba(249,115,22,0.3);
    }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 10px;
      background: var(--surface);
      flex-shrink: 0;
    }

    .avatar {
      width: 34px; height: 34px; border-radius: 50%;
      background: var(--accent-dim);
      border: 1px solid rgba(249,115,22,0.4);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
    }

    header h1 { font-size: 15px; font-weight: 500; }
    header p  { font-size: 11px; color: var(--text-muted); }

    .status {
      margin-left: auto;
      display: flex; align-items: center; gap: 5px;
      font-size: 11px; color: var(--text-muted);
    }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #4ade80; }

    #app {
      flex: 1; min-height: 0;
      display: flex; flex-direction: row;
      overflow: hidden;
    }

    #main-col {
      flex: 1; min-width: 0;
      display: flex; flex-direction: column;
      overflow: hidden;
    }

    #chat {
      flex: 1; overflow-y: auto;
      padding: 20px;
      display: flex; flex-direction: column; gap: 16px;
      scroll-behavior: smooth;
    }
    #chat::-webkit-scrollbar { width: 4px; }
    #chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    #artifact-panel {
      width: 0; flex-shrink: 0;
      overflow: hidden;
      border-left: 1px solid var(--border);
      background: var(--surface);
      display: flex; flex-direction: column;
      transition: width 0.22s ease;
    }
    #artifact-panel.open { width: 46%; }

    .artifact-header {
      display: flex; align-items: center; gap: 8px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .artifact-header .artifact-title {
      font-size: 13px; font-weight: 500;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .artifact-header-actions { margin-left: auto; display: flex; gap: 6px; }
    .artifact-header-actions button {
      width: 30px; height: 30px; border-radius: 8px;
      font-size: 13px; background: var(--surface2); color: var(--text);
      border: 1px solid var(--border);
    }
    .artifact-header-actions button:hover { opacity: 1; background: var(--accent-dim); }

    .artifact-body {
      flex: 1; overflow: auto;
      margin: 0; padding: 16px;
      font-family: 'SFMono-Regular', Consolas, monospace;
      font-size: 12.5px; line-height: 1.6;
      white-space: pre-wrap; word-break: break-word;
      color: var(--text);
    }

    @media (max-width: 720px) {
      #artifact-panel.open { position: fixed; inset: 0; width: 100%; z-index: 10; }
    }

    .message {
      display: flex; gap: 10px; align-items: flex-start;
      animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .message.user { flex-direction: row-reverse; }

    .msg-avatar {
      width: 28px; height: 28px; border-radius: 50%;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; margin-top: 2px;
    }
    .ai   .msg-avatar { background: var(--accent-dim); border: 1px solid rgba(249,115,22,0.3); }
    .user .msg-avatar { background: var(--surface2);   border: 1px solid var(--border); }

    .bubble-wrap {
      display: flex; flex-direction: column; gap: 6px;
      max-width: 78%;
    }
    .ai   .bubble-wrap { align-items: flex-start; }
    .user .bubble-wrap { align-items: flex-end; }

    .bubble {
      padding: 10px 14px;
      font-size: 14px; line-height: 1.7;
      white-space: pre-wrap; word-break: break-word;
    }
    .ai   .bubble { background: var(--surface); border: 1px solid var(--border); border-radius: 4px 14px 14px 14px; }
    .user .bubble { background: var(--user-bg); border: 1px solid var(--user-border); color: #f5c4a0; border-radius: 14px 4px 14px 14px; }

    .bubble code {
      background: var(--surface2);
      padding: 1px 5px; border-radius: 4px;
      font-family: 'SFMono-Regular', Consolas, monospace;
      font-size: 0.9em;
    }
    .bubble a { color: var(--accent); text-decoration: underline; }
    .bubble ul, .bubble ol { margin: 4px 0 4px 20px; }
    .bubble li { margin-bottom: 2px; }

    .msg-actions { display: flex; gap: 6px; }
    .msg-actions button {
      width: auto; height: auto;
      padding: 4px 10px;
      font-size: 11px; border-radius: 7px;
      background: var(--surface2); border: 1px solid var(--border);
      color: var(--text-muted); font-family: inherit;
    }
    .msg-actions button:hover {
      color: var(--text); border-color: rgba(249,115,22,0.4); background: var(--accent-dim);
    }

    .typing { display: flex; gap: 5px; align-items: center; padding: 12px 14px; }
    .typing span {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent);
      animation: bounce 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%,60%,100% { transform: translateY(0); opacity: 0.4; }
      30%          { transform: translateY(-5px); opacity: 1; }
    }

    #input-area {
      padding: 14px 16px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex; gap: 8px; align-items: flex-end;
      flex-shrink: 0;
    }

    textarea {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 14px; color: var(--text);
      resize: none; outline: none;
      line-height: 1.5; max-height: 120px;
      transition: border-color 0.2s;
    }
    textarea:focus { border-color: rgba(249,115,22,0.5); }
    textarea::placeholder { color: var(--text-muted); }

    button {
      width: 42px; height: 42px;
      border-radius: 10px;
      background: var(--accent);
      border: none; color: white;
      font-size: 18px; cursor: pointer; flex-shrink: 0;
      transition: opacity 0.15s, transform 0.1s;
      display: flex; align-items: center; justify-content: center;
    }
    button:hover  { opacity: 0.85; }
    button:active { transform: scale(0.95); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    #setup-banner {
      background: rgba(250,180,60,0.1);
      border: 1px solid rgba(250,180,60,0.3);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 13px; color: #f5c842;
      margin: 12px 20px 0; line-height: 1.6;
    }
    #setup-banner.hidden { display: none; }
  </style>
</head>
<body>

<header>
  <div class="avatar">⚡</div>
  <div>
    <h1>マイAI</h1>
    <p>Llama 3.3 搭載（Groq・無料）</p>
  </div>
  <div class="status">
    <span class="status-dot"></span>
    オンライン
  </div>
</header>

<div id="setup-banner">
  ⚙️ <strong>初回設定が必要です。</strong>
  Cloudflare WorkerをDeployしたあと、<code>config.js</code> の <code>WORKER_URL</code> を書き換えてGitHubにPushしてください。
</div>

<div id="app">
  <div id="main-col">
    <div id="chat"></div>

    <div id="input-area">
      <textarea id="input" rows="1" placeholder="メッセージを入力... (Enterで送信)"></textarea>
      <button id="send-btn" onclick="sendMessage()">➤</button>
    </div>
  </div>

  <div id="artifact-panel">
    <div class="artifact-header">
      <span class="artifact-title" id="artifact-title">資料</span>
      <div class="artifact-header-actions">
        <button id="artifact-copy-btn" title="コピー" onclick="copyArtifact()">📋</button>
        <button id="artifact-download-btn" title="ダウンロード" onclick="downloadArtifact()">⬇️</button>
        <button title="閉じる" onclick="closeArtifact()">✕</button>
      </div>
    </div>
    <pre class="artifact-body" id="artifact-body"></pre>
  </div>
</div>

<script src="config.js"></script>
<script>
  const chat   = document.getElementById('chat');
  const input  = document.getElementById('input');
  const btn    = document.getElementById('send-btn');
  const banner = document.getElementById('setup-banner');

  if (typeof WORKER_URL !== 'undefined' && WORKER_URL !== 'YOUR_WORKER_URL_HERE') {
    banner.classList.add('hidden');
  }

  // このAIはコード(このページ)だけで動いていて、会話は一切保存されません。
  // ページを開くたびに、今日の日付を入れた挨拶をその場で生成するだけです。
  // （リロードすれば会話は消えます＝毎回まっさらな状態です）
  function todaysGreeting() {
    const now = new Date();
    const weekday = ['日','月','火','水','木','金','土'][now.getDay()];
    const dateStr = `${now.getMonth() + 1}月${now.getDate()}日(${weekday})`;
    return `こんにちは、${dateStr}です。`;
  }

  addMessage('ai', todaysGreeting());

  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ===== 簡易Markdown表示 =====
  // 太字・斜体・インラインコード・リンク・見出し・箇条書きだけ対応した最低限のレンダラー。
  // 先にescHtmlしてからタグを差し込むので、任意のHTMLが混ざる心配はない。
  function renderLists(html) {
    html = html.replace(/(^|\n)((?:[-・] .*(?:\n|$))+)/g, (m, pre, block) => {
      const items = block.trim().split('\n').map(l => `<li>${l.replace(/^[-・]\s+/, '')}</li>`).join('');
      return `${pre}<ul>${items}</ul>`;
    });
    html = html.replace(/(^|\n)((?:\d+\. .*(?:\n|$))+)/g, (m, pre, block) => {
      const items = block.trim().split('\n').map(l => `<li>${l.replace(/^\d+\.\s+/, '')}</li>`).join('');
      return `${pre}<ol>${items}</ol>`;
    });
    return html;
  }

  function renderMarkdown(raw) {
    let text = escHtml(raw);
    text = text.replace(/`([^`\n]+)`/g, '<code>$1</code>');
    text = text.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
    text = text.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
    text = text.replace(/(^|[^_])_([^_\n]+)_(?!_)/g, '$1<em>$2</em>');
    text = text.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    text = text.replace(/^### (.*)$/gm, '<strong>$1</strong>');
    text = text.replace(/^## (.*)$/gm, '<strong>$1</strong>');
    text = text.replace(/^# (.*)$/gm, '<strong>$1</strong>');
    text = renderLists(text);
    return text;
  }

  // ===== 右パネル（コード・資料の表示） =====
  const artifactPanel = document.getElementById('artifact-panel');
  const artifactTitle  = document.getElementById('artifact-title');
  const artifactBody   = document.getElementById('artifact-body');
  let currentArtifact = { lang: '', code: '' };

  const LANG_LABELS = {
    js: 'JavaScript', javascript: 'JavaScript', ts: 'TypeScript',
    py: 'Python', python: 'Python', html: 'HTML', css: 'CSS',
    json: 'JSON', md: '資料', markdown: '資料', sh: 'シェル', bash: 'シェル',
    java: 'Java', c: 'C', cpp: 'C++', '': 'コード'
  };
  const EXT_MAP = {
    js: 'js', javascript: 'js', ts: 'ts', py: 'py', python: 'py',
    html: 'html', css: 'css', json: 'json', md: 'md', markdown: 'md',
    sh: 'sh', bash: 'sh', java: 'java', c: 'c', cpp: 'cpp', '': 'txt'
  };

  // AIの返信からコードブロック（```lang ... ```）を1つ抜き出す。
  // 会話文とコード/資料本体を分けて、本体は右パネルに表示するため。
  function extractArtifact(text) {
    const m = text.match(/```(\w*)\n([\s\S]*?)```/);
    if (!m) return null;
    const lang = (m[1] || '').toLowerCase();
    const code = m[2].replace(/\n$/, '');
    const before = text.slice(0, m.index).trim();
    const after = text.slice(m.index + m[0].length).trim();
    const chatText = [before, after].filter(Boolean).join('\n\n') || '📄 右側に作成しました。';
    return { chatText, lang, code };
  }

  function openArtifact(lang, code) {
    currentArtifact = { lang, code };
    artifactTitle.textContent = LANG_LABELS[lang] || lang || 'コード';
    artifactBody.textContent = code;
    artifactPanel.classList.add('open');
  }

  function closeArtifact() {
    artifactPanel.classList.remove('open');
  }

  function copyArtifact() {
    navigator.clipboard?.writeText(currentArtifact.code).catch(() => {});
  }

  function downloadArtifact() {
    const ext = EXT_MAP[currentArtifact.lang] || 'txt';
    const blob = new Blob([currentArtifact.code], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `artifact.${ext}`;
    a.click();
    URL.revokeObjectURL(url);
  }

  // 挨拶やユーザーの発言など、アクションボタンが不要なメッセージ用
  function addMessage(role, text) {
    const div = document.createElement('div');
    div.className = 'message ' + role;
    const bodyHtml = role === 'ai' ? renderMarkdown(text) : escHtml(text);
    div.innerHTML = `
      <div class="msg-avatar">${role === 'ai' ? '⚡' : '🧑'}</div>
      <div class="bubble-wrap"><div class="bubble">${bodyHtml}</div></div>
    `;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  function showTyping() {
    const div = document.createElement('div');
    div.className = 'message ai'; div.id = 'typing';
    div.innerHTML = `<div class="msg-avatar">⚡</div><div class="bubble typing"><span></span><span></span><span></span></div>`;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function removeTyping() { document.getElementById('typing')?.remove(); }

  // ===== AIの返信バブル（コピー・再生成ボタン付き） =====
  // 直近のAI返信にだけボタンを出す。新しい返信が来たら、前の返信のボタンだけ消す。
  let lastAiActionsEl = null;
  function stripPreviousAiActions() {
    if (lastAiActionsEl) { lastAiActionsEl.remove(); lastAiActionsEl = null; }
  }

  function createStreamingBubble() {
    const div = document.createElement('div');
    div.className = 'message ai';
    div.innerHTML = `<div class="msg-avatar">⚡</div><div class="bubble-wrap"><div class="bubble"></div></div>`;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  function updateStreamingBubble(div, text) {
    div.querySelector('.bubble').textContent = text;
    chat.scrollTop = chat.scrollHeight;
  }

  function finalizeAiBubble(div, fullText) {
    const bubble = div.querySelector('.bubble');
    const wrap = div.querySelector('.bubble-wrap');
    const artifact = extractArtifact(fullText);
    let rawForCopy = fullText;

    if (artifact) {
      rawForCopy = artifact.chatText;
      bubble.innerHTML = renderMarkdown(artifact.chatText);
      openArtifact(artifact.lang, artifact.code);
    } else {
      bubble.innerHTML = renderMarkdown(fullText);
    }

    stripPreviousAiActions();
    const actions = document.createElement('div');
    actions.className = 'msg-actions';
    actions.innerHTML = `<button class="copy-btn">📋 コピー</button><button class="regen-btn">🔁 再生成</button>`;
    wrap.appendChild(actions);
    actions.querySelector('.copy-btn').onclick = () => {
      navigator.clipboard?.writeText(rawForCopy).catch(() => {});
    };
    actions.querySelector('.regen-btn').onclick = () => regenerateLast();
    lastAiActionsEl = actions;

    chat.scrollTop = chat.scrollHeight;
  }

  function showErrorBubble(msg) {
    const div = document.createElement('div');
    div.className = 'message ai';
    div.innerHTML = `
      <div class="msg-avatar">⚡</div>
      <div class="bubble-wrap">
        <div class="bubble">❌ ${escHtml(msg || '接続エラーが発生しました。WorkerのURLを確認してください。')}</div>
        <div class="msg-actions"><button class="retry-btn">🔄 再送信</button></div>
      </div>
    `;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    div.querySelector('.retry-btn').onclick = () => {
      div.remove();
      input.disabled = true; btn.disabled = true;
      requestAssistantReply().finally(() => { input.disabled = false; btn.disabled = false; input.focus(); });
    };
  }

  // 会話履歴はメモリ上だけに置く（どこにも保存しない＝リロードで消える）。
  // 直近のやり取りだけ持たせて、長くなりすぎないようにする。
  const MAX_HISTORY = 20; // 直近20発言（10往復）まで
  let history = [];
  function trimHistory() {
    if (history.length > MAX_HISTORY) history = history.slice(-MAX_HISTORY);
  }

  // Workerに問い合わせて返信を受け取る。ストリーミング(SSE)なら少しずつ表示し、
  // まだ古いWorkerでJSON一括応答が返ってきた場合もそのまま表示できるようにしてある。
  async function requestAssistantReply() {
    showTyping();

    let res;
    try {
      res = await fetch(WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history })
      });
    } catch (e) {
      removeTyping();
      showErrorBubble('接続エラーが発生しました。WorkerのURLを確認してください。');
      return;
    }

    const ct = res.headers.get('content-type') || '';

    if (!res.ok || ct.includes('application/json')) {
      removeTyping();
      let reply = null;
      try { const data = await res.json(); reply = data.reply || null; } catch (e) {}

      if (!res.ok) {
        showErrorBubble(reply || 'エラーが発生しました。');
        return;
      }

      const div = createStreamingBubble();
      finalizeAiBubble(div, reply || 'エラーが発生しました。');
      history.push({ role: 'assistant', content: reply || 'エラーが発生しました。' });
      trimHistory();
      return;
    }

    // ===== ストリーミング表示 =====
    removeTyping();
    const div = createStreamingBubble();
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '', fullText = '';

    try {
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop();
        for (const line of lines) {
          const trimmed = line.trim();
          if (!trimmed.startsWith('data:')) continue;
          const dataStr = trimmed.slice(5).trim();
          if (dataStr === '[DONE]' || !dataStr) continue;
          try {
            const json = JSON.parse(dataStr);
            const delta = json.choices?.[0]?.delta?.content;
            if (delta) {
              fullText += delta;
              updateStreamingBubble(div, fullText);
            }
          } catch (e) { /* 分割された不完全な行は無視 */ }
        }
      }
    } catch (e) {
      // ストリーミング中に切断された場合も、途中まで受け取った分は表示する
    }

    if (!fullText) fullText = 'うまく答えられませんでした。もう一度試してください。';
    finalizeAiBubble(div, fullText);
    history.push({ role: 'assistant', content: fullText });
    trimHistory();
  }

  function regenerateLast() {
    if (history.length && history[history.length - 1].role === 'assistant') {
      history.pop();
      const aiMessages = chat.querySelectorAll('.message.ai');
      const last = aiMessages[aiMessages.length - 1];
      if (last) last.remove();
      lastAiActionsEl = null;
    }
    input.disabled = true; btn.disabled = true;
    requestAssistantReply().finally(() => { input.disabled = false; btn.disabled = false; input.focus(); });
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    input.value = ''; input.style.height = 'auto';
    input.disabled = true; btn.disabled = true;

    addMessage('user', text);
    history.push({ role: 'user', content: text });
    trimHistory();

    await requestAssistantReply();

    input.disabled = false; btn.disabled = false; input.focus();
  }
</script>

</body>
</html>
