<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>深淵の戦術 - エフェクト強化版RPG</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      background: radial-gradient(circle at 20% 30%, #0a0c18, #03050c);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Courier New', 'Noto Sans JP', monospace;
      padding: 20px;
    }

    .rpg-container {
      background: rgba(10, 12, 24, 0.85);
      backdrop-filter: blur(8px);
      border-radius: 36px;
      padding: 20px;
      border: 1px solid rgba(200, 169, 110, 0.5);
      max-width: 1000px;
      width: 100%;
      transition: transform 0.05s linear;
    }

    .shake {
      animation: shakeEffect 0.08s ease-in-out 0s 2;
    }

    @keyframes shakeEffect {
      0% { transform: translate(1px, 1px); }
      25% { transform: translate(-1px, -1px); }
      50% { transform: translate(-1px, 1px); }
      75% { transform: translate(1px, -1px); }
      100% { transform: translate(0,0); }
    }

    h1 {
      font-size: 1.5rem;
      letter-spacing: 0.2em;
      text-align: center;
      background: linear-gradient(135deg, #e6d5a8, #c8a96e);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 12px;
    }

    .battle-visual {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0b0e1acc;
      border-radius: 32px;
      padding: 16px 24px;
      margin-bottom: 20px;
      gap: 20px;
      flex-wrap: wrap;
      position: relative;
    }

    .sprite-area {
      text-align: center;
      min-width: 120px;
      position: relative;
    }

    .sprite-label {
      font-size: 0.7rem;
      color: #c8a96e;
      margin-top: 6px;
    }

    canvas.pixel-sprite {
      image-rendering: crisp-edges;
      image-rendering: pixelated;
      background: #00000044;
      border-radius: 16px;
      box-shadow: 0 0 0 2px #c8a96e44;
    }

    .vs {
      font-size: 1.5rem;
      color: #aa8866;
      text-shadow: 0 0 3px black;
    }

    /* オーバーレイエフェクト用 */
    .effect-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    .status-area {
      background: #0f1222cc;
      border-radius: 24px;
      padding: 10px 16px;
      margin-bottom: 16px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 8px;
    }

    .stat-card {
      background: #00000066;
      padding: 4px 12px;
      border-radius: 40px;
      font-size: 0.7rem;
    }

    .stat-card span {
      color: #c8a96e;
      font-weight: bold;
      margin-right: 4px;
    }

    .equipment-panel {
      background: #0b0e1a;
      border-radius: 20px;
      padding: 10px 15px;
      margin-bottom: 14px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      font-size: 0.7rem;
      border: 1px solid #c8a96e44;
    }

    .eq-slot strong { color: #e0bc7c; }
    .gold-area { background: #2c2416; padding: 4px 16px; border-radius: 60px; color: #ffd966; font-weight: bold; font-size: 0.8rem;}

    .enemy-card {
      background: #2a1e22aa;
      border-radius: 24px;
      padding: 12px;
      margin-bottom: 14px;
      text-align: center;
    }
    .enemy-name { font-size: 1.2rem; color: #ffaa88; }
    .enemy-hp-bar { background: #331111; border-radius: 20px; height: 12px; width: 100%; margin: 8px 0; }
    .enemy-hp-fill { background: #d44; width: 100%; height: 12px; border-radius: 20px; transition: width 0.1s; }

    .commands {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin: 16px 0 12px;
    }
    .rpg-btn {
      background: #1a1a2e;
      border: 1px solid #c8a96e;
      color: #f0e6c5;
      padding: 6px 16px;
      border-radius: 60px;
      font-family: monospace;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.1s;
      font-size: 0.75rem;
    }
    .rpg-btn:active { transform: scale(0.96); background: #c8a96e; color: #111; }

    .log-area {
      background: #03040cee;
      border-radius: 20px;
      padding: 10px;
      height: 100px;
      overflow-y: auto;
      font-size: 0.7rem;
      color: #bbaa88;
      margin-top: 16px;
    }

    .shop-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      visibility: hidden;
      opacity: 0;
      transition: 0.2s;
    }
    .shop-overlay.show { visibility: visible; opacity: 1; }
    .shop-panel {
      background: #0f1226;
      border: 2px solid #c8a96e;
      border-radius: 48px;
      width: 90%;
      max-width: 650px;
      padding: 20px;
    }
    .shop-panel h2 { text-align: center; color: #c8a96e; margin-bottom: 16px; }
    .shop-items { max-height: 360px; overflow-y: auto; margin: 16px 0; gap: 12px; display: flex; flex-direction: column; }
    .shop-item { background: #1e1f32; border-radius: 24px; padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
    .shop-btn { background: #2a3a2a; border: none; padding: 5px 18px; border-radius: 40px; cursor: pointer; }
    .close-shop { background: #5a3a2a; width: 100%; padding: 8px; border-radius: 60px; margin-top: 16px; cursor: pointer; }
    .back-link { display: block; margin-top: 18px; color: #c8a96e; font-size: 0.65rem; text-align: center; text-decoration: none; }

    /* ダメージポップアップ */
    .damage-pop {
      position: absolute;
      font-weight: bold;
      font-size: 1.3rem;
      text-shadow: 0 0 3px black;
      pointer-events: none;
      z-index: 200;
      animation: floatUp 0.6s ease-out forwards;
      white-space: nowrap;
    }
    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0px) scale(1);}
      100% { opacity: 0; transform: translateY(-40px) scale(1.2);}
    }
  </style>
</head>
<body>
<div class="rpg-container" id="gameContainer">
  <h1>⚔️ 深淵の戦術 ⚔️</h1>

  <div class="battle-visual" id="battleVisual">
    <div class="sprite-area" id="playerArea">
      <canvas id="playerCanvas" width="96" height="96" class="pixel-sprite" style="width:96px;height:96px"></canvas>
      <div class="sprite-label">⚔️ 勇者</div>
    </div>
    <div class="vs">VS</div>
    <div class="sprite-area" id="enemyArea">
      <canvas id="enemyCanvas" width="96" height="96" class="pixel-sprite" style="width:96px;height:96px"></canvas>
      <div class="sprite-label" id="enemySpriteLabel">🐉 敵</div>
    </div>
    <canvas id="effectCanvas" class="effect-canvas" style="position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none;"></canvas>
  </div>

  <div class="status-area">
    <div class="stat-card"><span>🗡️</span> 勇者</div>
    <div class="stat-card"><span>❤️ HP</span> <span id="hpStat">0</span>/<span id="maxHpStat">0</span></div>
    <div class="stat-card"><span>✨ MP</span> <span id="mpStat">0</span>/<span id="maxMpStat">0</span></div>
    <div class="stat-card"><span>⭐ Lv</span> <span id="levelStat">1</span></div>
    <div class="stat-card"><span>📀 EXP</span> <span id="expStat">0</span>/<span id="nextExp">100</span></div>
    <div class="gold-area">💰 <span id="goldAmount">250</span> G</div>
  </div>

  <div class="equipment-panel">
    <div class="eq-slot"><strong>⚔️ 武器</strong> <span id="weaponName">銅の剣</span> <span style="color:#aaa">(+<span id="weaponBonus">5</span>)</span></div>
    <div class="eq-slot"><strong>🛡️ 防具</strong> <span id="armorName">革の鎧</span> <span style="color:#aaa">(+<span id="armorBonus">4</span>)</span></div>
    <div class="eq-slot"><strong>⚡ 攻撃力</strong> <span id="totalAtk">0</span></div>
    <div class="eq-slot"><strong>🛡️ 防御</strong> <span id="totalDef">0</span></div>
  </div>

  <div class="enemy-card">
    <div class="enemy-name" id="enemyName">ゴブリン</div>
    <div class="enemy-hp-bar"><div class="enemy-hp-fill" id="enemyHpFill" style="width:100%"></div></div>
    <div><span id="enemyHpText">??</span> / <span id="enemyMaxHp">??</span></div>
  </div>

  <div class="commands">
    <button class="rpg-btn" id="attackBtn">⚔️ 斬撃</button>
    <button class="rpg-btn" id="fireBtn">🔥 ファイア</button>
    <button class="rpg-btn" id="iceBtn">❄️ ブリザド</button>
    <button class="rpg-btn" id="healBtn">💚 ヒール</button>
    <button class="rpg-btn" id="defendBtn">🛡️ 防御態勢</button>
    <button class="rpg-btn" id="shopBtn">🏪 武器屋</button>
    <button class="rpg-btn" id="resetBtn">🌀 リセット</button>
  </div>

  <div class="log-area" id="battleLog"></div>
  <a href="index.html" class="back-link">← ポートフォリオに戻る</a>
</div>

<div id="shopOverlay" class="shop-overlay"><div class="shop-panel"><h2>⚜️ 流浪の武器庫 ⚜️</h2><div style="display:flex; justify-content:space-between;"><span>所持金: <strong id="shopGold">0</strong> G</span><span>武器:<span id="shopCurWeapon">-</span> 防具:<span id="shopCurArmor">-</span></span></div><div class="shop-items" id="shopItemsList"></div><button class="close-shop" id="closeShopBtn">🔙 戻る</button></div></div>

<script>
  // ========== エフェクト＆サウンド生成 ==========
  const container = document.getElementById('gameContainer');
  const effectCanvas = document.getElementById('effectCanvas');
  const effCtx = effectCanvas.getContext('2d');
  let effectAnim = null;
  
  function resizeEffectCanvas() {
    const rect = document.getElementById('battleVisual').getBoundingClientRect();
    effectCanvas.width = rect.width;
    effectCanvas.height = rect.height;
    effectCanvas.style.width = rect.width + 'px';
    effectCanvas.style.height = rect.height + 'px';
  }
  window.addEventListener('resize', () => setTimeout(resizeEffectCanvas, 50));
  
  function playShake() { container.classList.add('shake'); setTimeout(() => container.classList.remove('shake'), 150); }
  
  // 簡易効果音 (Web Audio)
  let audioCtx = null;
  function playBeep(type) {
    try {
      if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.type = 'sine';
      let freq = type === 'slash' ? 880 : type === 'fire' ? 620 : type === 'heal' ? 540 : 720;
      osc.frequency.value = freq;
      gain.gain.value = 0.15;
      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.3);
      osc.stop(audioCtx.currentTime + 0.25);
    } catch(e) { /* 自動再生ポリシー対策 */ }
  }
  
  // エフェクト描画 (斬撃、魔法)
  function drawSlashEffect(fromX, fromY, toX, toY) {
    if(!effCtx) return;
    effCtx.clearRect(0,0,effectCanvas.width,effectCanvas.height);
    effCtx.beginPath();
    effCtx.moveTo(fromX, fromY);
    effCtx.lineTo(toX, toY);
    effCtx.lineWidth = 6;
    effCtx.strokeStyle = '#fff8e7';
    effCtx.shadowBlur = 10;
    effCtx.stroke();
    for(let i=0;i<3;i++) {
      effCtx.beginPath();
      effCtx.moveTo(fromX + (Math.random()-0.5)*8, fromY + (Math.random()-0.5)*8);
      effCtx.lineTo(toX + (Math.random()-0.5)*12, toY + (Math.random()-0.5)*12);
      effCtx.strokeStyle = '#ffaa66';
      effCtx.stroke();
    }
    setTimeout(()=> effCtx.clearRect(0,0,effectCanvas.width,effectCanvas.height), 120);
  }
  
  function drawFireEffect(centerX, centerY) {
    if(!effCtx) return;
    effCtx.clearRect(0,0,effectCanvas.width,effectCanvas.height);
    for(let i=0;i<18;i++) {
      effCtx.beginPath();
      let angle = Math.random()*Math.PI*2;
      let rad = 10+Math.random()*32;
      let x = centerX + Math.cos(angle)*rad;
      let y = centerY + Math.sin(angle)*rad;
      effCtx.arc(x, y, 4+Math.random()*8, 0, Math.PI*2);
      effCtx.fillStyle = `rgba(255, ${80+Math.random()*100}, 20, 0.9)`;
      effCtx.fill();
    }
    setTimeout(()=> effCtx.clearRect(0,0,effectCanvas.width,effectCanvas.height), 150);
  }
  
  function drawHealEffect(x, y) {
    if(!effCtx) return;
    effCtx.clearRect(0,0,effectCanvas.width,effectCanvas.height);
    for(let i=0;i<12;i++) {
      effCtx.beginPath();
      effCtx.arc(x + (Math.random()-0.5)*40, y + (Math.random()-0.5)*40, 5+Math.random()*12, 0, Math.PI*2);
      effCtx.fillStyle = `rgba(100, 255, 120, 0.8)`;
      effCtx.fill();
    }
    setTimeout(()=> effCtx.clearRect(0,0,effectCanvas.width,effectCanvas.height), 200);
  }
  
  function showDamagePopup(x, y, damage, isCritical=false, isHeal=false) {
    const pop = document.createElement('div');
    pop.className = 'damage-pop';
    pop.innerText = isHeal ? `+${damage}` : `-${damage}`;
    pop.style.color = isHeal ? '#aaffaa' : (isCritical ? '#ff8844' : '#ffaa66');
    pop.style.fontSize = isCritical ? '1.6rem' : '1.3rem';
    pop.style.left = (x + (Math.random()*30 - 15)) + 'px';
    pop.style.top = (y - 20) + 'px';
    document.getElementById('battleVisual').style.position = 'relative';
    document.getElementById('battleVisual').appendChild(pop);
    setTimeout(()=> pop.remove(), 600);
  }
  
  // ========== ゲームデータ ==========
  let player = {
    level: 1, exp: 0, expToNext: 100,
    baseMaxHp: 68, hp: 68, baseMaxMp: 34, mp: 34,
    baseAtk: 19, baseDef: 9, baseMag: 14,
    gold: 280, defending: false
  };
  let currentWeapon = { name: "銅の剣", atkBonus: 5 };
  let currentArmor = { name: "革の鎧", defBonus: 4 };
  let currentEnemy = null;
  let battling = false;
  
  function getTotalAtk() { return player.baseAtk + currentWeapon.atkBonus; }
  function getTotalDef() { return player.baseDef + currentArmor.defBonus + (player.defending ? 6 : 0); }
  function getMaxHp() { return player.baseMaxHp; }
  function getMaxMp() { return player.baseMaxMp; }
  
  const enemyCatalog = [
    { name: "ゴブリン",     baseHp: 45, atk: 15, def: 6, exp: 48, gold: 45, magDef: 2 },
    { name: "スケルトン",   baseHp: 62, atk: 19, def: 8, exp: 75, gold: 65, magDef: 4 },
    { name: "オーク",       baseHp: 88, atk: 24, def: 11, exp: 120, gold: 95, magDef: 5 },
    { name: "ダークエルフ", baseHp: 80, atk: 28, def: 10, exp: 150, gold: 120, magDef: 8 },
    { name: "シャドウドラゴン", baseHp: 160, atk: 38, def: 16, exp: 340, gold: 280, magDef: 12 }
  ];
  
  function spawnEnemy() {
    let idx = 0;
    if(player.level >= 7) idx = Math.min(4, Math.floor(Math.random() * 2) + 3);
    else if(player.level >= 5) idx = Math.min(3, Math.floor(Math.random() * 2) + 2);
    else if(player.level >= 3) idx = Math.min(2, Math.floor(Math.random() * 2) + 1);
    else idx = Math.floor(Math.random() * 2);
    const base = enemyCatalog[idx];
    const bonus = Math.max(0, player.level-1)*4;
    currentEnemy = {
      name: base.name,
      hp: base.baseHp + Math.floor(bonus*1.2),
      maxHp: base.baseHp + Math.floor(bonus*1.2),
      atk: base.atk + Math.floor(bonus*0.7),
      def: base.def + Math.floor(bonus*0.5),
      magDef: base.magDef + Math.floor(bonus*0.4),
      exp: base.exp + Math.floor(bonus*2.5),
      gold: base.gold + Math.floor(bonus*1.8)
    };
    updateEnemyUI();
    addLog(`⚔️ 強敵 ${currentEnemy.name} が現れた！ (💰 ${currentEnemy.gold}G)`, false);
  }
  
  function updateUI() {
    document.getElementById('hpStat').innerText = player.hp;
    document.getElementById('maxHpStat').innerText = getMaxHp();
    document.getElementById('mpStat').innerText = player.mp;
    document.getElementById('maxMpStat').innerText = getMaxMp();
    document.getElementById('levelStat').innerText = player.level;
    document.getElementById('expStat').innerText = player.exp;
    document.getElementById('nextExp').innerText = player.expToNext;
    document.getElementById('goldAmount').innerText = player.gold;
    document.getElementById('weaponName').innerText = currentWeapon.name;
    document.getElementById('weaponBonus').innerText = currentWeapon.atkBonus;
    document.getElementById('armorName').innerText = currentArmor.name;
    document.getElementById('armorBonus').innerText = currentArmor.defBonus;
    document.getElementById('totalAtk').innerText = getTotalAtk();
    document.getElementById('totalDef').innerText = getTotalDef();
  }
  
  function updateEnemyUI() {
    if(!currentEnemy) return;
    let percent = (currentEnemy.hp / currentEnemy.maxHp) * 100;
    document.getElementById('enemyHpFill').style.width = `${percent}%`;
    document.getElementById('enemyHpText').innerText = Math.max(0, currentEnemy.hp);
    document.getElementById('enemyMaxHp').innerText = currentEnemy.maxHp;
    document.getElementById('enemyName').innerText = currentEnemy.name;
  }
  
  function addLog(msg, isError=false) { const logDiv = document.getElementById('battleLog'); const p = document.createElement('div'); p.innerHTML = `> ${msg}`; p.style.color = isError ? '#ffaa88' : '#bbaa88'; logDiv.appendChild(p); logDiv.scrollTop = logDiv.scrollHeight; if(logDiv.children.length>22) logDiv.removeChild(logDiv.firstChild); }
  
  function gainRewards(exp, gold) { player.exp += exp; player.gold += gold; updateUI(); checkLevelUp(); addLog(`🏆 ${exp} EXP + ${gold} G 獲得！`); }
  
  function checkLevelUp() {
    let leveled = false;
    while(player.exp >= player.expToNext) {
      player.exp -= player.expToNext;
      player.level++;
      player.baseMaxHp += 20; player.hp = getMaxHp();
      player.baseMaxMp += 9; player.mp = getMaxMp();
      player.baseAtk += 6; player.baseDef += 5; player.baseMag += 5;
      player.expToNext = Math.floor(55 + player.level * 34);
      leveled = true;
      addLog(`✨✨ レベル ${player.level} に上昇！ 全回復 ✨✨`);
    }
    if(leveled) { player.hp = getMaxHp(); player.mp = getMaxMp(); updateUI(); }
  }
  
  function applyDamageToEnemy(damage, isMagic=false) {
    let finalDamage = Math.max(1, damage - (isMagic ? Math.floor(currentEnemy.magDef*0.4) : Math.floor(currentEnemy.def*0.35)));
    currentEnemy.hp -= finalDamage;
    updateEnemyUI();
    return finalDamage;
  }
  
  // 戦闘行動
  async function actionAttack() {
    if(!await checkBattle()) return;
    player.defending = false;
    let damage = Math.floor(getTotalAtk() * (0.85 + Math.random()*0.7)) - Math.floor(currentEnemy.def * 0.35);
    damage = Math.max(3, damage);
    const finalDmg = applyDamageToEnemy(damage, false);
    // エフェクト
    const rect = document.getElementById('enemyArea').getBoundingClientRect();
    const visualRect = document.getElementById('battleVisual').getBoundingClientRect();
    const fromX = document.getElementById('playerArea').getBoundingClientRect().left - visualRect.left + 50;
    const fromY = document.getElementById('playerArea').getBoundingClientRect().top - visualRect.top + 50;
    const toX = rect.left - visualRect.left + 48;
    const toY = rect.top - visualRect.top + 48;
    drawSlashEffect(fromX, fromY, toX, toY);
    playBeep('slash');
    playShake();
    showDamagePopup(rect.left + 30, rect.top + 20, finalDmg, finalDmg > 25);
    addLog(`⚔️ 斬撃！ ${currentEnemy.name} に ${finalDmg} ダメージ！`);
    if(currentEnemy.hp <= 0) { enemyDefeated(); return; }
    enemyTurn();
  }
  
  async function actionFire() {
    if(!await checkBattle()) return;
    if(player.mp < 10) { addLog("⚠️ MP不足！", true); battling=false; return; }
    player.mp -= 10; updateUI();
    let damage = Math.floor(player.baseMag * 1.9 + Math.random() * 14);
    const finalDmg = applyDamageToEnemy(damage, true);
    const rect = document.getElementById('enemyArea').getBoundingClientRect();
    const visualRect = document.getElementById('battleVisual').getBoundingClientRect();
    drawFireEffect(rect.left - visualRect.left + 50, rect.top - visualRect.top + 45);
    playBeep('fire');
    playShake();
    showDamagePopup(rect.left + 30, rect.top + 15, finalDmg, finalDmg > 30);
    addLog(`🔥 ファイア！ ${finalDmg} ダメージ！`);
    if(currentEnemy.hp <= 0) { enemyDefeated(); return; }
    enemyTurn();
  }
  
  async function actionIce() {
    if(!await checkBattle()) return;
    if(player.mp < 12) { addLog("⚠️ MP不足！", true); battling=false; return; }
    player.mp -= 12; updateUI();
    let damage = Math.floor(player.baseMag * 2.1 + Math.random() * 12);
    const finalDmg = applyDamageToEnemy(damage, true);
    playShake();
    showDamagePopup(document.getElementById('enemyArea').getBoundingClientRect().left+30, document.getElementById('enemyArea').getBoundingClientRect().top+20, finalDmg);
    addLog(`❄️ ブリザド！ ${finalDmg} ダメージ！`);
    if(currentEnemy.hp <= 0) { enemyDefeated(); return; }
    enemyTurn();
  }
  
  async function actionHeal() {
    if(!await checkBattle()) return;
    if(player.mp < 8) { addLog("⚠️ MP不足！", true); battling=false; return; }
    player.mp -= 8;
    let heal = Math.floor(22 + player.baseMag * 0.7);
    player.hp = Math.min(getMaxHp(), player.hp + heal);
    updateUI();
    const rect = document.getElementById('playerArea').getBoundingClientRect();
    const visualRect = document.getElementById('battleVisual').getBoundingClientRect();
    drawHealEffect(rect.left - visualRect.left + 50, rect.top - visualRect.top + 50);
    playBeep('heal');
    showDamagePopup(rect.left+25, rect.top+15, heal, false, true);
    addLog(`💚 ヒールで ${heal} 回復！`);
    enemyTurn();
  }
  
  async function actionDefend() {
    if(!await checkBattle()) return;
    player.defending = true;
    addLog(`🛡️ 防御態勢！ 次ターンダメージ軽減`);
    battling = false;
    enemyTurn();
  }
  
  async function enemyTurn() {
    if(!currentEnemy || currentEnemy.hp <= 0 || player.hp <= 0) return;
    let damage = Math.max(2, Math.floor(currentEnemy.atk * (0.7 + Math.random()*0.6)) - Math.floor(getTotalDef() * 0.55));
    damage = Math.max(1, damage);
    player.hp -= damage;
    updateUI();
    playShake();
    const rect = document.getElementById('playerArea').getBoundingClientRect();
    showDamagePopup(rect.left+30, rect.top+20, damage);
    addLog(`💢 ${currentEnemy.name} の攻撃！ ${damage} ダメージ！`);
    if(player.hp <= 0) playerDefeat();
    player.defending = false;
    battling = false;
  }
  
  function playerDefeat() {
    addLog("💀 力尽きた… 祠の光が復活させた 💀");
    player.hp = getMaxHp(); player.mp = getMaxMp(); player.defending=false;
    spawnEnemy(); updateUI(); updateEnemyUI(); battling=false;
  }
  
  function enemyDefeated() {
    if(!currentEnemy || currentEnemy.hp>0) return;
    addLog(`🎉 ${currentEnemy.name} を撃破！`);
    gainRewards(currentEnemy.exp, currentEnemy.gold);
    spawnEnemy();
    updateUI();
    battling = false;
  }
  
  async function checkBattle() {
    if(!currentEnemy || currentEnemy.hp<=0) return false;
    if(player.hp<=0) return false;
    if(battling) { addLog("待機中..."); return false; }
    battling = true;
    return true;
  }
  
  function resetGame() {
    if(confirm("全ての進行をリセットしますか？")){
      player = { level:1, exp:0, expToNext:100, baseMaxHp:68, hp:68, baseMaxMp:34, mp:34, baseAtk:19, baseDef:9, baseMag:14, gold:280, defending:false };
      currentWeapon = { name:"銅の剣", atkBonus:5 };
      currentArmor = { name:"革の鎧", defBonus:4 };
      updateUI(); spawnEnemy(); updateEnemyUI(); battling=false; addLog("━━ 冒険をリセットしました ━━");
    }
  }
  
  // ショップ
  const weaponsShop = [
    { name:"鉄の剣", atkBonus:11, price:320, minLv:1 },{ name:"銀の剣", atkBonus:18, price:650, minLv:3 },
    { name:"炎の刃", atkBonus:27, price:1150, minLv:6 },{ name:"竜殺しの剣", atkBonus:38, price:2400, minLv:9 }
  ];
  const armorsShop = [
    { name:"鎖帷子", defBonus:10, price:480, minLv:2 },{ name:"プレートアーマー", defBonus:17, price:950, minLv:5 },
    { name:"竜鱗の鎧", defBonus:26, price:2100, minLv:8 }
  ];
  function renderShop() {
    document.getElementById('shopGold').innerText = player.gold;
    document.getElementById('shopCurWeapon').innerText = currentWeapon.name;
    document.getElementById('shopCurArmor').innerText = currentArmor.name;
    const container = document.getElementById('shopItemsList');
    container.innerHTML = '';
    [...weaponsShop, ...armorsShop].forEach(item => {
      const isWeapon = !!item.atkBonus;
      const isOwned = isWeapon ? (currentWeapon.name === item.name) : (currentArmor.name === item.name);
      const canAfford = player.gold >= item.price;
      const btn = document.createElement('button');
      btn.innerText = isOwned ? '装備中' : '購入';
      btn.className = 'shop-btn';
      if(!canAfford || isOwned) btn.disabled = true;
      btn.onclick = () => {
        if(player.gold < item.price) return;
        player.gold -= item.price;
        if(isWeapon) currentWeapon = { name: item.name, atkBonus: item.atkBonus };
        else currentArmor = { name: item.name, defBonus: item.defBonus };
        updateUI(); renderShop(); addLog(`🏪 ${item.name} を購入＆装備！`);
      };
      const div = document.createElement('div'); div.className = 'shop-item';
      div.innerHTML = `<div><strong>${item.name}</strong> ${isWeapon ? `攻撃+${item.atkBonus}` : `防御+${item.defBonus}`}  💰${item.price}G</div>`;
      div.appendChild(btn);
      container.appendChild(div);
    });
  }
  document.getElementById('shopBtn').onclick = () => { renderShop(); document.getElementById('shopOverlay').classList.add('show'); };
  document.getElementById('closeShopBtn').onclick = () => document.getElementById('shopOverlay').classList.remove('show');
  document.getElementById('attackBtn').onclick = actionAttack;
  document.getElementById('fireBtn').onclick = actionFire;
  document.getElementById('iceBtn').onclick = actionIce;
  document.getElementById('healBtn').onclick = actionHeal;
  document.getElementById('defendBtn').onclick = actionDefend;
  document.getElementById('resetBtn').onclick = resetGame;
  
  // 画像・初期化
  const playerCanvas = document.getElementById('playerCanvas'), playerCtx = playerCanvas.getContext('2d');
  const enemyCanvas = document.getElementById('enemyCanvas'), enemyCtx = enemyCanvas.getContext('2d');
  function drawPixelFallback(ctx, type) {
    ctx.clearRect(0,0,96,96); ctx.fillStyle='#1a1a2a'; ctx.fillRect(0,0,96,96);
    if(type==='player'){ ctx.fillStyle='#5f8b6f'; ctx.fillRect(36,28,24,32); ctx.fillStyle='#c8a96e'; ctx.fillRect(52,36,8,4); ctx.fillStyle='#f5f0dc'; ctx.fillRect(40,24,6,6); }
    else{ ctx.fillStyle='#6a4a3a'; ctx.fillRect(32,32,32,28); ctx.fillStyle='#aa6644'; ctx.fillRect(36,24,8,10); ctx.fillStyle='#fff0c0'; ctx.fillRect(48,24,6,6); }
  }
  let playerImg = new Image(), enemyImg = new Image();
  playerImg.onload = () => { playerCtx.drawImage(playerImg,0,0,96,96); };
  enemyImg.onload = () => { enemyCtx.drawImage(enemyImg,0,0,96,96); };
  playerImg.src = 'player.png'; enemyImg.src = 'enemy.png';
  playerImg.onerror = () => drawPixelFallback(playerCtx,'player');
  enemyImg.onerror = () => drawPixelFallback(enemyCtx,'enemy');
  setTimeout(()=>{ resizeEffectCanvas(); updateUI(); spawnEnemy(); }, 100);
  window.addEventListener('resize', resizeEffectCanvas);
</script>
</body>
</html>
